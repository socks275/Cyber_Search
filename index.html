<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_SEARCH v7.0 // Multi-Source Engine & YouTube Video Terminal</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Cyberpunk Typography & Styles -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap');
    
    * {
      font-family: 'Fira Code', monospace;
      box-sizing: border-box;
    }
    
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    body {
      background-color: #030712;
      color: #06b6d4;
      overflow: hidden;
    }

    /* Cyber Matrix Grid Background */
    .grid-bg {
      background-image: 
        linear-gradient(to right, rgba(6, 182, 212, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Cyber Glassmorphism Containers */
    .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(6, 182, 212, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .glow-cyan {
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
    }

    .glow-red {
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
    }

    .tab-active {
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.25) 0%, rgba(15, 23, 42, 0.95) 100%);
      border-bottom: 2px solid #06b6d4;
      color: #38bdf8;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #030712;
    }
    ::-webkit-scrollbar-thumb {
      background: #0891b2;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #06b6d4;
    }

    /* Source Tag Styling */
    .source-tag-ddg { background: rgba(249, 115, 22, 0.15); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.4); }
    .source-tag-wiki { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.4); }
    .source-tag-hn { background: rgba(234, 88, 12, 0.15); color: #f97316; border: 1px solid rgba(234, 88, 12, 0.4); }
    .source-tag-yt { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
  </style>
</head>
<body class="h-full w-screen overflow-hidden flex flex-col grid-bg select-none">

  <header class="glass-panel px-4 py-2 flex items-center justify-between border-b border-cyan-500/30 z-40">
    <div class="flex items-center space-x-3">
      <div onclick="goHome()" class="cursor-pointer flex items-center text-cyan-400 font-bold tracking-widest text-xs px-2.5 py-1 rounded bg-cyan-950/60 border border-cyan-500/40 hover:bg-cyan-900/50 transition">
        <i data-lucide="cpu" class="w-4 h-4 mr-2 text-cyan-400 animate-pulse"></i>
        <span class="font-orbitron font-black">CYBER<span class="text-sky-300">_SEARCH</span> <span class="text-[9px] text-cyan-400/70 border border-cyan-500/30 px-1 py-0.5 rounded ml-1 font-mono">v7.0</span></span>
      </div>
    </div>

    <!-- Central Smart Omnibox -->
    <div class="flex-1 max-w-3xl mx-4 flex items-center space-x-2">
      <button onclick="goHome()" class="p-1.5 hover:bg-cyan-950/60 rounded text-cyan-400 border border-cyan-800/40 transition" title="Home Launchpad">
        <i data-lucide="home" class="w-4 h-4"></i>
      </button>

      <div class="relative flex-1 flex items-center">
        <i data-lucide="globe" class="w-4 h-4 absolute left-3 text-cyan-500"></i>
        <input 
          id="omnibox" 
          type="text" 
          placeholder="Search query or enter direct URL (e.g., youtube.com, https://youtube.com/watch?v=...)" 
          class="w-full bg-slate-950/90 border border-cyan-500/40 rounded px-9 py-1.5 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 glow-cyan transition"
          onkeydown="if(event.key === 'Enter') handleSearchSubmit()"
        >
      </div>

      <button onclick="handleSearchSubmit()" class="px-4 py-1.5 bg-cyan-600/30 border border-cyan-400 text-cyan-300 rounded text-xs hover:bg-cyan-500/40 font-semibold transition flex items-center space-x-1">
        <i data-lucide="zap" class="w-3.5 h-3.5"></i>
        <span>EXECUTE</span>
      </button>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="openNewTab()" class="p-1.5 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 rounded border border-cyan-400/50 flex items-center text-xs space-x-1 transition">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">NEW TAB</span>
      </button>
    </div>
  </header>

  <!-- TAB STRIP BAR -->
  <div id="tabBar" class="bg-slate-950/80 border-b border-cyan-500/20 px-3 flex items-center space-x-1 overflow-x-auto h-9 text-xs"></div>

  <!-- MAIN VIEWPORT DISPLAY AREA -->
  <main id="viewportContainer" class="flex-1 relative bg-slate-950/90 overflow-hidden"></main>

  <!-- IN-APP VIDEO MODAL OVERLAY -->
  <div id="videoModal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-4xl glass-panel rounded-xl overflow-hidden border border-cyan-400/50 shadow-2xl flex flex-col">
      <div class="flex items-center justify-between px-4 py-2 bg-slate-900 border-b border-cyan-500/30 text-xs">
        <div class="flex items-center space-x-2 text-cyan-300 font-bold truncate">
          <i data-lucide="video" class="w-4 h-4 text-red-400"></i>
          <span id="videoModalTitle">CYBER MEDIA PLAYER</span>
        </div>
        <div class="flex items-center space-x-2">
          <a id="videoModalDirectLink" href="#" target="_blank" class="px-2 py-1 bg-cyan-950 border border-cyan-500/40 rounded text-[10px] text-cyan-300 hover:bg-cyan-900/50">
            OPEN EXTERNAL <i data-lucide="external-link" class="w-3 h-3 inline ml-1"></i>
          </a>
          <button onclick="closeVideoModal()" class="p-1 text-slate-400 hover:text-white rounded">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      <div class="relative w-full aspect-video bg-black flex items-center justify-center" id="videoModalBody">
        <!-- Dynamic video player inserted here -->
      </div>
    </div>
  </div>

  <!-- SYSTEM STATUS FOOTER -->
  <footer class="glass-panel px-4 py-1 flex justify-between items-center text-[10px] text-cyan-500/70 border-t border-cyan-500/30">
    <div class="flex items-center space-x-3">
      <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> AGGREGATOR ENGINE: ACTIVE</span>
      <span class="hidden md:inline text-slate-600">|</span>
      <span class="hidden md:inline text-slate-400">SOURCES: DuckDuckGo, Wikipedia, HackerNews, YouTube Direct Player</span>
    </div>
    <div class="flex items-center space-x-4">
      <span>ACTIVE TABS: <span id="tabCount" class="text-cyan-300">1</span></span>
      <span id="clock" class="font-mono">00:00:00</span>
    </div>
  </footer>

  <script>
    const WORKER_PROXY_URL = "https://small-hill-0227.mac-for-chrome.workers.dev/";

    let tabs = [];
    let activeTabId = null;
    let searchPageState = {}; // Stores page offset & results per tab

    const SPEED_DIALS = [
      { name: 'Wikipedia', query: 'site:wikipedia.org Quantum Computing', icon: 'book-open', color: 'text-slate-300' },
      { name: 'YouTube Tech', query: 'Artificial Intelligence 2026', icon: 'video', color: 'text-red-400' },
      { name: 'GitHub Search', query: 'GitHub open source web scrapers', icon: 'code', color: 'text-purple-400' },
      { name: 'HackerNews', query: 'Cybersecurity zero day exploits', icon: 'newspaper', color: 'text-orange-400' },
      { name: 'Tech Reviews', query: 'Cyberpunk tech aesthetic hardware review', icon: 'cpu', color: 'text-cyan-400' },
      { name: 'YouTube Direct', query: 'youtube.com', icon: 'play-circle', color: 'text-red-500' }
    ];

    window.onload = () => {
      openNewTab();
      setInterval(updateClock, 1000);
      updateClock();
      lucide.createIcons();
    };

    function updateClock() {
      document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
    }

    function isYouTubeDomain(url) {
      if (!url) return false;
      const clean = url.trim().toLowerCase();
      // Detect youtube domain homepage/root without exact video parameters
      const ytDomainRegex = /^(https?:\/\/)?(www\.)?youtube\.com\/?$/i;
      const ytShortRegex = /^youtube(\.com)?\/?$/i;
      return ytDomainRegex.test(clean) || ytShortRegex.test(clean);
    }

    function extractYouTubeVideoId(url) {
      if (!url) return null;
      try {
        if (url.includes('youtube.com/watch')) {
          const u = new URL(url.startsWith('http') ? url : 'https://' + url);
          return u.searchParams.get('v');
        }
        if (url.includes('youtu.be/')) {
          const parts = url.split('youtu.be/')[1].split('?')[0].split('/');
          return parts[0];
        }
        if (url.includes('youtube.com/embed/')) {
          const parts = url.split('youtube.com/embed/')[1].split('?')[0].split('/');
          return parts[0];
        }
      } catch (e) {
        console.warn("Failed to parse YouTube ID:", e);
      }
      return null;
    }

    function openNewTab(url = 'nexus://newtab') {
      const id = 'tab_' + Date.now();
      const isSearch = url.startsWith('search://');
      const isYtPortal = isYouTubeDomain(url);

      let title = 'Cyber Launchpad';
      if (isSearch) {
        title = `Search: ${decodeURIComponent(url.replace('search://', ''))}`;
      } else if (isYtPortal) {
        title = 'YouTube Portal';
      } else if (url !== 'nexus://newtab') {
        title = getDomainName(url);
      }

      const tab = { id, title, url };
      tabs.push(tab);
      renderTabs();
      switchTab(id);
    }

    function closeTab(id, e) {
      if (e) e.stopPropagation();
      if (tabs.length === 1) {
        tabs = [];
        openNewTab();
        return;
      }

      tabs = tabs.filter(t => t.id !== id);
      delete searchPageState[id];

      const container = document.getElementById('viewport_' + id);
      if (container) container.remove();

      if (activeTabId === id) {
        switchTab(tabs[tabs.length - 1].id);
      } else {
        renderTabs();
      }
    }

    function switchTab(id) {
      activeTabId = id;
      renderTabs();
      renderViewports();
      
      const tab = tabs.find(t => t.id === id);
      if (tab) {
        let displayVal = '';
        if (tab.url.startsWith('search://')) {
          displayVal = decodeURIComponent(tab.url.replace('search://', ''));
        } else if (tab.url !== 'nexus://newtab') {
          displayVal = tab.url;
        }
        document.getElementById('omnibox').value = displayVal;
      }
    }

    function renderTabs() {
      const tabBar = document.getElementById('tabBar');
      document.getElementById('tabCount').innerText = tabs.length;
      tabBar.innerHTML = '';

      tabs.forEach(tab => {
        const isActive = tab.id === activeTabId;
        const el = document.createElement('div');
        el.className = `flex items-center space-x-2 px-3 py-1 rounded-t border-t border-x border-cyan-500/20 cursor-pointer min-w-[140px] max-w-[210px] justify-between transition ${isActive ? 'tab-active font-semibold' : 'text-cyan-500/70 hover:bg-slate-900/50'}`;
        el.onclick = () => switchTab(tab.id);

        let iconName = 'globe';
        if (tab.url === 'nexus://newtab') iconName = 'layout-grid';
        if (tab.url.startsWith('search://')) iconName = 'search';
        if (isYouTubeDomain(tab.url) || extractYouTubeVideoId(tab.url)) iconName = 'video';

        el.innerHTML = `
          <div class="flex items-center space-x-1.5 overflow-hidden">
            <i data-lucide="${iconName}" class="w-3.5 h-3.5 shrink-0 ${iconName === 'video' ? 'text-red-400' : ''}"></i>
            <span class="truncate text-[11px]">${escapeHtml(tab.title)}</span>
          </div>
          <button onclick="closeTab('${tab.id}', event)" class="hover:text-cyan-200 rounded p-0.5">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        `;
        tabBar.appendChild(el);
      });
      lucide.createIcons();
    }

    function renderViewports() {
      const container = document.getElementById('viewportContainer');
      
      tabs.forEach(tab => {
        let vp = document.getElementById('viewport_' + tab.id);
        if (!vp) {
          vp = document.createElement('div');
          vp.id = 'viewport_' + tab.id;
          vp.className = 'w-full h-full absolute inset-0';
          container.appendChild(vp);
          loadTabContent(tab, vp);
        }
        
        vp.style.display = (tab.id === activeTabId) ? 'block' : 'none';
      });
    }

    function loadTabContent(tab, element) {
      if (tab.url === 'nexus://newtab') {
        element.innerHTML = getNewTabHTML(tab.id);
        attachNewTabEvents(tab.id);
      } else if (isYouTubeDomain(tab.url)) {
        element.innerHTML = getYouTubePortalHTML(tab.id);
        attachYouTubePortalEvents(tab.id);
      } else if (tab.url.startsWith('search://')) {
        const query = decodeURIComponent(tab.url.replace('search://', ''));
        searchPageState[tab.id] = { page: 0, query: query };
        renderSearchResultsPage(tab, element, query);
      } else {
        renderWebPageContent(tab, element, tab.url);
      }
      lucide.createIcons();
    }

    function getYouTubePortalHTML(tabId) {
      return `
        <div class="w-full h-full overflow-y-auto p-6 md:p-12 flex flex-col items-center justify-center bg-slate-950">
          <div class="max-w-2xl w-full glass-panel p-8 rounded-2xl border border-red-500/40 glow-red space-y-6 text-center">
            
            <div class="flex items-center justify-center space-x-3 text-red-400">
              <i data-lucide="video-off" class="w-10 h-10 animate-bounce"></i>
              <h2 class="text-2xl font-bold font-orbitron tracking-wide text-white">YOUTUBE_FRAMING_NOTICE</h2>
            </div>

            <div class="bg-red-950/40 border border-red-500/30 p-4 rounded-xl text-left space-y-2">
              <p class="text-xs text-red-300 font-semibold flex items-center">
                <i data-lucide="shield-alert" class="w-4 h-4 mr-2 text-red-400 shrink-0"></i>
                Direct YouTube Homepage Framing Restricted
              </p>
              <p class="text-xs text-slate-300 leading-relaxed">
                YouTube blocks full homepage loading inside third-party web frames via strict <code class="text-red-300 bg-red-950/60 px-1 py-0.5 rounded">X-Frame-Options / CSP</code> security policies. 
              </p>
              <p class="text-xs text-cyan-300 leading-relaxed">
                <strong class="text-white">Solution:</strong> Enter an exact YouTube video link (e.g. <code class="text-cyan-200">https://www.youtube.com/watch?v=...</code>) or type a video title below to launch the video player instantly!
              </p>
            </div>

            <!-- Notice Direct Link / Query Input Box -->
            <div class="space-y-3 pt-2">
              <div class="relative flex items-center">
                <i data-lucide="youtube" class="w-5 h-5 absolute left-4 text-red-400"></i>
                <input 
                  id="ytPortalInput_${tabId}"
                  type="text" 
                  placeholder="Paste video URL (https://youtube.com/watch?v=...) or search video query..." 
                  class="w-full bg-slate-900 border-2 border-red-500/40 rounded-xl px-12 py-3 text-xs text-cyan-100 placeholder-slate-500 focus:outline-none focus:border-red-400 glow-red transition"
                >
              </div>

              <div class="flex items-center justify-center space-x-3">
                <button 
                  id="ytPortalBtn_${tabId}" 
                  class="px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow-lg flex items-center space-x-2 font-orbitron transition"
                >
                  <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                  <span>PLAY VIDEO</span>
                </button>
                <button 
                  onclick="goHome()" 
                  class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl border border-slate-600 transition"
                >
                  CANCEL
                </button>
              </div>
            </div>

            <!-- Popular Quick Demo Videos -->
            <div class="pt-4 border-t border-slate-800 text-left">
              <p class="text-[10px] text-cyan-400 font-mono mb-2">QUICK_LAUNCH_PRESETS:</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                <button 
                  onclick="navigateCurrentTab('https://www.youtube.com/watch?v=jfKfPfyJRdk')"
                  class="p-2 bg-slate-900/80 border border-cyan-500/20 hover:border-cyan-400 rounded text-left flex items-center space-x-2 text-slate-300 hover:text-cyan-200 transition"
                >
                  <i data-lucide="music" class="w-4 h-4 text-cyan-400 shrink-0"></i>
                  <span class="truncate">Lofi Hip Hop Radio - Beats to Relax</span>
                </button>
                <button 
                  onclick="navigateCurrentTab('https://www.youtube.com/watch?v=dQw4w9WgXcQ')"
                  class="p-2 bg-slate-900/80 border border-cyan-500/20 hover:border-cyan-400 rounded text-left flex items-center space-x-2 text-slate-300 hover:text-cyan-200 transition"
                >
                  <i data-lucide="disc" class="w-4 h-4 text-purple-400 shrink-0"></i>
                  <span class="truncate">Rick Astley - Never Gonna Give You Up</span>
                </button>
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function attachYouTubePortalEvents(tabId) {
      const input = document.getElementById(`ytPortalInput_${tabId}`);
      const btn = document.getElementById(`ytPortalBtn_${tabId}`);

      if (input && btn) {
        const executeYT = () => {
          const val = input.value.trim();
          if (!val) return;

          const videoId = extractYouTubeVideoId(val);
          if (videoId) {
            navigateCurrentTab(`https://www.youtube.com/watch?v=${videoId}`);
          } else if (val.startsWith('http://') || val.startsWith('https://')) {
            navigateCurrentTab(val);
          } else {
            // Treat as query for videos
            navigateCurrentTab('search://' + encodeURIComponent(val));
          }
        };

        btn.onclick = executeYT;
        input.onkeydown = (e) => { if (e.key === 'Enter') executeYT(); };
      }
    }

    async function fetchViaWorker(targetUrl) {
      const proxyUrl = `${WORKER_PROXY_URL}?url=${encodeURIComponent(targetUrl)}`;
      const response = await fetch(proxyUrl);
      if (!response.ok) throw new Error("Proxy Error: " + response.status);
      return await response.text();
    }

    async function searchDuckDuckGo(query) {
      try {
        const targetSearchUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
        const htmlText = await fetchViaWorker(targetSearchUrl);
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const results = doc.querySelectorAll('.result');

        const parsedResults = [];
        results.forEach((res) => {
          const titleEl = res.querySelector('.result__title a');
          const snippetEl = res.querySelector('.result__snippet');

          if (titleEl) {
            let href = titleEl.getAttribute('href') || '';
            if (href.includes('uddg=')) {
              href = decodeURIComponent(href.split('uddg=')[1].split('&')[0]);
            }
            if (href.startsWith('http')) {
              const isYt = href.includes('youtube.com') || href.includes('youtu.be');
              parsedResults.push({
                source: isYt ? 'YOUTUBE' : 'DUCKDUCKGO',
                tagClass: isYt ? 'source-tag-yt' : 'source-tag-ddg',
                title: titleEl.textContent.trim(),
                url: href,
                snippet: snippetEl ? snippetEl.textContent.trim() : 'Scraped web result via DuckDuckGo engine pipeline.'
              });
            }
          }
        });
        return parsedResults;
      } catch (err) {
        console.warn("DuckDuckGo engine fetch error:", err);
        return [];
      }
    }

    async function searchWikipedia(query, page = 0) {
      try {
        const offset = page * 10;
        const wikiUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=10&sroffset=${offset}&format=json&origin=*`;
        const res = await fetch(wikiUrl);
        const data = await res.json();
        
        if (!data.query || !data.query.search) return [];

        return data.query.search.map(item => ({
          source: 'WIKIPEDIA',
          tagClass: 'source-tag-wiki',
          title: item.title,
          url: `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title.replace(/ /g, '_'))}`,
          snippet: item.snippet.replace(/<\/?[^>]+(>|$)/g, "") + "..."
        }));
      } catch (err) {
        console.warn("Wikipedia engine error:", err);
        return [];
      }
    }

    async function searchHackerNews(query, page = 0) {
      try {
        const hnUrl = `https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(query)}&page=${page}&hitsPerPage=10`;
        const res = await fetch(hnUrl);
        const data = await res.json();

        if (!data.hits) return [];

        return data.hits.filter(item => item.url || item.story_url).map(item => ({
          source: 'HACKERNEWS',
          tagClass: 'source-tag-hn',
          title: item.title || item.story_title || 'Hacker News Thread',
          url: item.url || item.story_url,
          snippet: `Points: ${item.points || 0} | Author: ${item.author || 'anon'} | Comments: ${item.num_comments || 0}`
        }));
      } catch (err) {
        console.warn("HackerNews engine error:", err);
        return [];
      }
    }

    async function renderSearchResultsPage(tab, element, query) {
      element.innerHTML = `
        <div class="w-full h-full overflow-y-auto p-4 md:p-8">
          <div class="max-w-5xl mx-auto space-y-6 pb-12">
            <div class="border-b border-cyan-500/30 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-2">
              <div>
                <p class="text-[10px] font-mono text-cyan-400 tracking-wider">AGGREGATED MULTI-SOURCE SEARCH RESULTS FOR</p>
                <h2 class="text-xl font-bold font-orbitron text-cyan-200">"${escapeHtml(query)}"</h2>
              </div>
              <div id="statusIndicator_${tab.id}" class="text-xs text-cyan-400 flex items-center space-x-2">
                <i data-lucide="loader" class="w-4 h-4 animate-spin text-cyan-400"></i>
                <span id="engineStatus_${tab.id}" class="font-mono">QUERYING ENGINES...</span>
              </div>
            </div>

            <!-- Merged Search Stream -->
            <div id="resultsList_${tab.id}" class="space-y-4"></div>

            <!-- DYNAMIC PAGINATION: "GET RESULTS" BUTTON -->
            <div class="pt-6 flex flex-col items-center justify-center space-y-2">
              <button 
                id="getResultsBtn_${tab.id}" 
                onclick="getMoreResults('${tab.id}')" 
                class="px-8 py-2.5 bg-cyan-950/90 border border-cyan-400/60 text-cyan-300 rounded-xl text-xs hover:bg-cyan-900/80 hover:border-cyan-300 font-bold tracking-wider transition flex items-center space-x-2 shadow-[0_0_15px_rgba(6,182,212,0.2)]"
              >
                <i data-lucide="arrow-down-circle" class="w-4 h-4 text-cyan-400"></i>
                <span>GET RESULTS</span>
              </button>
              <span class="text-[10px] text-slate-500 font-mono">Fetches next page set across DuckDuckGo, Wikipedia & HackerNews</span>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();

      await fetchAndStreamResults(tab.id, query, 0, false);
    }

    async function fetchAndStreamResults(tabId, query, page, append = false) {
      const listContainer = document.getElementById(`resultsList_${tabId}`);
      const statusInd = document.getElementById(`statusIndicator_${tabId}`);

      // Query multiple search providers concurrently
      const [ddgRes, wikiRes, hnRes] = await Promise.allSettled([
        searchDuckDuckGo(query),
        searchWikipedia(query, page),
        searchHackerNews(query, page)
      ]);

      let combined = [];
      if (ddgRes.status === 'fulfilled') combined.push(...ddgRes.value);
      if (wikiRes.status === 'fulfilled') combined.push(...wikiRes.value);
      if (hnRes.status === 'fulfilled') combined.push(...hnRes.value);

      // Deduplicate results by URL
      const uniqueMap = new Map();
      combined.forEach(item => {
        if (item.url && !uniqueMap.has(item.url)) {
          uniqueMap.set(item.url, item);
        }
      });

      const uniqueResults = Array.from(uniqueMap.values());

      if (statusInd) statusInd.style.display = 'none';

      if (uniqueResults.length === 0) {
        if (!append) {
          listContainer.innerHTML = `
            <div class="glass-panel p-6 rounded-xl border border-cyan-500/30 text-center space-y-3">
              <i data-lucide="alert-triangle" class="w-8 h-8 text-amber-400 mx-auto"></i>
              <p class="text-xs text-cyan-300 font-bold">NO RESULTS RETURNED FROM PRIMARY PIPELINES</p>
              <p class="text-xs text-slate-400 max-w-md mx-auto">Try typing a direct video or site URL into the omnibox (e.g. <code class="text-cyan-300">https://youtube.com/watch?v=...</code>).</p>
            </div>
          `;
          lucide.createIcons();
        }
        return;
      }

      let itemsHTML = '';
      uniqueResults.forEach(res => {
        const ytId = extractYouTubeVideoId(res.url);
        
        itemsHTML += `
          <div class="glass-panel p-4 rounded-xl border border-cyan-500/20 hover:border-cyan-400/60 transition flex flex-col md:flex-row justify-between items-start gap-4">
            <div class="flex-1 space-y-1.5">
              <div class="flex items-center space-x-2">
                <span class="text-[9px] font-bold px-2 py-0.5 rounded ${res.tagClass}">${res.source}</span>
                <span class="text-[10px] text-cyan-400/70 truncate max-w-md font-mono">${escapeHtml(res.url)}</span>
              </div>

              <a href="#" onclick="openResultUrl('${escapeHtml(res.url)}'); return false;" class="text-sm font-bold text-sky-300 hover:text-cyan-200 transition underline underline-offset-4 decoration-cyan-500/40">
                ${escapeHtml(res.title)}
              </a>
              
              <p class="text-xs text-slate-300 leading-relaxed">${escapeHtml(res.snippet)}</p>
            </div>

            <!-- ACTION BUTTONS: IN-APP EMBED, POPUP MODAL, DIRECT LINK -->
            <div class="flex flex-wrap md:flex-col items-stretch gap-1.5 shrink-0 w-full md:w-auto">
              ${ytId ? `
                <button onclick="playInModal('${escapeHtml(res.url)}', '${escapeHtml(res.title)}')" class="px-3 py-1.5 bg-red-950/80 border border-red-500/50 text-red-300 text-xs rounded hover:bg-red-900/80 flex items-center justify-center space-x-1.5 font-bold transition">
                  <i data-lucide="play" class="w-3.5 h-3.5 text-red-400"></i>
                  <span>PLAY VIDEO</span>
                </button>
              ` : ''}

              <button onclick="openResultUrl('${escapeHtml(res.url)}')" class="px-3 py-1.5 bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 text-xs rounded hover:bg-cyan-900/80 flex items-center justify-center space-x-1.5 transition">
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                <span>OPEN TAB</span>
              </button>
            </div>
          </div>
        `;
      });

      if (append) {
        listContainer.innerHTML += itemsHTML;
      } else {
        listContainer.innerHTML = itemsHTML;
      }
      lucide.createIcons();
    }

    async function getMoreResults(tabId) {
      if (!searchPageState[tabId]) return;

      searchPageState[tabId].page += 1;
      const currentPage = searchPageState[tabId].page;
      const query = searchPageState[tabId].query;

      const btn = document.getElementById(`getResultsBtn_${tabId}`);
      if (btn) {
        btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin text-cyan-400"></i><span>FETCHING MORE RESULTS...</span>`;
        lucide.createIcons();
      }

      await fetchAndStreamResults(tabId, query, currentPage, true);

      if (btn) {
        btn.innerHTML = `<i data-lucide="arrow-down-circle" class="w-4 h-4 text-cyan-400"></i><span>GET RESULTS</span>`;
        lucide.createIcons();
      }
    }

    function renderWebPageContent(tab, element, url) {
      const ytId = extractYouTubeVideoId(url);

      if (ytId) {
        // High-compatibility nocookie embed for YouTube videos
        const embedUrl = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&modestbranding=1&rel=0`;
        element.innerHTML = `
          <div class="w-full h-full bg-slate-950 flex flex-col justify-between">
            <div class="px-4 py-2 bg-slate-900 border-b border-cyan-500/30 flex items-center justify-between text-xs">
              <div class="flex items-center space-x-2 text-cyan-300 font-bold truncate">
                <i data-lucide="video" class="w-4 h-4 text-red-400"></i>
                <span class="truncate">${escapeHtml(url)}</span>
              </div>
              <div class="flex items-center space-x-2">
                <button onclick="playInModal('${escapeHtml(url)}', '${escapeHtml(tab.title)}')" class="px-2.5 py-1 bg-red-950 border border-red-500/40 text-red-300 rounded hover:bg-red-900 text-[10px]">
                  POPUP MODAL
                </button>
                <a href="${escapeHtml(url)}" target="_blank" class="px-2.5 py-1 bg-cyan-950 border border-cyan-500/40 text-cyan-300 rounded hover:bg-cyan-900 text-[10px]">
                  DIRECT LINK
                </a>
              </div>
            </div>

            <div class="flex-1 relative bg-black flex items-center justify-center">
              <iframe 
                src="${escapeHtml(embedUrl)}" 
                class="w-full h-full border-0 absolute inset-0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
              ></iframe>
            </div>
          </div>
        `;
      } else {
        // Standard Web Viewport Frame
        element.innerHTML = `
          <div class="w-full h-full relative bg-slate-950">
            <iframe 
              src="${escapeHtml(url)}" 
              class="w-full h-full border-0"
              sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
            ></iframe>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function playInModal(rawUrl, title) {
      const modal = document.getElementById('videoModal');
      const body = document.getElementById('videoModalBody');
      const titleEl = document.getElementById('videoModalTitle');
      const directLink = document.getElementById('videoModalDirectLink');

      const ytId = extractYouTubeVideoId(rawUrl);
      const embedUrl = ytId ? `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&modestbranding=1&rel=0` : rawUrl;

      titleEl.innerText = title || rawUrl;
      directLink.href = rawUrl;

      body.innerHTML = `
        <iframe 
          src="${escapeHtml(embedUrl)}" 
          class="w-full h-full border-0 absolute inset-0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      `;

      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal');
      const body = document.getElementById('videoModalBody');
      body.innerHTML = '';
      modal.classList.add('hidden');
    }

    function openResultUrl(url) {
      openNewTab(url);
    }

    function handleSearchSubmit() {
      const input = document.getElementById('omnibox').value.trim();
      if (!input) return;

      if (isYouTubeDomain(input)) {
        navigateCurrentTab('https://youtube.com');
      } else if (extractYouTubeVideoId(input)) {
        const id = extractYouTubeVideoId(input);
        navigateCurrentTab(`https://www.youtube.com/watch?v=${id}`);
      } else if (input.startsWith('http://') || input.startsWith('https://') || (input.includes('.') && !input.includes(' '))) {
        let target = input.startsWith('http') ? input : 'https://' + input;
        if (isYouTubeDomain(target)) {
          navigateCurrentTab('https://youtube.com');
        } else {
          navigateCurrentTab(target);
        }
      } else {
        navigateCurrentTab('search://' + encodeURIComponent(input));
      }
    }

    function navigateCurrentTab(url) {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;

      tab.url = url;
      if (isYouTubeDomain(url)) {
        tab.title = 'YouTube Portal';
      } else if (url.startsWith('search://')) {
        const query = decodeURIComponent(url.replace('search://', ''));
        tab.title = `Search: ${query}`;
      } else {
        tab.title = getDomainName(url);
      }
      
      const vp = document.getElementById('viewport_' + tab.id);
      if (vp) loadTabContent(tab, vp);
      renderTabs();
    }

    function goHome() {
      navigateCurrentTab('nexus://newtab');
    }

    function getNewTabHTML(tabId) {
      return `
        <div class="w-full h-full overflow-y-auto p-6 md:p-12 flex flex-col items-center justify-between">
          <div class="w-full max-w-4xl flex flex-col items-center">
            
            <div class="text-center my-6">
              <div class="inline-flex items-center space-x-2 bg-cyan-950/60 border border-cyan-500/40 px-3 py-1 rounded-full text-xs text-cyan-400 mb-3 glow-cyan">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span class="font-mono">MULTI-ENGINE WEB & YOUTUBE TERMINAL</span>
              </div>
              <h1 class="text-3xl md:text-5xl font-extrabold font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-500">
                CYBER<span class="text-white">_SEARCH</span> <span class="text-lg text-cyan-400 font-mono">v7.0</span>
              </h1>
              <p class="text-xs font-mono text-cyan-500/70 mt-2">Scrape, Query, and Stream Across Open Web Networks</p>
            </div>

            <!-- Central Omnibox Search -->
            <div class="w-full max-w-2xl relative my-4">
              <div class="relative flex items-center">
                <i data-lucide="search" class="w-5 h-5 absolute left-4 text-cyan-400"></i>
                <input 
                  id="tabSearchInput_${tabId}"
                  type="text" 
                  placeholder="Type search query or paste YouTube video / web URL..." 
                  class="w-full bg-slate-900/90 border-2 border-cyan-500/50 rounded-xl px-12 py-3 text-sm text-cyan-100 placeholder-cyan-600 focus:outline-none focus:border-cyan-300 glow-cyan transition"
                >
                <button 
                  id="tabSearchBtn_${tabId}"
                  class="absolute right-3 px-4 py-1.5 bg-cyan-500 text-slate-950 font-bold text-xs rounded-lg hover:bg-cyan-400 transition font-orbitron"
                >
                  SEARCH
                </button>
              </div>
            </div>

            <!-- Speed Dial Shortcuts -->
            <div class="w-full max-w-3xl mt-8">
              <h3 class="text-xs font-semibold text-cyan-500 tracking-wider mb-4 text-left font-mono">POPULAR_SEARCH_PRESETS</h3>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                ${SPEED_DIALS.map(dial => `
                  <button 
                    onclick="navigateCurrentTab('${dial.query === 'youtube.com' ? 'https://youtube.com' : 'search://' + encodeURIComponent(dial.query)}')"
                    class="glass-panel p-3 rounded-lg flex flex-col items-center hover:border-cyan-400 hover:bg-cyan-950/40 transition group"
                  >
                    <div class="p-2.5 rounded-full bg-slate-900/80 mb-2 border border-cyan-500/20 group-hover:scale-110 transition">
                      <i data-lucide="${dial.icon}" class="w-5 h-5 ${dial.color}"></i>
                    </div>
                    <span class="text-xs text-cyan-300 font-medium truncate w-full text-center font-mono">${dial.name}</span>
                  </button>
                `).join('')}
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function attachNewTabEvents(tabId) {
      const input = document.getElementById(`tabSearchInput_${tabId}`);
      const btn = document.getElementById(`tabSearchBtn_${tabId}`);

      if (input && btn) {
        const execute = () => {
          const val = input.value.trim();
          if (!val) return;
          if (isYouTubeDomain(val)) {
            navigateCurrentTab('https://youtube.com');
          } else if (extractYouTubeVideoId(val)) {
            const id = extractYouTubeVideoId(val);
            navigateCurrentTab(`https://www.youtube.com/watch?v=${id}`);
          } else if (val.startsWith('http://') || val.startsWith('https://') || (val.includes('.') && !val.includes(' '))) {
            let target = val.startsWith('http') ? val : 'https://' + val;
            navigateCurrentTab(target);
          } else {
            navigateCurrentTab('search://' + encodeURIComponent(val));
          }
        };

        btn.onclick = execute;
        input.onkeydown = (e) => { if (e.key === 'Enter') execute(); };
      }
    }

    function getDomainName(url) {
      try {
        return new URL(url).hostname.replace('www.', '');
      } catch(e) {
        return url.length > 18 ? url.substring(0, 18) + '...' : url;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
