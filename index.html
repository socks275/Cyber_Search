<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Search</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fff;color:#202124}
body{overflow-x:hidden}

.top{
  height:64px;
  display:flex;
  align-items:center;
  padding:0 28px;
  border-bottom:1px solid #eee;
  gap:20px;
}

.logo{
  font-size:25px;
  font-weight:700;
  letter-spacing:-1px;
  color:#4285f4;
}

.logo span:nth-child(2){color:#ea4335}
.logo span:nth-child(3){color:#fbbc05}
.logo span:nth-child(4){color:#4285f4}
.logo span:nth-child(5){color:#34a853}

.search{
  width:min(760px,70vw);
  height:46px;
  border:1px solid #dfe1e5;
  border-radius:24px;
  display:flex;
  align-items:center;
  padding:0 15px;
  box-shadow:0 1px 4px #00000012;
}

.search:focus-within{
  box-shadow:0 2px 8px #00000020;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  font-size:16px;
}

.search button{
  border:0;
  background:none;
  cursor:pointer;
  font-size:20px;
}

.engine{
  margin:18px auto;
  width:min(1000px,94%);
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  background:#fafafa;
}

.flow{
  display:grid;
  grid-template-columns:1fr 35px 1fr 35px 1fr;
  align-items:center;
  gap:8px;
}

.stage{
  padding:12px;
  background:white;
  border:1px solid #e5e7eb;
  border-radius:10px;
}

.stage b{
  display:block;
  font-size:12px;
}

.stage small{
  color:#777;
}

.arrow{
  text-align:center;
  font-size:22px;
  color:#4285f4;
}

.status{
  margin-top:10px;
  font-size:12px;
  color:#777;
}

.bar{
  height:3px;
  background:#e5e7eb;
  overflow:hidden;
  margin-top:8px;
  border-radius:10px;
}

.bar i{
  display:block;
  width:30%;
  height:100%;
  background:#4285f4;
  animation:move 1s linear infinite;
}

@keyframes move{
  from{transform:translateX(-150%)}
  to{transform:translateX(400%)}
}

.content{
  width:min(1000px,94%);
  margin:auto;
}

.overview{
  background:#f8faff;
  border:1px solid #d9e5ff;
  border-radius:12px;
  padding:18px;
  margin-bottom:22px;
}

.overview h2{
  font-size:19px;
  margin:0 0 12px;
}

.overview p{
  line-height:1.6;
  margin:8px 0;
}

.result{
  padding:16px 0;
  border-bottom:1px solid #eee;
}

.result-url{
  color:#188038;
  font-size:13px;
  margin-bottom:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.result-title{
  color:#1a0dab;
  font-size:20px;
  margin-bottom:5px;
  cursor:pointer;
}

.result-title:hover{
  text-decoration:underline;
}

.result-snippet{
  color:#4d5156;
  line-height:1.5;
}

.score{
  float:right;
  font-size:10px;
  color:#888;
}

.reader{
  margin-top:20px;
  padding:28px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  background:white;
}

.reader h1{
  font-size:34px;
  line-height:1.2;
}

.reader h2{
  margin-top:30px;
}

.reader p{
  font-size:17px;
  line-height:1.8;
}

.reader img{
  max-width:100%;
  height:auto;
  border-radius:8px;
}

.reader a{
  color:#1a73e8;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
  margin-top:15px;
}

.video{
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  background:white;
}

.video iframe{
  width:100%;
  aspect-ratio:16/9;
  border:0;
}

.video div{
  padding:10px;
  font-weight:600;
}

.loading{
  padding:30px 0;
  color:#777;
}

.empty{
  padding:60px 0;
  text-align:center;
  color:#777;
}

@media(max-width:650px){
  .top{padding:0 12px}
  .logo{font-size:20px}
  .search{width:100%}
  .flow{grid-template-columns:1fr}
  .arrow{display:none}
}
</style>
</head>

<body>

<header class="top">

  <div class="logo">
    <span>C</span><span>y</span><span>b</span><span>e</span><span>r</span>
  </div>

  <form class="search" id="searchForm">
    <input
      id="searchInput"
      autocomplete="off"
      placeholder="Search the web..."
    >
    <button type="submit">⌕</button>
  </form>

</header>

<section class="engine">

  <div class="flow">

    <div class="stage">
      <b>CRAWLING</b>
      <small>Discover and download webpages</small>
    </div>

    <div class="arrow">→</div>

    <div class="stage">
      <b>INDEXING</b>
      <small>Analyze and store information</small>
    </div>

    <div class="arrow">→</div>

    <div class="stage">
      <b>RANKING</b>
      <small>Find the most relevant results</small>
    </div>

  </div>

  <div class="status" id="status">
    Ready
  </div>

  <div class="bar">
    <i></i>
  </div>

</section>

<main class="content" id="content">

  <div class="empty">
    Search for something to begin.
  </div>

</main>

<script>

/*
============================================================
CYBER SEARCH
GOOGLE-STYLE CRAWL → INDEX → RANK ENGINE
============================================================
*/

const DB_NAME = "cyber-search-index-v1";

let index = {};

try{
  index = JSON.parse(
    localStorage.getItem(DB_NAME) || "{}"
  );
}catch{
  index = {};
}


/*
============================================================
UTILITY
============================================================
*/

function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function tokens(text){

  return String(text || "")
    .toLowerCase()
    .replace(/https?:\/\/\S+/g," ")
    .replace(/[^a-z0-9\s]/g," ")
    .split(/\s+/)
    .filter(x => x.length > 1);
}


function saveIndex(){

  try{

    localStorage.setItem(
      DB_NAME,
      JSON.stringify(index)
    );

  }catch(e){

    /*
    Browser storage can become full.
    Keep the newest 300 documents.
    */

    const pages =
      Object.values(index)
      .sort(
        (a,b)=>
          b.crawledAt-a.crawledAt
      )
      .slice(0,300);

    index={};

    pages.forEach(
      page =>
        index[page.url]=page
    );

    localStorage.setItem(
      DB_NAME,
      JSON.stringify(index)
    );
  }
}


/*
============================================================
PROXY
============================================================

The proxy converts many webpages into readable text that
browser JavaScript can access.

This is NOT Google's private crawler.
It is our own miniature crawler.
*/

async function proxyFetch(url){

  const proxy =
    "https://r.jina.ai/" + url;

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      ()=>controller.abort(),
      10000
    );

  try{

    const response =
      await fetch(
        proxy,
        {
          signal:controller.signal
        }
      );

    if(!response.ok)
      throw new Error("HTTP "+response.status);

    return await response.text();

  }finally{

    clearTimeout(timeout);
  }
}


/*
============================================================
PAGE PARSER
============================================================
*/

function parsePage(url,text){

  let title =
    text.match(
      /^#\s+(.+)$/m
    )?.[1];

  if(!title){

    try{
      title =
        new URL(url)
        .hostname
        .replace(/^www\./,"");

    }catch{
      title=url;
    }
  }


  const links=[];

  const linkRegex =
    /\[[^\]]+\]\((https?:\/\/[^)]+)\)/g;

  let match;

  while(
    (match=linkRegex.exec(text))
  ){

    links.push(match[1]);
  }


  const images=[];

  const imageRegex =
    /!\[[^\]]*\]\(([^)]+)\)/g;

  while(
    (match=imageRegex.exec(text))
  ){

    images.push(match[1]);
  }


  const clean =
    text
      .replace(
        /!\[[^\]]*\]\([^)]*\)/g,
        " "
      )
      .replace(
        /\[([^\]]+)\]\([^)]*\)/g,
        "$1"
      )
      .replace(
        /[#>*`]/g,
        " "
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  const words =
    tokens(
      title+" "+clean
    );


  const frequencies={};

  words.forEach(
    word =>
      frequencies[word] =
        (frequencies[word]||0)+1
  );


  return {

    url,
    title,
    text:clean,

    links,
    images,

    words,
    frequencies,

    crawledAt:
      Date.now()
  };
}


/*
============================================================
INDEXING
============================================================
*/

function indexPage(page){

  if(!page)
    return;

  index[page.url]=page;

  saveIndex();
}


/*
============================================================
CRAWLER
============================================================
*/

async function crawl(url){

  try{

    updateStatus(
      "Crawling "+url
    );

    const markdown =
      await proxyFetch(url);

    if(!markdown)
      return null;

    const page =
      parsePage(
        url,
        markdown
      );

    indexPage(page);

    return page;

  }catch(error){

    console.warn(
      "Crawler failed:",
      url,
      error
    );

    return null;
  }
}


/*
============================================================
DISCOVER SEARCH RESULTS
============================================================

We use public search pages as discovery sources.

The actual ranking happens locally.
*/

async function discover(query){

  const urls=[];

  const engines=[

    "https://www.google.com/search?q="+
    encodeURIComponent(query),

    "https://www.google.co.uk/search?q="+
    encodeURIComponent(query),

    "https://html.duckduckgo.com/html/?q="+
    encodeURIComponent(query)

  ];


  const pages =
    await Promise.allSettled(
      engines.map(
        url =>
          proxyFetch(url)
      )
    );


  pages.forEach(result=>{

    if(result.status!=="fulfilled")
      return;

    const matches =
      result.value.match(
        /https?:\/\/[^\s<>"')\]]+/g
      ) || [];


    matches.forEach(url=>{

      url =
        url.replace(
          /[.,;:]+$/,
          ""
        );

      try{

        const host =
          new URL(url)
          .hostname;

        if(
          host.includes("google.") ||
          host.includes("duckduckgo.")
        )
          return;

        urls.push(url);

      }catch{}

    });

  });


  return [
    ...new Set(urls)
  ].slice(0,12);
}


/*
============================================================
RANKING
============================================================
*/

function rank(query){

  const queryWords =
    [...new Set(
      tokens(query)
    )];

  const phrase =
    query.toLowerCase();


  const results =
    Object.values(index)
    .map(page=>{

      let score=0;
      let matched=0;


      queryWords.forEach(word=>{

        const frequency =
          page.frequencies[word]||0;

        if(frequency)
          matched++;


        /*
        Term frequency
        */

        score +=
          Math.min(
            frequency,
            15
          ) * 2;


        /*
        Title relevance
        */

        if(
          page.title
            .toLowerCase()
            .includes(word)
        ){

          score += 25;
        }


        /*
        URL relevance
        */

        if(
          page.url
            .toLowerCase()
            .includes(word)
        ){

          score += 8;
        }


        /*
        Body relevance
        */

        if(
          page.text
            .toLowerCase()
            .includes(word)
        ){

          score += 3;
        }

      });


      /*
      Exact phrase.
      */

      if(
        page.text
          .toLowerCase()
          .includes(phrase)
      ){

        score += 35;
      }


      /*
      Exact title.
      */

      if(
        page.title
          .toLowerCase()
          === phrase
      ){

        score += 60;
      }


      /*
      Query coverage.
      */

      const coverage =
        queryWords.length
          ? matched/queryWords.length
          : 0;


      score +=
        coverage*30;


      /*
      Freshness.
      */

      const age =
        (
          Date.now() -
          page.crawledAt
        ) /
        86400000;


      score +=
        Math.max(
          0,
          10-age
        );


      return {

        ...page,

        score,

        coverage

      };

    });


  return results
    .sort(
      (a,b)=>
        b.score-a.score
    );
}


/*
============================================================
SEARCH
============================================================
*/

async function search(query){

  updateStatus(
    "Searching index..."
  );


  /*
  First search our index.
  */

  let results =
    rank(query);


  /*
  If our index doesn't have
  enough information, crawl.
  */

  if(
    results.length < 5 ||
    !results[0] ||
    results[0].score < 15
  ){

    updateStatus(
      "Crawling the web..."
    );


    const urls =
      await discover(query);


    /*
    Crawl multiple pages in parallel.
    */

    await Promise.all(
      urls
        .slice(0,10)
        .map(
          url =>
            crawl(url)
        )
    );


    /*
    Search the newly-created index.
    */

    updateStatus(
      "Ranking results..."
    );


    results =
      rank(query);
  }


  updateStatus(
    "Results ready"
  );


  return results;
}


/*
============================================================
ANSWER OVERVIEW
============================================================
*/

function createOverview(
  query,
  results
){

  if(!results.length){

    return `
      <div class="overview">

        <h2>
          No indexed results yet
        </h2>

        <p>
          The crawler could not retrieve
          enough public pages for this query.
        </p>

      </div>
    `;
  }


  const top =
    results
      .slice(0,3);


  const explanation =
    top
      .map(
        page =>
          page.text
            .slice(0,350)
      )
      .join(" ");


  return `

    <div class="overview">

      <h2>
        Overview
      </h2>

      <p>
        The search engine crawled public
        webpages, indexed their content,
        and ranked the pages according to
        their relevance to
        <b>${escapeHTML(query)}</b>.
      </p>

      <p>
        ${escapeHTML(
          explanation
        )}
      </p>

    </div>

  `;
}


/*
============================================================
RESULT DISPLAY
============================================================
*/

function displayResults(
  query,
  results
){

  const content =
    document.getElementById(
      "content"
    );


  if(!results.length){

    content.innerHTML=`

      <div class="empty">

        No results found.

      </div>

    `;

    return;
  }


  let html =
    createOverview(
      query,
      results
    );


  results
    .slice(0,20)
    .forEach(
      (result,index)=>{

        html += `

          <article
            class="result"
          >

            <div class="score">
              ${result.score.toFixed(1)}
            </div>

            <div class="result-url">
              ${escapeHTML(
                result.url
              )}
            </div>

            <div
              class="result-title"
              onclick="
                openResult(
                  ${index}
                )
              "
            >
              ${escapeHTML(
                result.title
              )}
            </div>

            <div class="result-snippet">

              ${escapeHTML(
                result.text.slice(
                  0,
                  280
                )
              )}

            </div>

          </article>

        `;
      }
    );


  content.innerHTML =
    html;


  window.currentResults =
    results;
}


/*
============================================================
OPEN RESULT
============================================================
*/

async function openResult(
  indexNumber
){

  const result =
    window.currentResults[
      indexNumber
    ];

  if(!result)
    return;


  updateStatus(
    "Reading webpage..."
  );


  const content =
    document.getElementById(
      "content"
    );


  try{

    const markdown =
      await proxyFetch(
        result.url
      );


    if(markdown){

      content.innerHTML = `

        <button
          onclick="
            displayResults(
              lastQuery,
              currentResults
            )
          "
          style="
            border:0;
            background:none;
            color:#1a73e8;
            cursor:pointer;
            margin-bottom:20px;
          "
        >
          ← Back to results
        </button>

        <article class="reader">

          <h1>
            ${escapeHTML(
              result.title
            )}
          </h1>

          ${markdownToHTML(
            markdown,
            result.url
          )}

        </article>

      `;

    }else{

      /*
      Automatic iframe fallback.
      */

      content.innerHTML = `

        <button
          onclick="
            displayResults(
              lastQuery,
              currentResults
            )
          "
          style="
            border:0;
            background:none;
            color:#1a73e8;
            cursor:pointer;
            margin-bottom:20px;
          "
        >
          ← Back to results
        </button>

        <div class="reader">

          <h1>
            ${escapeHTML(
              result.title
            )}
          </h1>

          <iframe
            src="${escapeHTML(
              result.url
            )}"
            style="
              width:100%;
              height:75vh;
              border:1px solid #ddd;
              border-radius:10px;
            "
          ></iframe>

        </div>

      `;
    }

  }catch{

    window.open(
      result.url,
      "_blank"
    );
  }


  updateStatus(
    "Reading complete"
  );
}


/*
============================================================
MARKDOWN READER
============================================================
*/

function markdownToHTML(
  markdown,
  baseURL
){

  let html =
    escapeHTML(
      markdown
    );


  html =
    html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );


  html =
    html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );


  html =
    html.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );


  /*
  Images
  */

  html =
    html.replace(
      /!\[([^\]]*)\]\(([^)]+)\)/g,
      (_,alt,url)=>{

        try{

          url =
            new URL(
              url,
              baseURL
            ).href;

        }catch{}

        return `

          <img
            src="${escapeHTML(url)}"
            alt="${escapeHTML(alt)}"
            loading="lazy"
          >

        `;
      }
    );


  /*
  Links
  */

  html =
    html.replace(
      /\[([^\]]+)\]\(([^)]+)\)/g,
      (_,text,url)=>{

        try{

          url =
            new URL(
              url,
              baseURL
            ).href;

        }catch{}

        return `

          <a
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener"
          >
            ${text}
          </a>

        `;
      }
    );


  /*
  Paragraphs
  */

  html =
    html.replace(
      /\n{2,}/g,
      "</p><p>"
    );


  return `<p>${html}</p>`;
}


/*
============================================================
STATUS
============================================================
*/

function updateStatus(
  text
){

  document.getElementById(
    "status"
  ).textContent=text;
}


/*
============================================================
FORM
============================================================
*/

let lastQuery="";
let currentResults=[];


document
  .getElementById(
    "searchForm"
  )
  .addEventListener(
    "submit",
    async event=>{

      event.preventDefault();


      const input =
        document.getElementById(
          "searchInput"
        );


      const query =
        input.value.trim();


      if(!query)
        return;


      lastQuery=query;


      document
        .getElementById(
          "content"
        )
        .innerHTML=`

          <div class="loading">

            Crawling → Indexing → Ranking...

          </div>

        `;


      const results =
        await search(
          query
        );


      currentResults =
        results;


      displayResults(
        query,
        results
      );

    }
  );


/*
============================================================
STARTUP
============================================================
*/

updateStatus(
  "Ready • "+
  Object.keys(index).length+
  " pages indexed"
);

</script>

</body>
</html>
