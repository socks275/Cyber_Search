<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_SEARCH // Universal Web Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Fira Code', monospace; }
    body { background-color: #030712; color: #06b6d4; }
    .grid-bg {
      background-image: 
        linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.25);
    }
    .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); }
    .tab-active {
      background: rgba(6, 182, 212, 0.2);
      border-bottom: 2px solid #06b6d4;
      color: #38bdf8;
    }
    .reader-mode img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      border: 1px solid rgba(6, 182, 212, 0.3);
      margin: 1rem 0;
      display: block;
    }
    .reader-mode video, .reader-mode audio {
      width: 100%;
      margin: 1rem 0;
      border-radius: 0.5rem;
    }
    .reader-mode a {
      color: #38bdf8;
      text-decoration: underline;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #0891b2; border-radius: 3px; }
  </style>
</head>
<body class="h-full w-screen overflow-hidden flex flex-col grid-bg select-none">

  <!-- TOP OMNIBOX HEADER -->
  <header class="glass-panel px-4 py-2 flex items-center justify-between border-b border-cyan-500/30 z-50">
    <div class="flex items-center space-x-3">
      <div onclick="goHome()" class="cursor-pointer flex items-center text-cyan-400 font-bold tracking-widest text-xs px-2.5 py-1 rounded bg-cyan-950/60 border border-cyan-500/40 hover:bg-cyan-900/50 transition">
        <i data-lucide="search" class="w-4 h-4 mr-2 text-cyan-400"></i>
        <span>CYBER_SEARCH</span>
      </div>
    </div>

    <!-- Central Search/URL Input -->
    <div class="flex-1 max-w-3xl mx-4 flex items-center space-x-2">
      <button onclick="goHome()" class="p-1.5 hover:bg-cyan-950/60 rounded text-cyan-400 border border-cyan-800/40 transition" title="Home">
        <i data-lucide="home" class="w-4 h-4"></i>
      </button>

      <div class="relative flex-1 flex items-center">
        <i data-lucide="globe" class="w-4 h-4 absolute left-3 text-cyan-500"></i>
        <input 
          id="omnibox" 
          type="text" 
          placeholder="Search query (e.g. news, tech, science) or enter any website / YouTube URL..." 
          class="w-full bg-slate-950/90 border border-cyan-500/40 rounded px-9 py-1.5 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 glow-cyan transition"
          onkeydown="if(event.key === 'Enter') handleSearchSubmit()"
        >
      </div>

      <button onclick="handleSearchSubmit()" class="px-4 py-1.5 bg-cyan-600/30 border border-cyan-400 text-cyan-300 rounded text-xs hover:bg-cyan-500/40 font-semibold transition">
        EXECUTE
      </button>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="openNewTab()" class="p-1.5 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 rounded border border-cyan-400/50 flex items-center text-xs space-x-1">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">NEW TAB</span>
      </button>
    </div>
  </header>

  <!-- TAB BAR -->
  <div id="tabBar" class="bg-slate-950/80 border-b border-cyan-500/20 px-3 flex items-center space-x-1 overflow-x-auto h-9 text-xs"></div>

  <!-- MAIN VIEWPORT CONTAINER -->
  <main id="viewportContainer" class="flex-1 relative bg-slate-950/90 overflow-hidden"></main>

  <!-- STATUS FOOTER -->
  <footer class="glass-panel px-4 py-1 flex justify-between items-center text-[10px] text-cyan-500/70 border-t border-cyan-500/30">
    <div class="flex items-center space-x-3">
      <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> AGGREGATOR ENGINE: ACTIVE (DDG + WIKI + HN + ARCHIVE)</span>
    </div>
    <div class="flex items-center space-x-4">
      <span>TABS: <span id="tabCount">1</span></span>
      <span id="clock">00:00:00</span>
    </div>
  </footer>

  <script>
    // Robust CORS Proxies
    const PROXIES = [
      "https://small-hill-0227.mac-for-chrome.workers.dev/?url=",
      "https://api.allorigins.win/raw?url="
    ];

    let tabs = [];
    let activeTabId = null;
    let searchOffsets = {};

    const SPEED_DIALS = [
      { name: 'Google News', query: 'Google Latest World News', icon: 'newspaper' },
      { name: 'YouTube Tech', query: 'site:youtube.com tech review', icon: 'video' },
      { name: 'GitHub Repos', query: 'GitHub open source trending', icon: 'code' },
      { name: 'Reddit Discussions', query: 'Reddit technology trends', icon: 'message-square' },
      { name: 'Wikipedia', query: 'Wikipedia Free Encyclopedia', icon: 'book-open' },
      { name: 'Internet Archive', query: 'Internet Archive digital library', icon: 'archive' }
    ];

    // Websites known to load iframe natively without x-frame blocks
    const NATIVE_EMBED_DOMAINS = [
      'youtube.com', 'youtu.be', 'vimeo.com', 'wikipedia.org', 
      'archive.org', 'codepen.io', 'jsfiddle.net', 'soundcloud.com', 'spotify.com'
    ];

    window.onload = () => {
      openNewTab();
      setInterval(updateClock, 1000);
      updateClock();
      lucide.createIcons();
    };

    function updateClock() {
      document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
    }

    function openNewTab(url = 'nexus://newtab') {
      const id = 'tab_' + Date.now();
      const isSearch = url.startsWith('search://');
      const searchTerms = isSearch ? decodeURIComponent(url.replace('search://', '')) : '';

      const tab = {
        id: id,
        title: isSearch ? `Search: ${searchTerms}` : (url === 'nexus://newtab' ? 'Cyber Launchpad' : getDomainName(url)),
        url: url
      };
      
      tabs.push(tab);
      renderTabs();
      switchTab(id);
    }

    function closeTab(id, e) {
      if (e) e.stopPropagation();
      if (tabs.length === 1) {
        tabs = [];
        openNewTab();
        return;
      }

      tabs = tabs.filter(t => t.id !== id);
      const container = document.getElementById('viewport_' + id);
      if (container) container.remove();

      if (activeTabId === id) {
        switchTab(tabs[tabs.length - 1].id);
      } else {
        renderTabs();
      }
    }

    function switchTab(id) {
      activeTabId = id;
      renderTabs();
      renderViewports();
      
      const tab = tabs.find(t => t.id === id);
      if (tab) {
        let displayVal = '';
        if (tab.url.startsWith('search://')) {
          displayVal = decodeURIComponent(tab.url.replace('search://', ''));
        } else if (tab.url !== 'nexus://newtab') {
          displayVal = tab.url;
        }
        document.getElementById('omnibox').value = displayVal;
      }
    }

    function renderTabs() {
      const tabBar = document.getElementById('tabBar');
      document.getElementById('tabCount').innerText = tabs.length;
      tabBar.innerHTML = '';

      tabs.forEach(tab => {
        const isActive = tab.id === activeTabId;
        const el = document.createElement('div');
        el.className = `flex items-center space-x-2 px-3 py-1 rounded-t border-t border-x border-cyan-500/20 cursor-pointer min-w-[140px] max-w-[210px] justify-between transition ${isActive ? 'tab-active font-semibold' : 'text-cyan-500/70 hover:bg-slate-900/50'}`;
        el.onclick = () => switchTab(tab.id);

        let iconName = 'globe';
        if (tab.url === 'nexus://newtab') iconName = 'layout-grid';
        if (tab.url.startsWith('search://')) iconName = 'search';
        if (tab.url.includes('youtube.com') || tab.url.includes('youtu.be')) iconName = 'video';

        el.innerHTML = `
          <div class="flex items-center space-x-1.5 overflow-hidden">
            <i data-lucide="${iconName}" class="w-3.5 h-3.5 shrink-0"></i>
            <span class="truncate text-[11px]">${escapeHtml(tab.title)}</span>
          </div>
          <button onclick="closeTab('${tab.id}', event)" class="hover:text-cyan-200 rounded p-0.5">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        `;
        tabBar.appendChild(el);
      });
      lucide.createIcons();
    }

    function renderViewports() {
      const container = document.getElementById('viewportContainer');
      
      tabs.forEach(tab => {
        let vp = document.getElementById('viewport_' + tab.id);
        if (!vp) {
          vp = document.createElement('div');
          vp.id = 'viewport_' + tab.id;
          vp.className = 'w-full h-full absolute inset-0';
          container.appendChild(vp);
          loadTabContent(tab, vp);
        }
        
        vp.style.display = (tab.id === activeTabId) ? 'block' : 'none';
      });
    }

    function loadTabContent(tab, element) {
      if (tab.url === 'nexus://newtab') {
        element.innerHTML = getNewTabHTML(tab.id);
        attachNewTabEvents(tab.id);
      } else if (tab.url.startsWith('search://')) {
        const query = decodeURIComponent(tab.url.replace('search://', ''));
        searchOffsets[tab.id] = 0;
        renderSearchResultsPage(tab, element, query);
      } else {
        processWebOrMediaUrl(tab, element, tab.url);
      }
      lucide.createIcons();
    }

    /* WEBPAGE & MEDIA RENDERER */
    function processWebOrMediaUrl(tab, element, url) {
      // 1. YouTube Handler
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const videoId = extractYouTubeId(url);
        if (videoId) {
          const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
          element.innerHTML = `
            <div class="w-full h-full flex flex-col bg-black">
              <div class="bg-slate-900 border-b border-cyan-500/30 px-4 py-2 flex justify-between items-center text-xs">
                <span class="text-cyan-400 font-bold flex items-center"><i data-lucide="play-circle" class="w-4 h-4 mr-2"></i> YOUTUBE EMBEDDED PLAYER</span>
                <a href="${escapeHtml(url)}" target="_blank" class="text-cyan-500 hover:underline flex items-center space-x-1">
                  <span>Open External</span> <i data-lucide="external-link" class="w-3 h-3"></i>
                </a>
              </div>
              <div class="flex-1 w-full h-full">
                <iframe 
                  src="${embedUrl}" 
                  class="w-full h-full border-0" 
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                  allowfullscreen
                ></iframe>
              </div>
            </div>
          `;
        } else {
          element.innerHTML = `
            <div class="w-full h-full flex flex-col items-center justify-center p-6 text-center">
              <div class="glass-panel p-8 rounded-xl max-w-xl border border-yellow-500/40 glow-cyan">
                <i data-lucide="alert-triangle" class="w-12 h-12 text-yellow-400 mx-auto mb-4"></i>
                <h2 class="text-lg font-bold text-yellow-300 mb-2">Please give exact link</h2>
                <p class="text-xs text-slate-300 mb-6 leading-relaxed">
                  YouTube homepages/channels restrict framing. 
                  Please enter a direct video URL (e.g. <code class="text-cyan-300">https://www.youtube.com/watch?v=...</code>).
                </p>
                <div class="flex justify-center space-x-3">
                  <button onclick="goHome()" class="px-4 py-2 bg-slate-800 border border-cyan-500/40 text-cyan-300 rounded text-xs hover:bg-slate-700">Back to Launchpad</button>
                  <a href="${escapeHtml(url)}" target="_blank" class="px-4 py-2 bg-cyan-600 border border-cyan-400 text-slate-950 font-bold rounded text-xs hover:bg-cyan-500 flex items-center space-x-1">
                    <span>Open YouTube Direct</span> <i data-lucide="external-link" class="w-3 h-3"></i>
                  </a>
                </div>
              </div>
            </div>
          `;
        }
        lucide.createIcons();
        return;
      }

      // 2. Native Embed Platforms
      const isEmbeddable = NATIVE_EMBED_DOMAINS.some(domain => url.toLowerCase().includes(domain));
      if (isEmbeddable) {
        element.innerHTML = `
          <div class="w-full h-full relative bg-black">
            <iframe 
              src="${escapeHtml(url)}" 
              class="w-full h-full border-0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
        `;
        return;
      }

      // 3. Universal Proxy Reader Mode for All Web Domains
      renderReaderModePage(element, url);
    }

    function extractYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function fetchProxyData(url) {
      for (const proxy of PROXIES) {
        try {
          const res = await fetch(`${proxy}${encodeURIComponent(url)}`);
          if (res.ok) {
            const text = await res.text();
            if (text && text.length > 50) return text;
          }
        } catch (e) {
          console.warn("Proxy attempt failed:", proxy, e);
        }
      }
      throw new Error("All proxy servers failed to retrieve content");
    }

    /* READER MODE FOR ALL OTHER WEBSITES (Extracts Text, Images & Media) */
    async function renderReaderModePage(element, url) {
      element.innerHTML = `
        <div class="w-full h-full flex flex-col items-center justify-center p-8">
          <div class="text-center space-y-3">
            <i data-lucide="loader" class="w-8 h-8 text-cyan-400 animate-spin mx-auto"></i>
            <p class="text-xs text-cyan-300 tracking-wider">FETCHING CONTENT FROM WEB DOMAIN...</p>
            <p class="text-[10px] text-slate-400">${escapeHtml(url)}</p>
          </div>
        </div>
      `;
      lucide.createIcons();

      try {
        const rawHtml = await fetchProxyData(url);
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHtml, 'text/html');

        // Fix image & media links relative paths
        const baseUrl = new URL(url);
        doc.querySelectorAll('img').forEach(img => {
          try {
            const src = img.getAttribute('src');
            if (src) img.src = new URL(src, baseUrl).href;
          } catch(e){}
        });
        doc.querySelectorAll('video, audio, source').forEach(media => {
          try {
            const src = media.getAttribute('src');
            if (src) media.src = new URL(src, baseUrl).href;
          } catch(e){}
        });

        // Extract Title & Main Body Content
        const title = doc.querySelector('title')?.innerText || url;
        const mainContent = doc.querySelector('article, main, #content, .content, body')?.innerHTML || doc.body.innerHTML;

        element.innerHTML = `
          <div class="w-full h-full overflow-y-auto p-4 md:p-8 bg-slate-950">
            <div class="max-w-4xl mx-auto space-y-6">
              
              <!-- Reader Mode Header -->
              <div class="glass-panel p-4 rounded-xl border border-cyan-500/40 flex justify-between items-center">
                <div>
                  <span class="text-[10px] text-cyan-400 font-bold tracking-widest block mb-1">[CYBER_SEARCH PROXY READER]</span>
                  <h1 class="text-base font-bold text-cyan-100 truncate max-w-xl">${escapeHtml(title)}</h1>
                </div>
                <a href="${escapeHtml(url)}" target="_blank" class="px-3 py-1.5 bg-cyan-600/30 border border-cyan-400 text-cyan-300 rounded text-xs hover:bg-cyan-500/40 flex items-center space-x-1">
                  <span>Open External</span>
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </a>
              </div>

              <!-- Page Content -->
              <div class="glass-panel p-6 md:p-10 rounded-xl border border-cyan-500/20 reader-mode text-slate-300 text-sm leading-relaxed space-y-4 select-text">
                ${mainContent}
              </div>

            </div>
          </div>
        `;
      } catch (err) {
        console.error("Reader Mode Fetch Error:", err);
        element.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center p-6 text-center">
            <div class="glass-panel p-8 rounded-xl max-w-lg border border-red-500/40">
              <i data-lucide="shield-alert" class="w-10 h-10 text-red-400 mx-auto mb-3"></i>
              <h2 class="text-sm font-bold text-red-300 mb-2">ACCESS RESTRICTED BY TARGET WEBSITE</h2>
              <p class="text-xs text-slate-400 mb-4">This server refused to be embedded. Click below to view directly in browser.</p>
              <a href="${escapeHtml(url)}" target="_blank" class="px-4 py-2 bg-cyan-600 border border-cyan-400 text-slate-950 font-bold rounded text-xs hover:bg-cyan-500 inline-flex items-center space-x-1">
                <span>Open Direct in Browser</span> <i data-lucide="external-link" class="w-3 h-3"></i>
              </a>
            </div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    /* MULTI-ENGINE GOOGLE-LIKE AGGREGATED SEARCH ENGINES */
    
    // 1. DuckDuckGo Web Engine
    async function searchDuckDuckGo(query) {
      const targetSearchUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
      const rawHtml = await fetchProxyData(targetSearchUrl);
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHtml, 'text/html');
      const results = doc.querySelectorAll('.result');

      const parsed = [];
      results.forEach((res, i) => {
        if (i >= 10) return;
        const titleEl = res.querySelector('.result__title a');
        const snippetEl = res.querySelector('.result__snippet');

        if (titleEl) {
          let href = titleEl.getAttribute('href') || '';
          if (href.includes('uddg=')) {
            href = decodeURIComponent(href.split('uddg=')[1].split('&')[0]);
          }
          parsed.push({
            title: titleEl.textContent.trim(),
            url: href,
            snippet: snippetEl ? snippetEl.textContent.trim() : 'Click to load full website.',
            source: 'WEB'
          });
        }
      });
      return parsed;
    }

    // 2. Wikipedia Search Engine
    async function searchWikipedia(query, offset = 0) {
      const wikiUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=8&sroffset=${offset}&format=json&origin=*`;
      const res = await fetch(wikiUrl);
      const data = await res.json();
      
      if (!data.query || !data.query.search) return [];

      return data.query.search.map(item => ({
        title: item.title,
        url: `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title.replace(/ /g, '_'))}`,
        snippet: item.snippet.replace(/<\/?[^>]+(>|$)/g, "") + "...",
        source: 'WIKIPEDIA'
      }));
    }

    // 3. Hacker News & Web Discussions Search
    async function searchHackerNews(query) {
      const hnUrl = `https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(query)}&hitsPerPage=8`;
      const res = await fetch(hnUrl);
      const data = await res.json();
      
      if (!data.hits) return [];

      return data.hits.map(item => ({
        title: item.title || item.story_title || 'Web Discussion',
        url: item.url || `https://news.ycombinator.com/item?id=${item.objectID}`,
        snippet: `Points: ${item.points || 0} | Author: ${item.author} | Comments: ${item.num_comments || 0}`,
        source: 'HACKER NEWS'
      }));
    }

    // Combined Search Execution
    async function searchAllEngines(query, offset = 0) {
      let combined = [];

      // Fetch from DuckDuckGo, Wikipedia & Hacker News concurrently
      const results = await Promise.allSettled([
        searchDuckDuckGo(query),
        searchWikipedia(query, offset),
        searchHackerNews(query)
      ]);

      results.forEach(res => {
        if (res.status === 'fulfilled' && Array.isArray(res.value)) {
          combined = combined.concat(res.value);
        }
      });

      // Deduplicate by URL
      const unique = [];
      const seen = new Set();

      combined.forEach(item => {
        if (item.url && !seen.has(item.url)) {
          seen.add(item.url);
          unique.push(item);
        }
      });

      return unique;
    }

    async function renderSearchResultsPage(tab, element, query) {
      element.innerHTML = `
        <div class="w-full h-full overflow-y-auto p-4 md:p-8">
          <div class="max-w-4xl mx-auto space-y-6">
            <div class="border-b border-cyan-500/20 pb-4 flex items-center justify-between">
              <div>
                <p class="text-xs text-cyan-500/70">ALL WEB RESULTS FOR</p>
                <h2 class="text-lg font-bold text-cyan-200">"${escapeHtml(query)}"</h2>
              </div>
              <div id="statusIndicator_${tab.id}" class="text-xs text-cyan-400 animate-pulse flex items-center space-x-1.5">
                <i data-lucide="loader" class="w-4 h-4 animate-spin"></i>
                <span id="engineStatus_${tab.id}">SCANNING ALL WEBSITES...</span>
              </div>
            </div>

            <div id="resultsList_${tab.id}" class="space-y-4"></div>

            <div class="pt-4 flex justify-center">
              <button id="getResultsBtn_${tab.id}" onclick="getMoreResults('${tab.id}', '${escapeHtml(query)}')" class="px-6 py-2 bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 rounded-lg text-xs hover:bg-cyan-900/60 font-semibold transition flex items-center space-x-2 glow-cyan">
                <i data-lucide="arrow-down-circle" class="w-4 h-4"></i>
                <span>GET RESULTS</span>
              </button>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();

      await fetchAndDisplayResults(tab.id, query, 0, false);
    }

    async function fetchAndDisplayResults(tabId, query, offset, append = false) {
      const listContainer = document.getElementById(`resultsList_${tabId}`);
      const statusInd = document.getElementById(`statusIndicator_${tabId}`);
      
      const results = await searchAllEngines(query, offset);

      if (statusInd) statusInd.style.display = 'none';

      if (!results || results.length === 0) {
        if (!append) {
          listContainer.innerHTML = `
            <div class="glass-panel p-6 rounded-xl border border-cyan-500/30">
              <p class="text-xs text-cyan-300 mb-2 font-bold">NO RESULTS FOUND</p>
              <p class="text-xs text-slate-400">Try typing a direct URL or video link in the omnibox above.</p>
            </div>
          `;
        }
        return;
      }

      let itemsHTML = '';
      results.forEach(res => {
        const isVideo = res.url.includes('youtube.com') || res.url.includes('youtu.be');
        
        itemsHTML += `
          <div class="glass-panel p-4 rounded-xl border border-cyan-500/20 hover:border-cyan-400/50 transition flex justify-between items-start space-x-4">
            <div class="flex-1">
              <div class="flex items-center space-x-2 mb-1">
                <span class="text-[9px] px-1.5 py-0.5 rounded bg-cyan-950 border border-cyan-500/40 text-cyan-300 font-bold">${res.source}</span>
                <span class="text-[10px] text-cyan-400/80 truncate">${escapeHtml(res.url)}</span>
              </div>
              <a href="#" onclick="openResultUrl('${escapeHtml(res.url)}'); return false;" class="text-sm font-bold text-sky-300 hover:text-cyan-200 transition underline underline-offset-4 decoration-cyan-500/40">
                ${escapeHtml(res.title)}
              </a>
              <p class="text-xs text-slate-300 mt-2 leading-relaxed">${escapeHtml(res.snippet)}</p>
            </div>
            ${isVideo ? `
              <button onclick="openResultUrl('${escapeHtml(res.url)}')" class="shrink-0 px-3 py-1.5 bg-red-600/30 border border-red-400 text-red-300 text-xs rounded hover:bg-red-500/40 flex items-center space-x-1">
                <i data-lucide="play" class="w-3.5 h-3.5"></i>
                <span>PLAY</span>
              </button>
            ` : ''}
          </div>
        `;
      });

      if (append) {
        listContainer.innerHTML += itemsHTML;
      } else {
        listContainer.innerHTML = itemsHTML;
      }
      lucide.createIcons();
    }

    async function getMoreResults(tabId, query) {
      searchOffsets[tabId] = (searchOffsets[tabId] || 0) + 10;
      const btn = document.getElementById(`getResultsBtn_${tabId}`);
      if (btn) btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i><span>FETCHING RESULTS...</span>`;
      lucide.createIcons();
      
      await fetchAndDisplayResults(tabId, query, searchOffsets[tabId], true);
      
      if (btn) btn.innerHTML = `<i data-lucide="arrow-down-circle" class="w-4 h-4"></i><span>GET RESULTS</span>`;
      lucide.createIcons();
    }

    function openResultUrl(url) {
      openNewTab(url);
    }

    function handleSearchSubmit() {
      const input = document.getElementById('omnibox').value.trim();
      if (!input) return;
      
      if (input.startsWith('http://') || input.startsWith('https://') || (input.includes('.') && !input.includes(' '))) {
        let target = input.startsWith('http') ? input : 'https://' + input;
        navigateCurrentTab(target);
      } else {
        navigateCurrentTab('search://' + encodeURIComponent(input));
      }
    }

    function navigateCurrentTab(url) {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;

      tab.url = url;
      if (url.startsWith('search://')) {
        const query = decodeURIComponent(url.replace('search://', ''));
        tab.title = `Search: ${query}`;
      } else {
        tab.title = getDomainName(url);
      }
      
      const vp = document.getElementById('viewport_' + tab.id);
      if (vp) loadTabContent(tab, vp);
      renderTabs();
    }

    function goHome() {
      navigateCurrentTab('nexus://newtab');
    }

    function getNewTabHTML(tabId) {
      return `
        <div class="w-full h-full overflow-y-auto p-6 md:p-12 flex flex-col items-center justify-between">
          <div class="w-full max-w-4xl flex flex-col items-center">
            
            <div class="text-center my-6">
              <div class="inline-flex items-center space-x-2 bg-cyan-950/60 border border-cyan-500/40 px-3 py-1 rounded-full text-xs text-cyan-400 mb-3 glow-cyan">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span>CYBER_SEARCH ONLINE</span>
              </div>
              <h1 class="text-3xl md:text-5xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-500">
                CYBER_SEARCH
              </h1>
              <p class="text-xs text-cyan-500/70 mt-2">Universal Web Aggregator & Media Reader Mode</p>
            </div>

            <!-- Central Omnibox Search -->
            <div class="w-full max-w-2xl relative my-4">
              <div class="relative flex items-center">
                <i data-lucide="search" class="w-5 h-5 absolute left-4 text-cyan-400"></i>
                <input 
                  id="tabSearchInput_${tabId}"
                  type="text" 
                  placeholder="Search any topic, or paste website / YouTube video URL..." 
                  class="w-full bg-slate-900/90 border-2 border-cyan-500/50 rounded-xl px-12 py-3 text-sm text-cyan-100 placeholder-cyan-600 focus:outline-none focus:border-cyan-300 glow-cyan transition"
                >
                <button 
                  id="tabSearchBtn_${tabId}"
                  class="absolute right-3 px-4 py-1.5 bg-cyan-500 text-slate-950 font-bold text-xs rounded-lg hover:bg-cyan-400 transition"
                >
                  SEARCH
                </button>
              </div>
            </div>

            <!-- Speed Dial Shortcuts -->
            <div class="w-full max-w-3xl mt-8">
              <h3 class="text-xs font-semibold text-cyan-500 tracking-wider mb-4 text-left">FAST_QUERIES</h3>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                ${SPEED_DIALS.map(dial => `
                  <button 
                    onclick="navigateCurrentTab('search://${encodeURIComponent(dial.query)}')"
                    class="glass-panel p-3 rounded-lg flex flex-col items-center hover:border-cyan-400 hover:bg-cyan-950/40 transition group"
                  >
                    <div class="p-2.5 rounded-full bg-slate-900/80 mb-2 border border-cyan-500/20 group-hover:scale-110 transition">
                      <i data-lucide="${dial.icon}" class="w-5 h-5 text-cyan-400"></i>
                    </div>
                    <span class="text-xs text-cyan-300 font-medium truncate w-full text-center">${dial.name}</span>
                  </button>
                `).join('')}
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function attachNewTabEvents(tabId) {
      const input = document.getElementById(`tabSearchInput_${tabId}`);
      const btn = document.getElementById(`tabSearchBtn_${tabId}`);

      if (input && btn) {
        const execute = () => {
          const val = input.value.trim();
          if (!val) return;
          if (val.startsWith('http://') || val.startsWith('https://') || (val.includes('.') && !val.includes(' '))) {
            let target = val.startsWith('http') ? val : 'https://' + val;
            navigateCurrentTab(target);
          } else {
            navigateCurrentTab('search://' + encodeURIComponent(val));
          }
        };

        btn.onclick = execute;
        input.onkeydown = (e) => { if (e.key === 'Enter') execute(); };
      }
    }

    function getDomainName(url) {
      try {
        return new URL(url).hostname.replace('www.', '');
      } catch(e) {
        return url.length > 15 ? url.substring(0, 15) + '...' : url;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
