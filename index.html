<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-NET Browser // Bing Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap');
    body {
      font-family: 'Fira Code', monospace;
      background-color: #030712;
      color: #06b6d4;
    }
    .grid-bg {
      background-image: linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }
    .glow-cyan {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col grid-bg">

  <!-- HUD Header -->
  <header class="glass-panel p-2 flex items-center justify-between border-b border-cyan-500/30">
    <div class="flex items-center space-x-3">
      <div class="flex items-center text-cyan-400 font-bold tracking-widest text-sm px-2">
        <i data-lucide="terminal" class="w-4 h-4 mr-2"></i>
        <span>CYBER_NET // BING_NODE</span>
      </div>
      <span class="text-xs text-cyan-600">| LATENCY: <span id="ping">12ms</span></span>
    </div>
    
    <!-- Navigation & Omnibox -->
    <div class="flex-1 max-w-3xl mx-4 flex items-center space-x-2">
      <button onclick="navigateBack()" class="p-1.5 hover:bg-cyan-950/50 rounded text-cyan-400 border border-cyan-800/50">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
      </button>
      <button onclick="navigateForward()" class="p-1.5 hover:bg-cyan-950/50 rounded text-cyan-400 border border-cyan-800/50">
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
      <button onclick="reloadTab()" class="p-1.5 hover:bg-cyan-950/50 rounded text-cyan-400 border border-cyan-800/50">
        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
      </button>
      
      <div class="relative flex-1 flex items-center">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 text-cyan-500"></i>
        <input 
          id="urlInput" 
          type="text" 
          placeholder="Enter query or URL (Routed via Bing Search)..." 
          class="w-full bg-slate-950/80 border border-cyan-500/40 rounded px-9 py-1.5 text-sm text-cyan-200 focus:outline-none focus:border-cyan-400 glow-cyan"
          onkeydown="if(event.key === 'Enter') handleSearch()"
        >
      </div>
      <button onclick="handleSearch()" class="px-3 py-1.5 bg-cyan-600/30 border border-cyan-400 text-cyan-300 rounded text-sm hover:bg-cyan-500/40">
        EXECUTE
      </button>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center space-x-2">
      <button onclick="openSpeedDial()" class="p-1.5 hover:bg-cyan-950/50 rounded text-cyan-400 border border-cyan-800/50" title="Home Hub">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="flex-1 relative bg-slate-950/90">
    <iframe 
      id="viewport" 
      src="https://www.bing.com" 
      class="w-full h-full border-none"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
    ></iframe>
  </main>

  <!-- HUD Footer Status -->
  <footer class="glass-panel px-4 py-1 flex justify-between items-center text-xs text-cyan-500/70 border-t border-cyan-500/30">
    <div>ENGINE: BING_CORE // ENCRYPTED_PROXY_READY</div>
    <div class="flex space-x-4">
      <span>SECURE_SOCKET: ACTIVE</span>
      <span>NODE: HK-09</span>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    const viewport = document.getElementById('viewport');
    const urlInput = document.getElementById('urlInput');

    function handleSearch() {
      let query = urlInput.value.trim();
      if (!query) return;

      if (query.startsWith('http://') || query.startsWith('https://')) {
        viewport.src = query;
      } else if (query.includes('.') && !query.includes(' ')) {
        viewport.src = 'https://' + query;
      } else {
        viewport.src = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
      }
    }

    function navigateBack() {
      try { viewport.contentWindow.history.back(); } catch(e) {}
    }

    function navigateForward() {
      try { viewport.contentWindow.history.forward(); } catch(e) {}
    }

    function reloadTab() {
      viewport.src = viewport.src;
    }

    function openSpeedDial() {
      viewport.src = 'https://www.bing.com';
      urlInput.value = '';
    }

    // Ping simulator
    setInterval(() => {
      document.getElementById('ping').innerText = Math.floor(Math.random() * 10 + 8) + 'ms';
    }, 3000);
  </script>
</body>
</html>
