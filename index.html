<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_SEARCH // Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Fira Code', monospace; }
    body { background-color: #030712; color: #06b6d4; }
    .grid-bg {
      background-image: 
        linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.25);
    }
    .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); }
    .tab-active {
      background: rgba(6, 182, 212, 0.2);
      border-bottom: 2px solid #06b6d4;
      color: #38bdf8;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #0891b2; border-radius: 3px; }
  </style>
</head>
<body class="h-full w-screen overflow-hidden flex flex-col grid-bg select-none">

  <!-- TOP HEADER OMNIBOX BAR -->
  <header class="glass-panel px-4 py-2 flex items-center justify-between border-b border-cyan-500/30 z-50">
    <div class="flex items-center space-x-3">
      <div onclick="goHome()" class="cursor-pointer flex items-center text-cyan-400 font-bold tracking-widest text-xs px-2.5 py-1 rounded bg-cyan-950/60 border border-cyan-500/40 hover:bg-cyan-900/50 transition">
        <i data-lucide="search" class="w-4 h-4 mr-2 text-cyan-400"></i>
        <span>CYBER_SEARCH</span>
      </div>
    </div>

    <!-- Central Search Bar -->
    <div class="flex-1 max-w-3xl mx-4 flex items-center space-x-2">
      <button onclick="goHome()" class="p-1.5 hover:bg-cyan-950/60 rounded text-cyan-400 border border-cyan-800/40 transition" title="Home">
        <i data-lucide="home" class="w-4 h-4"></i>
      </button>

      <div class="relative flex-1 flex items-center">
        <i data-lucide="globe" class="w-4 h-4 absolute left-3 text-cyan-500"></i>
        <input 
          id="omnibox" 
          type="text" 
          placeholder="Search query or enter web/video URL..." 
          class="w-full bg-slate-950/90 border border-cyan-500/40 rounded px-9 py-1.5 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 glow-cyan transition"
          onkeydown="if(event.key === 'Enter') handleSearchSubmit()"
        >
      </div>

      <button onclick="handleSearchSubmit()" class="px-4 py-1.5 bg-cyan-600/30 border border-cyan-400 text-cyan-300 rounded text-xs hover:bg-cyan-500/40 font-semibold transition">
        EXECUTE
      </button>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="openNewTab()" class="p-1.5 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 rounded border border-cyan-400/50 flex items-center text-xs space-x-1">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">NEW TAB</span>
      </button>
    </div>
  </header>

  <!-- TAB BAR -->
  <div id="tabBar" class="bg-slate-950/80 border-b border-cyan-500/20 px-3 flex items-center space-x-1 overflow-x-auto h-9 text-xs"></div>

  <!-- MAIN VIEWPORT CONTAINER -->
  <main id="viewportContainer" class="flex-1 relative bg-slate-950/90 overflow-hidden"></main>

  <!-- STATUS FOOTER -->
  <footer class="glass-panel px-4 py-1 flex justify-between items-center text-[10px] text-cyan-500/70 border-t border-cyan-500/30">
    <div class="flex items-center space-x-3">
      <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> SYSTEM: ONLINE // VIDEO EMBED READY</span>
    </div>
    <div class="flex items-center space-x-4">
      <span>TABS: <span id="tabCount">1</span></span>
      <span id="clock">00:00:00</span>
    </div>
  </footer>

  <script>
    const WORKER_PROXY_URL = "https://small-hill-0227.mac-for-chrome.workers.dev/";

    let tabs = [];
    let activeTabId = null;
    let searchOffsets = {};

    const SPEED_DIALS = [
      { name: 'Wikipedia', query: 'Wikipedia Free Encyclopedia', icon: 'book-open' },
      { name: 'YouTube Tech', query: 'site:youtube.com tech review', icon: 'video' },
      { name: 'GitHub Search', query: 'GitHub open source projects', icon: 'code' },
      { name: 'Reddit Discussions', query: 'Reddit technology trends', icon: 'message-square' },
      { name: 'Tech News', query: 'Latest Artificial Intelligence News', icon: 'newspaper' },
      { name: 'Internet Archive', query: 'Internet Archive digital library', icon: 'archive' }
    ];

    window.onload = () => {
      openNewTab();
      setInterval(updateClock, 1000);
      updateClock();
      lucide.createIcons();
    };

    function updateClock() {
      document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
    }

    function openNewTab(url = 'nexus://newtab') {
      const id = 'tab_' + Date.now();
      const isSearch = url.startsWith('search://');
      const searchTerms = isSearch ? decodeURIComponent(url.replace('search://', '')) : '';

      const tab = {
        id: id,
        title: isSearch ? `Search: ${searchTerms}` : (url === 'nexus://newtab' ? 'Cyber Launchpad' : getDomainName(url)),
        url: url
      };
      
      tabs.push(tab);
      renderTabs();
      switchTab(id);
    }

    function closeTab(id, e) {
      if (e) e.stopPropagation();
      if (tabs.length === 1) {
        tabs = [];
        openNewTab();
        return;
      }

      tabs = tabs.filter(t => t.id !== id);
      const container = document.getElementById('viewport_' + id);
      if (container) container.remove();

      if (activeTabId === id) {
        switchTab(tabs[tabs.length - 1].id);
      } else {
        renderTabs();
      }
    }

    function switchTab(id) {
      activeTabId = id;
      renderTabs();
      renderViewports();
      
      const tab = tabs.find(t => t.id === id);
      if (tab) {
        let displayVal = '';
        if (tab.url.startsWith('search://')) {
          displayVal = decodeURIComponent(tab.url.replace('search://', ''));
        } else if (tab.url !== 'nexus://newtab') {
          displayVal = tab.url;
        }
        document.getElementById('omnibox').value = displayVal;
      }
    }

    function renderTabs() {
      const tabBar = document.getElementById('tabBar');
      document.getElementById('tabCount').innerText = tabs.length;
      tabBar.innerHTML = '';

      tabs.forEach(tab => {
        const isActive = tab.id === activeTabId;
        const el = document.createElement('div');
        el.className = `flex items-center space-x-2 px-3 py-1 rounded-t border-t border-x border-cyan-500/20 cursor-pointer min-w-[140px] max-w-[210px] justify-between transition ${isActive ? 'tab-active font-semibold' : 'text-cyan-500/70 hover:bg-slate-900/50'}`;
        el.onclick = () => switchTab(tab.id);

        let iconName = 'globe';
        if (tab.url === 'nexus://newtab') iconName = 'layout-grid';
        if (tab.url.startsWith('search://')) iconName = 'search';
        if (tab.url.includes('youtube.com') || tab.url.includes('youtu.be')) iconName = 'video';

        el.innerHTML = `
          <div class="flex items-center space-x-1.5 overflow-hidden">
            <i data-lucide="${iconName}" class="w-3.5 h-3.5 shrink-0"></i>
            <span class="truncate text-[11px]">${escapeHtml(tab.title)}</span>
          </div>
          <button onclick="closeTab('${tab.id}', event)" class="hover:text-cyan-200 rounded p-0.5">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        `;
        tabBar.appendChild(el);
      });
      lucide.createIcons();
    }

    function renderViewports() {
      const container = document.getElementById('viewportContainer');
      
      tabs.forEach(tab => {
        let vp = document.getElementById('viewport_' + tab.id);
        if (!vp) {
          vp = document.createElement('div');
          vp.id = 'viewport_' + tab.id;
          vp.className = 'w-full h-full absolute inset-0';
          container.appendChild(vp);
          loadTabContent(tab, vp);
        }
        
        vp.style.display = (tab.id === activeTabId) ? 'block' : 'none';
      });
    }

    function loadTabContent(tab, element) {
      if (tab.url === 'nexus://newtab') {
        element.innerHTML = getNewTabHTML(tab.id);
        attachNewTabEvents(tab.id);
      } else if (tab.url.startsWith('search://')) {
        const query = decodeURIComponent(tab.url.replace('search://', ''));
        searchOffsets[tab.id] = 0;
        renderSearchResultsPage(tab, element, query);
      } else {
        renderWebPageContent(tab, element, tab.url);
      }
      lucide.createIcons();
    }

    async function fetchViaWorker(targetUrl) {
      const proxyUrl = `${WORKER_PROXY_URL}?url=${encodeURIComponent(targetUrl)}`;
      const response = await fetch(proxyUrl);
      if (!response.ok) throw new Error("HTTP Error: " + response.status);
      return await response.text();
    }

    // Convert standard YouTube links into embeddable players
    function getEmbeddableVideoUrl(url) {
      if (url.includes('youtube.com/watch?v=')) {
        const videoId = url.split('v=')[1].split('&')[0];
        return `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      } else if (url.includes('youtu.be/')) {
        const videoId = url.split('youtu.be/')[1].split('?')[0];
        return `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      }
      return url;
    }

    async function searchWikipedia(query, offset = 0) {
      const wikiUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=15&sroffset=${offset}&format=json&origin=*`;
      const res = await fetch(wikiUrl);
      const data = await res.json();
      
      if (!data.query || !data.query.search) return [];

      return data.query.search.map(item => ({
        title: item.title,
        url: `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title.replace(/ /g, '_'))}`,
        snippet: item.snippet.replace(/<\/?[^>]+(>|$)/g, "") + "..."
      }));
    }

    async function searchDuckDuckGo(query) {
      const targetSearchUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
      const htmlText = await fetchViaWorker(targetSearchUrl);
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      const results = doc.querySelectorAll('.result');

      const parsedResults = [];
      results.forEach((res, i) => {
        if (i >= 15) return;
        const titleEl = res.querySelector('.result__title a');
        const snippetEl = res.querySelector('.result__snippet');

        if (titleEl) {
          let href = titleEl.getAttribute('href') || '';
          if (href.includes('uddg=')) {
            href = decodeURIComponent(href.split('uddg=')[1].split('&')[0]);
          }
          parsedResults.push({
            title: titleEl.textContent.trim(),
            url: href,
            snippet: snippetEl ? snippetEl.textContent.trim() : 'Click to load live website inside CYBER_SEARCH.'
          });
        }
      });
      return parsedResults;
    }

    async function renderSearchResultsPage(tab, element, query) {
      element.innerHTML = `
        <div class="w-full h-full overflow-y-auto p-4 md:p-8">
          <div class="max-w-4xl mx-auto space-y-6">
            <div class="border-b border-cyan-500/20 pb-4 flex items-center justify-between">
              <div>
                <p class="text-xs text-cyan-500/70">SEARCH RESULTS FOR</p>
                <h2 class="text-lg font-bold text-cyan-200">"${escapeHtml(query)}"</h2>
              </div>
              <div id="statusIndicator_${tab.id}" class="text-xs text-cyan-400 animate-pulse flex items-center space-x-1.5">
                <i data-lucide="loader" class="w-4 h-4 animate-spin"></i>
                <span id="engineStatus_${tab.id}">FETCHING SEARCH RESULTS...</span>
              </div>
            </div>

            <div id="resultsList_${tab.id}" class="space-y-4"></div>

            <div class="pt-4 flex justify-center">
              <button id="loadMoreBtn_${tab.id}" onclick="loadMoreResults('${tab.id}', '${escapeHtml(query)}')" class="px-6 py-2 bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 rounded-lg text-xs hover:bg-cyan-900/60 font-semibold transition flex items-center space-x-2">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>LOAD MORE RESULTS</span>
              </button>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();

      await fetchAndDisplayResults(tab.id, query, 0, false);
    }

    async function fetchAndDisplayResults(tabId, query, offset, append = false) {
      const listContainer = document.getElementById(`resultsList_${tabId}`);
      const statusInd = document.getElementById(`statusIndicator_${tabId}`);
      
      let results = [];

      if (offset === 0) {
        try {
          results = await searchDuckDuckGo(query);
        } catch (err) {
          console.warn("DuckDuckGo failed, falling back to Wikipedia API...", err);
        }
      }

      if (results.length === 0) {
        try {
          results = await searchWikipedia(query, offset);
        } catch (err) {
          console.error("Wikipedia search failed:", err);
        }
      }

      if (statusInd) statusInd.style.display = 'none';

      if (!results || results.length === 0) {
        if (!append) {
          listContainer.innerHTML = `
            <div class="glass-panel p-6 rounded-xl border border-cyan-500/30">
              <p class="text-xs text-cyan-300 mb-2 font-bold">NO MORE RESULTS FOUND</p>
              <p class="text-xs text-slate-400">Try typing a direct web or video URL in the omnibox above (e.g., <code class="text-cyan-400">https://youtube.com</code> or <code class="text-cyan-400">https://wikipedia.org</code>).</p>
            </div>
          `;
        }
        return;
      }

      let itemsHTML = '';
      results.forEach(res => {
        const isVideo = res.url.includes('youtube.com') || res.url.includes('youtu.be') || res.url.includes('.mp4');
        
        itemsHTML += `
          <div class="glass-panel p-4 rounded-xl border border-cyan-500/20 hover:border-cyan-400/50 transition flex justify-between items-start space-x-4">
            <div class="flex-1">
              <span class="text-[10px] text-cyan-400/80 block truncate mb-1">${escapeHtml(res.url)}</span>
              <a href="#" onclick="openResultUrl('${escapeHtml(res.url)}'); return false;" class="text-sm font-bold text-sky-300 hover:text-cyan-200 transition underline underline-offset-4 decoration-cyan-500/40">
                ${escapeHtml(res.title)}
              </a>
              <p class="text-xs text-slate-300 mt-2 leading-relaxed">${escapeHtml(res.snippet)}</p>
            </div>
            ${isVideo ? `
              <button onclick="openResultUrl('${escapeHtml(res.url)}')" class="shrink-0 px-3 py-1.5 bg-red-600/30 border border-red-400 text-red-300 text-xs rounded hover:bg-red-500/40 flex items-center space-x-1">
                <i data-lucide="play" class="w-3.5 h-3.5"></i>
                <span>PLAY</span>
              </button>
            ` : ''}
          </div>
        `;
      });

      if (append) {
        listContainer.innerHTML += itemsHTML;
      } else {
        listContainer.innerHTML = itemsHTML;
      }
      lucide.createIcons();
    }

    async function loadMoreResults(tabId, query) {
      searchOffsets[tabId] = (searchOffsets[tabId] || 0) + 15;
      const btn = document.getElementById(`loadMoreBtn_${tabId}`);
      if (btn) btn.innerText = "FETCHING MORE...";
      
      await fetchAndDisplayResults(tabId, query, searchOffsets[tabId], true);
      
      if (btn) btn.innerText = "LOAD MORE RESULTS";
    }

    // Loads live web pages or embedded video players in full-page frames
    function renderWebPageContent(tab, element, url) {
      const formattedUrl = getEmbeddableVideoUrl(url);

      element.innerHTML = `
        <div class="w-full h-full relative bg-black">
          <iframe 
            src="${escapeHtml(formattedUrl)}" 
            class="w-full h-full border-0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"
          ></iframe>
        </div>
      `;
    }

    function openResultUrl(url) {
      openNewTab(url);
    }

    function handleSearchSubmit() {
      const input = document.getElementById('omnibox').value.trim();
      if (!input) return;
      
      if (input.startsWith('http://') || input.startsWith('https://') || (input.includes('.') && !input.includes(' '))) {
        let target = input.startsWith('http') ? input : 'https://' + input;
        navigateCurrentTab(target);
      } else {
        navigateCurrentTab('search://' + encodeURIComponent(input));
      }
    }

    function navigateCurrentTab(url) {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;

      tab.url = url;
      if (url.startsWith('search://')) {
        const query = decodeURIComponent(url.replace('search://', ''));
        tab.title = `Search: ${query}`;
      } else {
        tab.title = getDomainName(url);
      }
      
      const vp = document.getElementById('viewport_' + tab.id);
      if (vp) loadTabContent(tab, vp);
      renderTabs();
    }

    function goHome() {
      navigateCurrentTab('nexus://newtab');
    }

    function getNewTabHTML(tabId) {
      return `
        <div class="w-full h-full overflow-y-auto p-6 md:p-12 flex flex-col items-center justify-between">
          <div class="w-full max-w-4xl flex flex-col items-center">
            
            <div class="text-center my-6">
              <div class="inline-flex items-center space-x-2 bg-cyan-950/60 border border-cyan-500/40 px-3 py-1 rounded-full text-xs text-cyan-400 mb-3 glow-cyan">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span>CYBER_SEARCH ONLINE</span>
              </div>
              <h1 class="text-3xl md:text-5xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-500">
                CYBER_SEARCH
              </h1>
              <p class="text-xs text-cyan-500/70 mt-2">Embedded Video Player & Live Web Viewport</p>
            </div>

            <!-- Central Omnibox Search -->
            <div class="w-full max-w-2xl relative my-4">
              <div class="relative flex items-center">
                <i data-lucide="search" class="w-5 h-5 absolute left-4 text-cyan-400"></i>
                <input 
                  id="tabSearchInput_${tabId}"
                  type="text" 
                  placeholder="Type search query or paste website / YouTube URL..." 
                  class="w-full bg-slate-900/90 border-2 border-cyan-500/50 rounded-xl px-12 py-3 text-sm text-cyan-100 placeholder-cyan-600 focus:outline-none focus:border-cyan-300 glow-cyan transition"
                >
                <button 
                  id="tabSearchBtn_${tabId}"
                  class="absolute right-3 px-4 py-1.5 bg-cyan-500 text-slate-950 font-bold text-xs rounded-lg hover:bg-cyan-400 transition"
                >
                  SEARCH
                </button>
              </div>
            </div>

            <!-- Speed Dial Shortcuts -->
            <div class="w-full max-w-3xl mt-8">
              <h3 class="text-xs font-semibold text-cyan-500 tracking-wider mb-4 text-left">FAST_QUERIES</h3>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                ${SPEED_DIALS.map(dial => `
                  <button 
                    onclick="navigateCurrentTab('search://${encodeURIComponent(dial.query)}')"
                    class="glass-panel p-3 rounded-lg flex flex-col items-center hover:border-cyan-400 hover:bg-cyan-950/40 transition group"
                  >
                    <div class="p-2.5 rounded-full bg-slate-900/80 mb-2 border border-cyan-500/20 group-hover:scale-110 transition">
                      <i data-lucide="${dial.icon}" class="w-5 h-5 text-cyan-400"></i>
                    </div>
                    <span class="text-xs text-cyan-300 font-medium truncate w-full text-center">${dial.name}</span>
                  </button>
                `).join('')}
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function attachNewTabEvents(tabId) {
      const input = document.getElementById(`tabSearchInput_${tabId}`);
      const btn = document.getElementById(`tabSearchBtn_${tabId}`);

      if (input && btn) {
        const execute = () => {
          const val = input.value.trim();
          if (!val) return;
          if (val.startsWith('http://') || val.startsWith('https://') || (val.includes('.') && !val.includes(' '))) {
            let target = val.startsWith('http') ? val : 'https://' + val;
            navigateCurrentTab(target);
          } else {
            navigateCurrentTab('search://' + encodeURIComponent(val));
          }
        };

        btn.onclick = execute;
        input.onkeydown = (e) => { if (e.key === 'Enter') execute(); };
      }
    }

    function getDomainName(url) {
      try {
        return new URL(url).hostname.replace('www.', '');
      } catch(e) {
        return url.length > 15 ? url.substring(0, 15) + '...' : url;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
