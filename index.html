<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebBook</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:white}body{background:#080b13}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.desk{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#315da8,transparent 35%),radial-gradient(circle at 80% 70%,#763e9f,transparent 38%),linear-gradient(135deg,#10182d,#070910)}.top{height:32px;background:#17181dcc;backdrop-filter:blur(20px);display:flex;align-items:center;gap:18px;padding:0 12px;font-size:13px}.top b{font-size:14px}.top span:not(#clock){cursor:pointer}.clock{margin-left:auto}.home{position:absolute;top:32px;bottom:90px;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.home h1{font-size:52px;margin:0}.home p{opacity:.7}.apps{display:flex;gap:25px;margin-top:40px;flex-wrap:wrap;justify-content:center;max-width:700px}.app{width:80px;text-align:center;cursor:pointer}.app i{display:grid;place-items:center;width:62px;height:62px;margin:auto;border-radius:16px;background:#ffffff18;font-style:normal;font-size:36px}.app:hover i{transform:translateY(-5px);background:#ffffff25}.app small{display:block;margin-top:8px}.dock{position:absolute;z-index:20;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px 10px;background:#24252ccc;border:1px solid #ffffff25;border-radius:22px;backdrop-filter:blur(25px)}.dock button{width:52px;height:52px;border-radius:15px;background:transparent;font-size:31px;transition:.15s}.dock button:hover{transform:translateY(-12px) scale(1.2)}
.browser{position:absolute;z-index:100;left:3%;top:5%;width:94%;height:87%;display:none;flex-direction:column;background:#17181d;border:1px solid #ffffff25;border-radius:16px;box-shadow:0 30px 100px #000b;overflow:hidden}.browser.show{display:flex}.title{height:32px;background:#202126;display:flex;align-items:center;justify-content:center;position:relative;font-size:12px}.dots{position:absolute;left:12px;display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%}.r{background:#ff5f57}.y{background:#ffbd2e}.g{background:#28c840}.tabs{height:40px;background:#202126;display:flex;align-items:end;gap:4px;padding:0 7px;overflow:hidden}.tab{height:34px;min-width:170px;max-width:230px;background:#2a2b31;border-radius:10px 10px 0 0;display:flex;align-items:center;padding:0 10px;gap:7px;cursor:pointer}.tab.active{background:#383a41}.tabname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:12px}.tabx{opacity:.6}.new{height:30px;width:32px;background:transparent;font-size:22px}.bar{height:48px;background:#292a30;display:flex;gap:7px;padding:7px 10px}.nav{width:34px;border-radius:9px;background:#ffffff0e;font-size:18px}.addr{flex:1;border:0;outline:0;border-radius:18px;background:#18191e;color:#fff;padding:0 15px}.go{background:#3976ff;border-radius:17px;padding:0 15px}.content{position:relative;flex:1;background:white}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:white}.browserhome{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#304b82,#11141c 58%);display:flex;flex-direction:column;align-items:center;justify-content:center}.browserhome h2{font-size:55px;margin:0}.search{width:min(650px,80%);height:52px;background:white;border-radius:28px;padding:5px;display:flex;margin-top:20px}.search input{flex:1;border:0;outline:0;padding:0 18px;border-radius:25px;color:#111;font-size:16px}.search button{background:#3976ff;border-radius:23px;padding:0 20px}.links{display:flex;gap:10px;margin-top:18px}.links button{background:#ffffff15;padding:10px 14px;border-radius:10px}.fallback{position:absolute;inset:0;z-index:3;display:none;place-items:center;background:#17191f;text-align:center}.fallback.show{display:grid}.fallback button{padding:10px 16px;border-radius:9px;background:#3976ff}.appsMenu{position:absolute;z-index:200;inset:32px 0 0;display:none;background:#090b15dd;backdrop-filter:blur(25px);padding:70px}.appsMenu.show{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,100px);gap:30px;justify-content:center}.grid .app{color:white}.window{position:absolute;z-index:150;width:600px;height:400px;left:9%;top:10%;display:none;background:#202126ee;border:1px solid #ffffff25;border-radius:15px;box-shadow:0 25px 80px #0009;overflow:hidden}.window.show{display:block}.wbar{height:42px;background:#2b2c31;display:flex;align-items:center;padding:0 12px}.wbar b{flex:1;text-align:center}.wbody{height:calc(100% - 42px);padding:25px}.notearea{width:100%;height:100%;background:#25262b;color:white;border:0;outline:0;padding:10px;resize:none}.calcinput{width:100%;font-size:28px;padding:12px;background:#111;color:white;border:0}.term{background:#050805;color:#55ff70;font:14px monospace;height:100%;padding:15px}.term input{background:none;border:0;outline:0;color:#55ff70}.close{cursor:pointer;font-size:18px}
</style></head><body><div class="desk"><div class="top"><b>WebBook</b><span onclick="openBrowser()">File</span><span onclick="appsMenu()">Apps</span><span onclick="openBrowser()">Browser</span><span onclick="openWin('settings')">Settings</span><span class="clock" id="clock"></span></div><div class="home"><h1>WebBook</h1><p>MacBook-style home screen for your Chromebook</p><div class="apps"><div class="app" onclick="openBrowser()"><i>🌐</i><small>Browser</small></div><div class="app" onclick="openWin('files')"><i>📁</i><small>Files</small></div><div class="app" onclick="openWin('notes')"><i>📝</i><small>Notes</small></div><div class="app" onclick="openWin('calculator')"><i>🧮</i><small>Calculator</small></div><div class="app" onclick="openWin('terminal')"><i>⌨️</i><small>Terminal</small></div><div class="app" onclick="openWin('calendar')"><i>📅</i><small>Calendar</small></div><div class="app" onclick="openWin('settings')"><i>⚙️</i><small>Settings</small></div><div class="app" onclick="appsMenu()"><i>🚀</i><small>All Apps</small></div></div></div>
<div class="browser" id="browser"><div class="title"><div class="dots"><i class="r" onclick="closeBrowser()"></i><i class="y" onclick="minBrowser()"></i><i class="g" onclick="maxBrowser()"></i></div>WebBook Browser</div><div class="tabs" id="tabs"></div><div class="bar"><button class="nav" onclick="back()">←</button><button class="nav" onclick="forward()">→</button><button class="nav" onclick="reload()">↻</button><input class="addr" id="addr" placeholder="Search or enter website" onkeydown="if(event.key==='Enter')navigate()"><button class="go" onclick="navigate()">Go</button></div><div class="content" id="content"></div></div>
<div class="appsMenu" id="appsMenu"><div class="grid"><div class="app" onclick="openBrowser();hideApps()"><i>🌐</i><small>Browser</small></div><div class="app" onclick="openWin('files');hideApps()"><i>📁</i><small>Files</small></div><div class="app" onclick="openWin('notes');hideApps()"><i>📝</i><small>Notes</small></div><div class="app" onclick="openWin('calculator');hideApps()"><i>🧮</i><small>Calculator</small></div><div class="app" onclick="openWin('terminal');hideApps()"><i>⌨️</i><small>Terminal</small></div><div class="app" onclick="openWin('calendar');hideApps()"><i>📅</i><small>Calendar</small></div><div class="app" onclick="openWin('settings');hideApps()"><i>⚙️</i><small>Settings</small></div></div></div>
<div class="dock"><button onclick="openBrowser()">🌐</button><button onclick="openWin('files')">📁</button><button onclick="openWin('notes')">📝</button><button onclick="openWin('calculator')">🧮</button><button onclick="openWin('terminal')">⌨️</button><button onclick="openWin('calendar')">📅</button><button onclick="openWin('settings')">⚙️</button><button onclick="appsMenu()">🚀</button></div>
<div id="wins"></div></div><script>
let tabs=[],active=0,max=false;const $=x=>document.getElementById(x);function tick(){$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}setInterval(tick,1000);tick();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openBrowser(){
 $('browser').classList.add('show');if(!tabs.length)newTab();renderTabs();
}
function closeBrowser(){$('browser').classList.remove('show')}function minBrowser(){closeBrowser()}function maxBrowser(){max=!max;Object.assign($('browser').style,max?{left:'0',top:'32px',width:'100%',height:'calc(100% - 32px)',borderRadius:'0'}:{left:'3%',top:'5%',width:'94%',height:'87%',borderRadius:'16px'})}
function newTab(){tabs.push({title:'New Tab',url:'',hist:[],pos:-1});active=tabs.length-1;renderTabs();home()}
function closeTab(i){tabs.splice(i,1);if(!tabs.length)return newTab();if(active>=tabs.length)active=tabs.length-1;renderTabs();load()}
function renderTabs(){$('tabs').innerHTML=tabs.map((t,i)=>`<div class="tab ${i===active?'active':''}" onclick="selectTab(${i})"><span>🌐</span><span class="tabname">${esc(t.title)}</span><span class="tabx" onclick="event.stopPropagation();closeTab(${i})">×</span></div>`).join('')+`<button class="new" onclick="newTab()">+</button>`}
function selectTab(i){active=i;renderTabs();load()}
function home(){$('addr').value='';$('content').innerHTML=`<div class="browserhome"><h2>WebBook</h2><div>Search the web or enter a website</div><div class="search"><input id="homeInput" placeholder="Search Google or enter a URL" onkeydown="if(event.key==='Enter')homeSearch()"><button onclick="homeSearch()">Search</button></div><div class="links"><button onclick="go('https://www.google.com')">Google</button><button onclick="go('https://www.youtube.com')">YouTube</button><button onclick="go('https://wikipedia.org')">Wikipedia</button></div></div>`;setTimeout(()=>document.getElementById('homeInput')?.focus(),20);tabs[active].url='';tabs[active].title='New Tab';renderTabs()}
function homeSearch(){let v=$('homeInput').value.trim();if(v)go(v)}function normal(v){v=v.trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;if(v.includes('.')&&!v.includes(' '))return'https://'+v;return'https://www.google.com/search?q='+encodeURIComponent(v)}
function go(v){let u=normal(v);if(!u)return;let t=tabs[active];t.url=u;t.title=u.replace(/^https?:\/\//,'').split('/')[0];t.hist=t.hist.slice(0,t.pos+1);t.hist.push(u);t.pos++;renderTabs();loadUrl(u)}
function navigate(){go($('addr').value)}function load(){let t=tabs[active];if(t.url){$('addr').value=t.url;loadUrl(t.url)}else home()}
function loadUrl(u){$('addr').value=u;$('content').innerHTML=`<iframe class="frame" src="${esc(u)}"></iframe><div class="fallback" id="fb"><div><h2>This website blocks embedded browsers</h2><p>Some sites prevent themselves from being shown inside another webpage.</p><button onclick="window.open(tabs[active].url,'_blank')">Open site</button><button onclick="home()">New Tab Home</button></div></div>`;setTimeout(()=>{try{let f=document.querySelector('.frame');if(!f.contentDocument)document.getElementById('fb').classList.add('show')}catch(e){}},1800)}
function back(){let t=tabs[active];if(t.pos>0){t.pos--;t.url=t.hist[t.pos];t.title=t.url.replace(/^https?:\/\//,'').split('/')[0];renderTabs();loadUrl(t.url)}}function forward(){let t=tabs[active];if(t.pos<t.hist.length-1){t.pos++;t.url=t.hist[t.pos];t.title=t.url.replace(/^https?:\/\//,'').split('/')[0];renderTabs();loadUrl(t.url)}}function reload(){if(tabs[active].url)loadUrl(tabs[active].url)}
function appsMenu(){$('appsMenu').classList.toggle('show')}function hideApps(){$('appsMenu').classList.remove('show')}
function openWin(type){let old=document.querySelector('.window[data-type="'+type+'"]');if(old){old.classList.add('show');return}let titles={files:'📁 Files',notes:'📝 Notes',calculator:'🧮 Calculator',terminal:'⌨️ Terminal',calendar:'📅 Calendar',settings:'⚙️ Settings'};let body='';if(type==='files')body='<div class="wbody"><h2>Files</h2>📁 Documents<br><br>📁 Downloads<br><br>📁 Pictures<br><br>📄 Welcome.txt</div>';if(type==='notes')body='<textarea class="notearea" oninput="localStorage.note=this.value">'+esc(localStorage.note||'Welcome to WebBook!\n\nThis note saves automatically.')+'</textarea>';if(type==='calculator')body='<div class="wbody"><input class="calcinput" id="calc" placeholder="2+2"><br><br><button class="go" onclick="try{$(\'calc\').value=Function(\'return \'+$(\'calc\').value)()}catch{$(\'calc\').value=\'Error\'}">Calculate</button></div>';if(type==='terminal')body='<div class="term">WebBook Terminal<br><br>Type <b>help</b><br><br>$ <input onkeydown="if(event.key===\'Enter\'){this.parentElement.innerHTML+=\'<br>Command received: \'+esc(this.value)+\'<br>$ \';this.value=\'\'}"></div>';if(type==='calendar')body='<div class="wbody"><h1>Calendar</h1>'+new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'</div>';if(type==='settings')body='<div class="wbody"><h1>Settings</h1><p>WebBook desktop settings</p><button class="go" onclick="document.querySelector(\'.desk\').style.filter=document.querySelector(\'.desk\').style.filter?\'\':\'brightness(.8)\'">Toggle appearance</button></div>';let w=document.createElement('div');w.className='window show';w.dataset.type=type;w.innerHTML='<div class="wbar"><span class="close" onclick="this.closest(\'.window\').remove()">●</span><b>'+titles[type]+'</b></div>'+body;$('wins').appendChild(w)}
window.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='t'){e.preventDefault();openBrowser();newTab()}if(e.ctrlKey&&e.key==='l'&&$('browser').classList.contains('show')){e.preventDefault();$('addr').focus();$('addr').select()}if(e.ctrlKey&&e.key==='w'&&tabs.length){e.preventDefault();closeTab(active)}});
</script></body></html>
