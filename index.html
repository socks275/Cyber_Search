<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberRevision</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#020611;
    --panel:#07111f;
    --panel2:#0b1728;
    --border:#163653;
    --cyan:#00eaff;
    --purple:#8b5cf6;
    --green:#00ff9d;
    --red:#ff416c;
    --text:#eafaff;
    --muted:#7892a6;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 0%,#06304a 0,transparent 35%),
        radial-gradient(circle at 100% 100%,#241044 0,transparent 35%),
        #020611;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* AUTH */
#auth{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:460px;
    background:rgba(7,17,31,.96);
    border:1px solid var(--border);
    border-radius:20px;
    padding:35px;
    box-shadow:0 0 80px rgba(0,234,255,.08);
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:3px;
}

.logo span{
    color:var(--cyan);
    text-shadow:0 0 15px var(--cyan);
}

.auth-sub{
    color:var(--muted);
    margin:8px 0 30px;
}

label{
    display:block;
    color:#86a8ba;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
    margin:16px 0 7px;
    text-transform:uppercase;
}

input,textarea,select{
    width:100%;
    padding:12px;
    color:white;
    background:#020914;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
}

input:focus,textarea:focus,select:focus{
    border-color:var(--cyan);
    box-shadow:0 0 15px rgba(0,234,255,.12);
}

textarea{
    min-height:100px;
    resize:vertical;
}

.btn{
    border:1px solid var(--border);
    border-radius:8px;
    padding:11px 16px;
    color:white;
    background:#081827;
    font-weight:bold;
}

.btn:hover{
    border-color:var(--cyan);
}

.primary{
    background:#075d76;
    border-color:var(--cyan);
}

.green{
    background:#06271c;
    border-color:#00a86b;
    color:var(--green);
}

.red{
    background:#2a0b16;
    border-color:#7d1835;
    color:#ff7895;
}

.purple{
    background:#1a1031;
    border-color:#6945ae;
    color:#c7b4ff;
}

.actions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.error{
    min-height:20px;
    color:#ff6688;
    margin-top:15px;
}

/* APP */
#app{
    display:none;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:245px;
    background:rgba(2,8,17,.97);
    border-right:1px solid var(--border);
    padding:22px 13px;
    z-index:10;
    overflow-y:auto;
}

.sidebar .logo{
    padding:5px 10px 30px;
}

.nav-title{
    color:#45657a;
    font-size:10px;
    font-weight:bold;
    letter-spacing:2px;
    padding:10px;
}

.nav button{
    width:100%;
    display:block;
    text-align:left;
    border:1px solid transparent;
    background:transparent;
    color:#708da0;
    padding:12px;
    margin:2px 0;
    border-radius:8px;
    font-weight:bold;
}

.nav button:hover,
.nav button.active{
    color:var(--cyan);
    background:#061a29;
    border-color:#123d56;
}

.main{
    margin-left:245px;
    width:calc(100% - 245px);
    min-height:100vh;
    padding:28px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.top h2{
    margin:6px 0 0;
}

.muted{
    color:var(--muted);
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--cyan);
    background:#061b2b;
    border:1px solid var(--cyan);
    font-weight:bold;
}

.grid{
    display:grid;
    gap:18px;
}

.g2{ grid-template-columns:repeat(2,1fr); }
.g3{ grid-template-columns:repeat(3,1fr); }
.g4{ grid-template-columns:repeat(4,1fr); }

.panel{
    background:rgba(7,17,31,.94);
    border:1px solid var(--border);
    border-radius:15px;
    padding:20px;
}

.hero{
    background:
        linear-gradient(135deg,rgba(0,234,255,.07),rgba(139,92,246,.08)),
        rgba(7,17,31,.96);
    border:1px solid #18536a;
    border-radius:17px;
    padding:28px;
}

.hero h1{
    font-size:31px;
}

.badge{
    display:inline-block;
    border:1px solid #15516a;
    background:#06202e;
    color:var(--cyan);
    border-radius:50px;
    padding:5px 9px;
    font-size:10px;
    font-weight:bold;
    margin-right:4px;
}

.badge.op{
    border-color:#6945ae;
    background:#1a1031;
    color:#c7b4ff;
}

.badge.admin{
    border-color:#00a86b;
    background:#06271c;
    color:var(--green);
}

.stat{
    color:var(--cyan);
    font-size:30px;
    font-weight:900;
}

.statlabel{
    color:var(--muted);
    font-size:10px;
    letter-spacing:1px;
}

.progress{
    width:100%;
    height:8px;
    overflow:hidden;
    background:#020914;
    border-radius:20px;
}

.progress i{
    display:block;
    height:100%;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
}

.set{
    position:relative;
    overflow:hidden;
}

.set:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    right:0;
    height:2px;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
}

.meta{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.card-row{
    padding:15px;
    background:#030c16;
    border:1px solid var(--border);
    border-radius:10px;
    margin:12px 0;
}

.row-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

/* FLASHCARD */
.flashcard{
    min-height:350px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:35px;
    border:1px solid #19536c;
    border-radius:18px;
    background:
        radial-gradient(circle,rgba(0,234,255,.07),transparent 55%),
        #050f1b;
    cursor:pointer;
    user-select:none;
}

.flashcard:hover{
    border-color:var(--cyan);
}

.flash-label{
    color:var(--cyan);
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:15px;
}

.flash-text{
    font-size:30px;
    font-weight:900;
    line-height:1.4;
}

/* QUIZ */
.question{
    font-size:27px;
    font-weight:900;
    line-height:1.35;
    margin:25px 0;
}

.answers{
    display:grid;
    gap:10px;
}

.answer{
    width:100%;
    padding:16px;
    text-align:left;
    border:1px solid var(--border);
    border-radius:9px;
    background:#071522;
    color:white;
    font-weight:bold;
}

.answer:hover{
    border-color:var(--cyan);
}

.answer.correct{
    background:#06271b;
    border-color:var(--green);
}

.answer.wrong{
    background:#2b0b16;
    border-color:var(--red);
}

/* GLOBAL CHAT */
.chat-box{
    height:350px;
    overflow-y:auto;
    border:1px solid var(--border);
    background:#030c16;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.chat-msg{
    background:#071727;
    border-radius:8px;
    padding:10px;
    border:1px solid #0e273c;
}

.chat-header{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:5px;
}

/* MEMORY MATCH GAME */
.memory-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    margin-top:20px;
}

.mem-card{
    min-height:100px;
    background:#071522;
    border:1px solid var(--border);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
}

.mem-card.flipped, .mem-card.matched{
    background:#08293d;
    border-color:var(--cyan);
    color:var(--cyan);
}

.mem-card.matched{
    border-color:var(--green);
    color:var(--green);
    opacity:0.6;
    cursor:default;
}

@media(max-width:850px){
    .sidebar{ width:65px; }
    .sidebar .logo{ font-size:0; text-align:center; }
    .sidebar .logo:after{ content:"C"; font-size:25px; color:var(--cyan); }
    .nav-title{ display:none; }
    .nav button{ font-size:0; text-align:center; }
    .nav button:after{ content:"◆"; font-size:11px; }
    .main{ margin-left:65px; width:calc(100% - 65px); padding:17px; }
    .g2,.g3,.g4,.memory-grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->
<div id="auth">
    <div class="auth-box">
        <div class="logo">CYBER<span>REVISION</span></div>
        <div class="auth-sub">// GAMIFIED REVISION NETWORK</div>
        <div id="authContent"></div>
    </div>
</div>

<!-- MAIN APPLICATION -->
<div id="app">
    <aside class="sidebar">
        <div class="logo">CYBER<span>REVISION</span></div>
        <div class="nav-title">REVISION SYSTEM</div>
        <div class="nav">
            <button id="nav-dashboard" onclick="showPage('dashboard')">Dashboard</button>
            <button id="nav-sets" onclick="showPage('sets')">Public Sets</button>
            <button id="nav-create" onclick="showPage('create')">Create Flashcards</button>
            <button id="nav-flashcards" onclick="showPage('flashcards')">Flashcards</button>
            <button id="nav-quiz" onclick="showPage('quiz')">Question Battle</button>
            <button id="nav-games" onclick="showPage('games')">Games</button>
            <button id="nav-pvp" onclick="showPage('pvp')">Player vs Player</button>
            <button id="nav-chat" onclick="showPage('chat')">Global Chat</button>
            <button id="nav-progress" onclick="showPage('progress')">Progress</button>
            <button id="nav-settings" onclick="showPage('settings')">Settings</button>
            <button id="nav-admin" class="hidden" onclick="showPage('admin')">Admin Panel</button>
        </div>
    </aside>

    <main class="main">
        <div class="top">
            <div>
                <div id="dateText" class="muted"></div>
                <h2 id="pageTitle">Dashboard</h2>
            </div>
            <div class="profile">
                <span id="roleBadge"></span>
                <span id="usernameDisplay"></span>
                <div id="avatar" class="avatar"></div>
            </div>
        </div>
        <div id="content"></div>
    </main>
</div>

<script>
"use strict";

const ADMIN_CODE = "CR-7X4Q-N9VM-2K8P-R6ZT-H3WF-91KD-V8QP";

const USERS_KEY = "CYBER_REVISION_USERS";
const PUBLIC_SETS_KEY = "CYBER_REVISION_PUBLIC_SETS";
const CHAT_KEY = "CYBER_REVISION_GLOBAL_CHAT";
const CURRENT_USER_KEY = "CYBER_REVISION_CURRENT_USER";

let currentUser = null;
let accountData = null;

let activeSet = null;
let activeCard = 0;
let cardFlipped = false;

let quizQuestions = [];
let quizPosition = 0;
let quizScore = 0;

function escapeHTML(str) {
    if (!str) return "";
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

const SAMPLE_SETS = [
    {
        id: "SET_SAMPLE_1",
        name: "Computer Science Basics",
        subject: "Other",
        author: "SystemAdmin",
        authorKey: "systemadmin",
        cards: [
            { front: "What does CPU stand for?", back: "Central Processing Unit" },
            { front: "What is the binary representation of 5?", back: "101" },
            { front: "What is RAM?", back: "Random Access Memory - volatile memory used for active programs." }
        ],
        created: Date.now()
    }
];

function readJSON(key, fallback){
    try{
        const value = localStorage.getItem(key);
        if(!value) return fallback;
        return JSON.parse(value) ?? fallback;
    }catch(error){
        return fallback;
    }
}

function writeJSON(key, value){
    try{
        localStorage.setItem(key, JSON.stringify(value));
        return true;
    }catch(error){
        return false;
    }
}

/* AUTHENTICATION */
function renderLogin(){
    document.getElementById("authContent").innerHTML = `
        <h1>ACCESS SYSTEM</h1>
        <p class="muted">// ENTER YOUR USERNAME</p>

        <label>Username</label>
        <input id="loginUsername" placeholder="Username">

        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Password">

        <br><br>
        <div class="actions">
            <button class="btn primary" onclick="loginUser()">CONNECT</button>
            <button class="btn" onclick="renderSignup()">CREATE ACCOUNT</button>
        </div>
        <div id="authError" class="error"></div>
        <br>
        <button class="btn purple" onclick="renderAdminLogin()">ADMIN ACCESS CODE</button>
    `;
}

function renderSignup(){
    document.getElementById("authContent").innerHTML = `
        <h1>CREATE ACCOUNT</h1>
        <p class="muted">// CREATE YOUR REVISION PROFILE</p>

        <label>Username</label>
        <input id="signupUsername" placeholder="3-20 characters">

        <label>Password</label>
        <input id="signupPassword" type="password" placeholder="Password">

        <label>Confirm Password</label>
        <input id="signupConfirm" type="password" placeholder="Repeat password">

        <br><br>
        <div class="actions">
            <button class="btn primary" onclick="createAccount()">CREATE</button>
            <button class="btn" onclick="renderLogin()">BACK</button>
        </div>
        <div id="authError" class="error"></div>
    `;
}

function renderAdminLogin(){
    document.getElementById("authContent").innerHTML = `
        <h1>ADMIN ACCESS CODE</h1>
        <p class="muted">// ENTER MASTER SYSTEM CODE</p>

        <label>Admin Code</label>
        <input id="adminCodeInput" type="password" placeholder="Admin code">

        <br><br>
        <div class="actions">
            <button class="btn purple" onclick="adminLogin()">AUTHORIZE</button>
            <button class="btn" onclick="renderLogin()">BACK</button>
        </div>
        <div id="authError" class="error"></div>
    `;
}

function getUsers(){ return readJSON(USERS_KEY, []); }
function saveUsers(users){ return writeJSON(USERS_KEY, users); }

function createAccount(){
    const username = document.getElementById("signupUsername").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirm = document.getElementById("signupConfirm").value;
    const error = document.getElementById("authError");

    if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){
        error.textContent = "Username must be 3-20 letters, numbers or underscores.";
        return;
    }
    if(password.length < 4){
        error.textContent = "Password must contain at least 4 characters.";
        return;
    }
    if(password !== confirm){
        error.textContent = "Passwords do not match.";
        return;
    }

    const users = getUsers();
    if(users.some(u => u.username.toLowerCase() === username.toLowerCase())){
        error.textContent = "That username already exists.";
        return;
    }

    users.push({ username, password, admin: false, op: false, muted: false, lastActive: Date.now() });
    saveUsers(users);

    currentUser = { username, admin: false, op: false, muted: false };
    accountData = createBlankData();
    saveAccount();
    launchApp();
}

function loginUser(){
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;
    const error = document.getElementById("authError");

    const users = getUsers();
    const found = users.find(u => u.username.toLowerCase() === username.toLowerCase());

    if(!found || found.password !== password){
        error.textContent = "Invalid username or password.";
        return;
    }

    found.lastActive = Date.now();
    saveUsers(users);

    currentUser = { username: found.username, admin: !!found.admin, op: !!found.op, muted: !!found.muted };
    loadAccount();
    launchApp();
}

function adminLogin(){
    const entered = document.getElementById("adminCodeInput").value.trim();
    const error = document.getElementById("authError");

    if(entered !== ADMIN_CODE){
        error.textContent = "ACCESS DENIED.";
        return;
    }

    const username = prompt("Enter the username to assign System Admin rights:");
    if(!username) return;

    const users = getUsers();
    const found = users.find(u => u.username.toLowerCase() === username.trim().toLowerCase());

    if(!found){
        error.textContent = "That username does not exist.";
        return;
    }

    found.admin = true;
    found.op = true;
    saveUsers(users);

    currentUser = { username: found.username, admin: true, op: true, muted: !!found.muted };
    loadAccount();
    launchApp();
}

function createBlankData(){
    return {
        xp: 0,
        streak: 1,
        cardsStudied: 0,
        questionsAnswered: 0,
        correctAnswers: 0,
        ownSets: [],
        daily: { date: new Date().toDateString(), cards: 0, questions: 0 }
    };
}

function accountKey(){
    return "CYBER_REVISION_ACCOUNT_" + currentUser.username.toLowerCase();
}

function loadAccount(){
    accountData = readJSON(accountKey(), createBlankData());
    if(!accountData.ownSets) accountData.ownSets = [];
    if(!accountData.daily || accountData.daily.date !== new Date().toDateString()){
        accountData.daily = { date: new Date().toDateString(), cards: 0, questions: 0 };
    }
    
    // Sync roles from user DB
    const users = getUsers();
    const dbUser = users.find(u => u.username.toLowerCase() === currentUser.username.toLowerCase());
    if(dbUser){
        currentUser.admin = !!dbUser.admin;
        currentUser.op = !!dbUser.op;
        currentUser.muted = !!dbUser.muted;
        dbUser.lastActive = Date.now();
        saveUsers(users);
    }
    saveAccount();
}

function saveAccount(){
    writeJSON(accountKey(), accountData);
    writeJSON(CURRENT_USER_KEY, currentUser);
}

function launchApp(){
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("usernameDisplay").textContent = currentUser.username;
    document.getElementById("avatar").textContent = currentUser.username.charAt(0).toUpperCase();

    const roleBadge = document.getElementById("roleBadge");
    if(currentUser.admin){
        roleBadge.innerHTML = '<span class="badge admin">ADMIN</span>';
    } else if(currentUser.op){
        roleBadge.innerHTML = '<span class="badge op">OP</span>';
    } else {
        roleBadge.innerHTML = '';
    }

    document.getElementById("dateText").textContent = new Date().toLocaleDateString(undefined, {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
    });

    document.getElementById("nav-admin").classList.toggle("hidden", !(currentUser.admin || currentUser.op));
    showPage("dashboard");
}

window.addEventListener("DOMContentLoaded", () => {
    const savedUser = readJSON(CURRENT_USER_KEY, null);
    if (savedUser && savedUser.username) {
        currentUser = savedUser;
        loadAccount();
        launchApp();
    } else {
        renderLogin();
    }
});

function showPage(name){
    const titles = {
        dashboard: "Dashboard",
        sets: "Public Study Sets",
        create: "Create Flashcards",
        flashcards: "Flashcards",
        quiz: "Question Battle",
        games: "Arcade Games",
        pvp: "Player vs Player",
        chat: "Global Chat",
        progress: "Progress",
        settings: "Settings",
        admin: "Admin & Management Core"
    };

    document.getElementById("pageTitle").textContent = titles[name] || "CyberRevision";

    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    const nav = document.getElementById("nav-" + name);
    if(nav) nav.classList.add("active");

    const pages = {
        dashboard: renderDashboard,
        sets: renderSets,
        create: renderCreate,
        flashcards: renderFlashcards,
        quiz: renderQuizHome,
        games: renderGames,
        pvp: renderPVP,
        chat: renderChat,
        progress: renderProgress,
        settings: renderSettings,
        admin: renderAdmin
    };

    if(pages[name]) pages[name]();
}

/* DASHBOARD */
function renderDashboard(){
    const level = Math.floor(accountData.xp / 100) + 1;
    const accuracy = accountData.questionsAnswered
        ? Math.round(accountData.correctAnswers / accountData.questionsAnswered * 100) : 0;

    document.getElementById("content").innerHTML = `
        <div class="hero">
            <span class="badge">LEVEL ${level}</span>
            <h1>Welcome back, ${escapeHTML(currentUser.username)}.</h1>
            <p class="muted">// REVISION NETWORK ONLINE</p>
            <div class="stat">${accountData.xp} XP</div>
            <div class="progress"><i style="width:${accountData.xp % 100}%"></i></div>
            <br>
            <div class="actions">
                <button class="btn primary" onclick="showPage('create')">+ CREATE FLASHCARDS</button>
                <button class="btn purple" onclick="showPage('games')">PLAY GAMES</button>
            </div>
        </div>
        <br>
        <div class="grid g4">
            <div class="panel"><div class="statlabel">XP</div><div class="stat">${accountData.xp}</div></div>
            <div class="panel"><div class="statlabel">STREAK</div><div class="stat">${accountData.streak} Days</div></div>
            <div class="panel"><div class="statlabel">CARDS STUDIED</div><div class="stat">${accountData.cardsStudied}</div></div>
            <div class="panel"><div class="statlabel">ACCURACY</div><div class="stat">${accuracy}%</div></div>
        </div>
    `;
}

/* PUBLIC SETS & DELETION */
function getPublicSets(){ return readJSON(PUBLIC_SETS_KEY, SAMPLE_SETS); }
function savePublicSets(sets){ writeJSON(PUBLIC_SETS_KEY, sets); }

function getAllSets(){
    const map = new Map();
    getPublicSets().forEach(s => map.set(s.id, s));
    accountData.ownSets.forEach(s => map.set(s.id, s));
    return [...map.values()];
}

function renderSets(){
    const allSets = getAllSets();
    const searchVal = (document.getElementById("setSearchInput")?.value || "").toLowerCase();
    const filterSubject = document.getElementById("setSubjectFilter")?.value || "ALL";

    const filtered = allSets.filter(s => {
        const matchesSearch = s.name.toLowerCase().includes(searchVal) || s.subject.toLowerCase().includes(searchVal);
        const matchesSubject = filterSubject === "ALL" || s.subject === filterSubject;
        return matchesSearch && matchesSubject;
    });

    document.getElementById("content").innerHTML = `
        <div class="panel">
            <h2>PUBLIC STUDY NETWORK</h2>
            <p class="muted">Search and browse flashcard sets created by students and admins.</p>
            
            <div class="grid g2" style="margin-bottom:15px;">
                <input id="setSearchInput" placeholder="Search by name or subject..." value="${escapeHTML(searchVal)}" oninput="renderSets()">
                <select id="setSubjectFilter" onchange="renderSets()">
                    <option value="ALL">All Subjects</option>
                    <option value="Maths" ${filterSubject==='Maths'?'selected':''}>Maths</option>
                    <option value="English" ${filterSubject==='English'?'selected':''}>English</option>
                    <option value="Biology" ${filterSubject==='Biology'?'selected':''}>Biology</option>
                    <option value="Chemistry" ${filterSubject==='Chemistry'?'selected':''}>Chemistry</option>
                    <option value="Physics" ${filterSubject==='Physics'?'selected':''}>Physics</option>
                    <option value="History" ${filterSubject==='History'?'selected':''}>History</option>
                    <option value="Geography" ${filterSubject==='Geography'?'selected':''}>Geography</option>
                    <option value="French" ${filterSubject==='French'?'selected':''}>French</option>
                    <option value="Latin" ${filterSubject==='Latin'?'selected':''}>Latin</option>
                    <option value="Other" ${filterSubject==='Other'?'selected':''}>Other</option>
                </select>
            </div>
        </div>
        <br>
        <div class="grid g3">
            ${filtered.length ? filtered.map(set => {
                const isAuthor = set.authorKey === currentUser.username.toLowerCase();
                const isAdminAuthor = set.authorKey === "systemadmin" || (getUsers().find(u => u.username.toLowerCase() === set.authorKey)?.admin);
                
                // Can delete if creator, admin, or OP (unless set belongs to an admin and user is only OP)
                let canDelete = isAuthor || currentUser.admin;
                if(currentUser.op && !isAdminAuthor) canDelete = true;

                return `
                    <div class="panel set">
                        <span class="badge">${escapeHTML(set.subject)}</span>
                        <h3>${escapeHTML(set.name)}</h3>
                        <div class="meta">${set.cards.length} cards</div>
                        <div class="meta">Author: ${escapeHTML(set.author)}</div>
                        <br>
                        <div class="actions">
                            <button class="btn primary" onclick="startFlashcards('${set.id}')">STUDY</button>
                            <button class="btn purple" onclick="startQuiz('${set.id}')">QUIZ</button>
                            ${canDelete ? `<button class="btn red" onclick="deleteSet('${set.id}')">DELETE</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('') : '<p class="muted">No matching study sets found.</p>'}
        </div>
    `;
}

function deleteSet(setId){
    if(!confirm("Are you sure you want to delete this study set?")) return;

    let publicSets = getPublicSets();
    const targetSet = publicSets.find(s => s.id === setId);
    
    if(targetSet){
        const isAdminAuthor = targetSet.authorKey === "systemadmin" || (getUsers().find(u => u.username.toLowerCase() === targetSet.authorKey)?.admin);
        if(currentUser.op && !currentUser.admin && isAdminAuthor){
            alert("Operators cannot delete sets created by Admins.");
            return;
        }
    }

    publicSets = publicSets.filter(s => s.id !== setId);
    savePublicSets(publicSets);

    accountData.ownSets = accountData.ownSets.filter(s => s.id !== setId);
    saveAccount();

    renderSets();
}

function addFlashcardInput(){
    cardNumber++;

    wrapper.className = "card-row";
    wrapper.innerHTML = `

            <span class="badge">CARD ${cardNumber}</span>

function publishSet(){
    const name = document.getElementById("newSetName").value.trim();
    const subject = document.getElementById("newSetSubject").value;
    const fronts = document.querySelectorAll(".flash-front");
    const backs = document.querySelectorAll(".flash-back");

    const cards = [];
    for(let i = 0; i < fronts.length; i++){
        const front = fronts[i].value.trim();
        const back = backs[i].value.trim();
        if(front && back) cards.push({ front, back });
    }

    if(!name){ alert("Enter a set name."); return; }
    if(cards.length === 0){ alert("Create at least one card."); return; }

    const set = {
        id: "SET_" + Date.now() + "_" + Math.random().toString(36).slice(2),
        name: name,
        subject: subject,
        author: currentUser.username,
        authorKey: currentUser.username.toLowerCase(),
        cards: cards,
        created: Date.now()
    };

    accountData.ownSets.unshift(set);
    accountData.xp += cards.length * 5;

    const publicSets = getPublicSets();
    publicSets.unshift(set);

    savePublicSets(publicSets);
    saveAccount();

    alert("Set published!");
    showPage("sets");
}

/* FLASHCARD PLAYER */
function startFlashcards(setId){
    const sets = getAllSets();
    activeSet = sets.find(s => s.id === setId);
    activeCard = 0;
    cardFlipped = false;
    showPage("flashcards");
}

function renderFlashcards(){
    const sets = getAllSets();
    if(!activeSet && sets.length > 0) activeSet = sets[0];

    if(!activeSet){
        document.getElementById("content").innerHTML = `
            <div class="panel">
                <h3>No Flashcards Found</h3>
                <p class="muted">Create or select a set to start studying.</p>
                <button class="btn primary" onclick="showPage('sets')">BROWSE SETS</button>
            </div>
        `;
        return;
    }

    const card = activeSet.cards[activeCard] || { front: "Empty", back: "Empty" };

    document.getElementById("content").innerHTML = `
        <div class="panel">
            <div class="row-head">
                <div>
                    <h2>${escapeHTML(activeSet.name)}</h2>
                    <span class="badge">${escapeHTML(activeSet.subject)}</span>
                </div>
                <div>
                    <select onchange="changeActiveSet(this.value)">
                        ${sets.map(s => `<option value="${s.id}" ${s.id===activeSet.id?'selected':''}>${escapeHTML(s.name)}</option>`).join('')}
                    </select>
                </div>
            </div>
            <br>
            <div class="flashcard" onclick="flipCard()">
                <div class="flash-label">${cardFlipped ? "ANSWER / BACK" : "QUESTION / FRONT (CLICK TO FLIP)"}</div>
                <div class="flash-text">${escapeHTML(cardFlipped ? card.back : card.front)}</div>
            </div>
            <br>
            <div class="row-head">
                <button class="btn" onclick="prevCard()">PREVIOUS</button>
                <span class="muted">Card ${activeCard + 1} of ${activeSet.cards.length}</span>
                <button class="btn primary" onclick="nextCard()">NEXT</button>
            </div>
        </div>
    `;
}

function changeActiveSet(setId){
    const sets = getAllSets();
    activeSet = sets.find(s => s.id === setId);
    activeCard = 0;
    cardFlipped = false;
    renderFlashcards();
}

function flipCard(){
    cardFlipped = !cardFlipped;
    renderFlashcards();
}

function prevCard(){
    if(activeCard > 0) activeCard--;
    cardFlipped = false;
    renderFlashcards();
}

function nextCard(){
    if(activeCard < activeSet.cards.length - 1){
        activeCard++;
    } else {
        activeCard = 0;
    }
    cardFlipped = false;
    accountData.cardsStudied++;
    accountData.daily.cards++;
    accountData.xp += 2;
    saveAccount();
    renderFlashcards();
}

/* QUIZ / BATTLE */
function renderQuizHome(){
    const sets = getAllSets();
    document.getElementById("content").innerHTML = `
        <div class="panel">
            <h2>QUESTION BATTLE</h2>
            <p class="muted">Choose a set to test your knowledge.</p>
            <div class="grid g3">
                ${sets.map(set => `
                    <div class="panel set">
                        <h3>${escapeHTML(set.name)}</h3>
                        <p class="muted">${set.cards.length} Cards</p>
                        <button class="btn purple" onclick="startQuiz('${set.id}')">START QUIZ</button>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

function startQuiz(setId){
    const sets = getAllSets();
    const set = sets.find(s => s.id === setId);
    if(!set || set.cards.length === 0){ alert("Set contains no cards!"); return; }

    quizQuestions = set.cards.map(c => {
        const otherBacks = set.cards.filter(x => x.back !== c.back).map(x => x.back);
        const distractors = otherBacks.sort(() => 0.5 - Math.random()).slice(0, 3);
        const choices = [...distractors, c.back].sort(() => 0.5 - Math.random());
        return { question: c.front, correct: c.back, choices };
    });

    quizPosition = 0;
    quizScore = 0;
    showPage("quiz");
    renderQuizQuestion();
}

function renderQuizQuestion(){
    if(quizPosition >= quizQuestions.length){
        renderQuizResults();
        return;
    }

    const q = quizQuestions[quizPosition];
    document.getElementById("content").innerHTML = `
        <div class="panel">
            <div class="row-head">
                <span class="badge">QUESTION ${quizPosition + 1}/${quizQuestions.length}</span>
                <span class="statlabel">SCORE: ${quizScore}</span>
            </div>
            <div class="question">${escapeHTML(q.question)}</div>
            <div class="answers">
                ${q.choices.map(choice => `
                    <button class="answer" onclick="submitAnswer(this, '${escapeHTML(choice)}')">
                        ${escapeHTML(choice)}
                    </button>
                `).join('')}
            </div>
        </div>
    `;
}

function submitAnswer(btn, choice){
    const q = quizQuestions[quizPosition];
    const correct = choice === q.correct;

    accountData.questionsAnswered++;
    accountData.daily.questions++;

    if(correct){
        btn.classList.add("correct");
        quizScore += 10;
        accountData.correctAnswers++;
        accountData.xp += 10;
    } else {
        btn.classList.add("wrong");
    }

    saveAccount();
    setTimeout(() => {
        quizPosition++;
        renderQuizQuestion();
    }, 800);
}

function renderQuizResults(){
    document.getElementById("content").innerHTML = `
        <div class="panel">
            <h2>BATTLE COMPLETED!</h2>
            <div class="stat">${quizScore} POINTS</div>
            <br>
            <button class="btn primary" onclick="renderQuizHome()">CONTINUE</button>
        </div>
    `;
}

/* ARCADE GAMES */
let memCards = [], firstCard = null, secondCard = null, lockBoard = false, matchesFound = 0;

function renderGames(){
    document.getElementById("content").innerHTML = `
        <div class="panel">
            <h2>CYBER ARCADE</h2>
            <p class="muted">Play interactive games using your flashcards.</p>
            <br>
            <label>Select Study Set For Game</label>
            <select id="gameSetSelect" style="max-width:300px; margin-bottom:20px;">
                ${getAllSets().map(s => `<option value="${s.id}">${escapeHTML(s.name)}</option>`).join('')}
            </select>
            <div class="grid g2">
                <div class="panel">
                    <h3>MEMORY MATCH</h3>
                    <p class="muted">Match front concepts with back answers.</p>
                    <button class="btn purple" onclick="startMemoryGame()">PLAY MEMORY MATCH</button>
                </div>
            </div>
        </div>
        <div id="gameContainer"></div>
    `;
}

function startMemoryGame(){
    const setId = document.getElementById("gameSetSelect").value;
    const set = getAllSets().find(s => s.id === setId);
    if(!set || set.cards.length < 2){ alert("Set needs at least 2 cards for Memory Match."); return; }

    const subset = set.cards.slice(0, 6);
    memCards = [];
    subset.forEach((c, i) => {
        memCards.push({ id: i, text: c.front, matchId: i, type: 'front' });
        memCards.push({ id: i, text: c.back, matchId: i, type: 'back' });
    });
    memCards.sort(() => 0.5 - Math.random());

    firstCard = null;
    secondCard = null;
    lockBoard = false;
    matchesFound = 0;

    const container = document.getElementById("gameContainer");
    container.innerHTML = `
        <div class="panel" style="margin-top:20px;">
            <h3>MEMORY MATCH BOARD</h3>
            <div class="memory-grid">
                ${memCards.map((c, index) => `
                    <div class="mem-card" id="mem-card-${index}" onclick="flipMemCard(${index})">?</div>
                `).join('')}
            </div>
        </div>
    `;
}

function flipMemCard(index){
    if(lockBoard) return;
    const cardEl = document.getElementById(`mem-card-${index}`);
    if(cardEl.classList.contains("flipped") || cardEl.classList.contains("matched")) return;

    cardEl.classList.add("flipped");
    cardEl.textContent = memCards[index].text;

    if(!firstCard){
        firstCard = { index, data: memCards[index] };
        return;
    }

    secondCard = { index, data: memCards[index] };
    lockBoard = true;

    if(firstCard.data.matchId === secondCard.data.matchId && firstCard.data.type !== secondCard.data.type){
        document.getElementById(`mem-card-${firstCard.index}`).classList.add("matched");
        document.getElementById(`mem-card-${secondCard.index}`).classList.add("matched");
        matchesFound++;
        accountData.xp += 15;
        saveAccount();
        resetMemBoard();

        if(matchesFound === memCards.length / 2){
            setTimeout(() => alert("You matched all cards! +XP Awarded!"), 300);
        }
    } else {
        setTimeout(() => {
            const el1 = document.getElementById(`mem-card-${firstCard.index}`);
            const el2 = document.getElementById(`mem-card-${secondCard.index}`);
            if(el1) { el1.classList.remove("flipped"); el1.textContent = "?"; }
            if(el2) { el2.classList.remove("flipped"); el2.textContent = "?"; }
            resetMemBoard();
        }, 1000);
    }
}

function resetMemBoard(){
    [firstCard, secondCard] = [null, null];
    lockBoard = false;
}

/* GLOBAL CHAT */
function getChatMessages(){ return readJSON(CHAT_KEY, []); }
function saveChatMessages(msgs){ writeJSON(CHAT_KEY, msgs); }

function renderChat(){
    const msgs = getChatMessages();
    const canDelete = currentUser.admin || currentUser.op;

    document.getElementById("content").innerHTML = `
        <div class="panel">
            <div class="row-head">
                <h2>GLOBAL CHAT</h2>
                ${currentUser.admin ? `<button class="btn red" onclick="clearChat()">CLEAR CHAT</button>` : ''}
            </div>
            <p class="muted">Live communication network for all operatives.</p>
            
            <div class="chat-box" id="chatBox">
                ${msgs.map((m, index) => `
                    <div class="chat-msg">
                        <div class="chat-header">
                            <div>
                                <b>${escapeHTML(m.author)}</b>${m.admin ? '<span class="badge admin">ADMIN</span>' : ''}
                                ${m.op ? '<span class="badge op">OP</span>' : ''}
                            </div>
                            <div>
                                <span class="muted">${new Date(m.time).toLocaleTimeString()}</span>${canDelete ? `<button class="btn red" style="padding:2px 5px; font-size:10px;" onclick="deleteChatMessage(${index})">X</button>` : ''}
                            </div>
                        </div>
                        <div>${escapeHTML(m.text)}</div>
                    </div>
                `).join('')}
            </div>

            ${currentUser.muted ? `
                <div class="error">You have been muted by an administrator and cannot send messages.</div>
            ` : `
                <div class="actions">
                    <input id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                    <button class="btn primary" onclick="sendChatMessage()">SEND</button>
                </div>
            `}
        </div>
    `;

    const chatBox = document.getElementById("chatBox");
    if(chatBox) chatBox.scrollTop = chatBox.scrollHeight;
}

function sendChatMessage(){
    if(currentUser.muted){ alert("You are muted."); return; }
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if(!text) return;

    const msgs = getChatMessages();
    msgs.push({
        author: currentUser.username,
        text: text,
        admin: currentUser.admin,
        op: currentUser.op,
        time: Date.now()
    });

    saveChatMessages(msgs);
    input.value = "";
    renderChat();
}

function deleteChatMessage(index){
    const msgs = getChatMessages();
    msgs.splice(index, 1);
    saveChatMessages(msgs);
    renderChat();
}

function clearChat(){
    if(!confirm("Clear all global chat messages?")) return;
    saveChatMessages([]);
    renderChat();
}

/* ADMIN & MANAGEMENT CORE */
function renderAdmin(){
    if(!currentUser || (!currentUser.admin && !currentUser.op)){
        showPage('dashboard');
        return;
    }

    const users = getUsers();
    const now = Date.now();

    document.getElementById("content").innerHTML = `
        <div class="panel">
            <h2>ADMIN & OPERATOR PANEL</h2>
            <p class="muted">Manage system privileges, users, and moderation.</p>
            <br>
            <h3>REGISTERED USERS (${users.length})</h3>
            <br>
            <div class="grid g2">
                ${users.map(u => {
                    const isOnline = u.lastActive && (now - u.lastActive < 300000); // active within 5 mins
                    return `
                        <div class="panel">
                            <div class="row-head">
                                <div>
                                    <b>${escapeHTML(u.username)}</b>${u.admin ? '<span class="badge admin">ADMIN</span>' : ''}
                                    ${u.op ? '<span class="badge op">OP</span>' : ''}
                                    ${u.muted ? '<span class="badge red">MUTED</span>' : ''}
                                </div>
                                <span class="badge ${isOnline ? 'green' : ''}">${isOnline ? 'ONLINE' : 'OFFLINE'}</span>
                            </div>
                            <br>
                            ${currentUser.admin ? `
                                <div class="actions">
                                    <button class="btn ${u.op ? 'red' : 'purple'}" onclick="toggleOp('${escapeHTML(u.username)}')">
                                        ${u.op ? 'REMOVE OP' : 'MAKE OP'}
                                    </button>
                                    <button class="btn ${u.muted ? 'green' : 'red'}" onclick="toggleMute('${escapeHTML(u.username)}')">
                                        ${u.muted ? 'UNMUTE' : 'MUTE'}
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('')}
            </div>
        </div>
    `;
}

function toggleOp(username){
    if(!currentUser.admin) return;
    const users = getUsers();
    const target = users.find(u => u.username.toLowerCase() === username.toLowerCase());
    if(target){
        target.op = !target.op;
        saveUsers(users);
        renderAdmin();
    }
}

function toggleMute(username){
    if(!currentUser.admin) return;
    const users = getUsers();
    const target = users.find(u => u.username.toLowerCase() === username.toLowerCase());
    if(target){
        target.muted = !target.muted;
        saveUsers(users);
        renderAdmin();
    }
}

function logout(){
    currentUser = null;
    accountData = null;
    localStorage.removeItem(CURRENT_USER_KEY);
    document.getElementById("app").style.display = "none";
    document.getElementById("auth").style.display = "flex";
    renderLogin();
}
