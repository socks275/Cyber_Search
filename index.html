<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_SEARCH // Universal Search & Media Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Fira Code', monospace; }
    body { background-color: #030712; color: #06b6d4; }
    .grid-bg {
      background-image: 
        linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(6, 182, 212, 0.25);
    }
    .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); }
    .tab-active {
      background: rgba(6, 182, 212, 0.2);
      border-bottom: 2px solid #06b6d4;
      color: #38bdf8;
    }
    .reader-mode img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      border: 1px solid rgba(6, 182, 212, 0.3);
      margin: 1rem 0;
      display: inline-block;
    }
    .reader-mode video, .reader-mode audio {
      width: 100%;
      margin: 1rem 0;
      border-radius: 0.5rem;
    }
    .reader-mode a {
      color: #38bdf8;
      text-decoration: underline;
      cursor: pointer;
    }
    .reader-mode form input, .reader-mode form button, .reader-mode form select {
      background: #090d16;
      border: 1px solid #06b6d4;
      color: #ecfeff;
      padding: 0.4rem 0.8rem;
      border-radius: 0.375rem;
      margin: 0.25rem 0;
    }
    .reader-mode form button, .reader-mode input[type="submit"] {
      background: rgba(6, 182, 212, 0.3);
      font-weight: 600;
      cursor: pointer;
    }
    .reader-mode form button:hover, .reader-mode input[type="submit"]:hover {
      background: rgba(6, 182, 212, 0.6);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #0891b2; border-radius: 3px; }
  </style>
</head>
<body class="h-full w-screen overflow-hidden flex flex-col grid-bg select-none">

  <!-- TOP HEADER OMNIBOX -->
  <header class="glass-panel px-4 py-2 flex items-center justify-between border-b border-cyan-500/30 z-50">
    <div class="flex items-center space-x-3">
      <div onclick="goHome()" class="cursor-pointer flex items-center text-cyan-400 font-bold tracking-widest text-xs px-2.5 py-1 rounded bg-cyan-950/60 border border-cyan-500/40 hover:bg-cyan-900/50 transition">
        <i data-lucide="search" class="w-4 h-4 mr-2 text-cyan-400"></i>
        <span>CYBER_SEARCH</span>
      </div>
    </div>

    <!-- Central Search Input -->
    <div class="flex-1 max-w-3xl mx-4 flex items-center space-x-2">
      <button onclick="goHome()" class="p-1.5 hover:bg-cyan-950/60 rounded text-cyan-400 border border-cyan-800/40 transition" title="Home">
        <i data-lucide="home" class="w-4 h-4"></i>
      </button>

      <div class="relative flex-1 flex items-center">
        <i data-lucide="globe" class="w-4 h-4 absolute left-3 text-cyan-500"></i>
        <input 
          id="omnibox" 
          type="text" 
          placeholder="Search topics, news, images, videos or paste website/YouTube URL..." 
          class="w-full bg-slate-950/90 border border-cyan-500/40 rounded px-9 py-1.5 text-xs text-cyan-200 focus:outline-none focus:border-cyan-400 glow-cyan transition"
          onkeydown="if(event.key === 'Enter') handleSearchSubmit()"
        >
      </div>

      <button onclick="handleSearchSubmit()" class="px-4 py-1.5 bg-cyan-600/30 border border-cyan-400 text-cyan-300 rounded text-xs hover:bg-cyan-500/40 font-semibold transition">
        EXECUTE
      </button>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="openNewTab()" class="p-1.5 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 rounded border border-cyan-400/50 flex items-center text-xs space-x-1">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">NEW TAB</span>
      </button>
    </div>
  </header>

  <!-- TAB BAR -->
  <div id="tabBar" class="bg-slate-950/80 border-b border-cyan-500/20 px-3 flex items-center space-x-1 overflow-x-auto h-9 text-xs"></div>

  <!-- MAIN VIEWPORT CONTAINER -->
  <main id="viewportContainer" class="flex-1 relative bg-slate-950/90 overflow-hidden"></main>

  <!-- MODAL CONTAINER FOR IMAGE LIGHTBOX -->
  <div id="modalContainer" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass-panel p-4 rounded-xl max-w-4xl w-full max-h-[90vh] flex flex-col border border-cyan-500/50 relative">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-cyan-400 hover:text-white p-1 rounded-lg bg-slate-900 border border-cyan-500/40">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div id="modalContent" class="flex-1 overflow-y-auto mt-6"></div>
    </div>
  </div>

  <!-- STATUS FOOTER -->
  <footer class="glass-panel px-4 py-1 flex justify-between items-center text-[10px] text-cyan-500/70 border-t border-cyan-500/30">
    <div class="flex items-center space-x-3">
      <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> PROXY ROUTER: ONLINE (searchhubio)</span>
    </div>
    <div class="flex items-center space-x-4">
      <span>TABS: <span id="tabCount">1</span></span>
      <span id="clock">00:00:00</span>
    </div>
  </footer>

  <script>
    // Primary Proxy Worker requested
    const PRIMARY_PROXY = "https://small-hill-0227.searchhubio.workers.dev/?url=";
    
    // Fallback proxies if primary site is strict or times out
    const FALLBACK_PROXIES = [
      "https://api.allorigins.win/raw?url=",
      "https://corsproxy.io/?"
    ];

    let tabs = [];
    let activeTabId = null;
    let searchOffsets = {};
    let activeCategory = {};

    const SPEED_DIALS = [
      { name: 'Google News', query: 'Google Latest World News', icon: 'newspaper' },
      { name: 'YouTube Tech', query: 'site:youtube.com tech review', icon: 'video' },
      { name: 'GitHub Repos', query: 'GitHub open source trending', icon: 'code' },
      { name: 'Reddit Discussions', query: 'Reddit technology trends', icon: 'message-square' },
      { name: 'Wikipedia', query: 'Wikipedia Free Encyclopedia', icon: 'book-open' },
      { name: 'Internet Archive', query: 'Internet Archive digital library', icon: 'archive' }
    ];

    const NATIVE_EMBED_DOMAINS = [
      'youtube.com', 'youtu.be', 'vimeo.com', 'wikipedia.org', 
      'archive.org', 'codepen.io', 'jsfiddle.net', 'soundcloud.com', 'spotify.com'
    ];

    window.onload = () => {
      openNewTab();
      setInterval(updateClock, 1000);
      updateClock();
      lucide.createIcons();
    };

    function updateClock() {
      document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
    }

    function openNewTab(url = 'nexus://newtab') {
      const id = 'tab_' + Date.now() + '_' + Math.floor(Math.random()*1000);
      const isSearch = url.startsWith('search://');
      const searchTerms = isSearch ? decodeURIComponent(url.replace('search://', '')) : '';

      const tab = {
        id: id,
        title: isSearch ? `Search: ${searchTerms}` : (url === 'nexus://newtab' ? 'Cyber Launchpad' : getDomainName(url)),
        url: url
      };
      
      activeCategory[id] = 'ALL';
      tabs.push(tab);
      renderTabs();
      switchTab(id);
    }

    // FIXED CLOSE TAB HANDLER
    function closeTab(id, e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      // Remove tab DOM viewport
      const vp = document.getElementById('viewport_' + id);
      if (vp) vp.remove();

      // Filter tabs array
      const targetIndex = tabs.findIndex(t => t.id === id);
      tabs = tabs.filter(t => t.id !== id);
      delete activeCategory[id];

      if (tabs.length === 0) {
        openNewTab();
        return;
      }

      // If closed tab was active, activate adjacent tab
      if (activeTabId === id) {
        const nextActiveIndex = Math.max(0, targetIndex - 1);
        switchTab(tabs[nextActiveIndex].id);
      } else {
        renderTabs();
      }
    }

    function switchTab(id) {
      activeTabId = id;
      renderTabs();
      renderViewports();
      
      const tab = tabs.find(t => t.id === id);
      if (tab) {
        let displayVal = '';
        if (tab.url.startsWith('search://')) {
          displayVal = decodeURIComponent(tab.url.replace('search://', ''));
        } else if (tab.url !== 'nexus://newtab') {
          displayVal = tab.url;
        }
        document.getElementById('omnibox').value = displayVal;
      }
    }

    function renderTabs() {
      const tabBar = document.getElementById('tabBar');
      document.getElementById('tabCount').innerText = tabs.length;
      tabBar.innerHTML = '';

      tabs.forEach(tab => {
        const isActive = tab.id === activeTabId;
        const el = document.createElement('div');
        el.className = `flex items-center space-x-2 px-3 py-1 rounded-t border-t border-x border-cyan-500/20 cursor-pointer min-w-[140px] max-w-[210px] justify-between transition ${isActive ? 'tab-active font-semibold' : 'text-cyan-500/70 hover:bg-slate-900/50'}`;
        el.onclick = () => switchTab(tab.id);

        let iconName = 'globe';
        if (tab.url === 'nexus://newtab') iconName = 'layout-grid';
        if (tab.url.startsWith('search://')) iconName = 'search';
        if (tab.url.includes('youtube.com') || tab.url.includes('youtu.be')) iconName = 'video';

        el.innerHTML = `
          <div class="flex items-center space-x-1.5 overflow-hidden">
            <i data-lucide="${iconName}" class="w-3.5 h-3.5 shrink-0"></i>
            <span class="truncate text-[11px]">${escapeHtml(tab.title)}</span>
          </div>
          <button onclick="closeTab('${tab.id}', event)" class="hover:text-cyan-200 rounded p-0.5 hover:bg-cyan-500/20">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        `;
        tabBar.appendChild(el);
      });
      lucide.createIcons();
    }

    function renderViewports() {
      const container = document.getElementById('viewportContainer');
      
      tabs.forEach(tab => {
        let vp = document.getElementById('viewport_' + tab.id);
        if (!vp) {
          vp = document.createElement('div');
          vp.id = 'viewport_' + tab.id;
          vp.className = 'w-full h-full absolute inset-0';
          container.appendChild(vp);
          loadTabContent(tab, vp);
        }
        
        vp.style.display = (tab.id === activeTabId) ? 'block' : 'none';
      });
    }

    function loadTabContent(tab, element) {
      if (tab.url === 'nexus://newtab') {
        element.innerHTML = getNewTabHTML(tab.id);
        attachNewTabEvents(tab.id);
      } else if (tab.url.startsWith('search://')) {
        const query = decodeURIComponent(tab.url.replace('search://', ''));
        searchOffsets[tab.id] = 0;
        renderSearchResultsPage(tab, element, query);
      } else {
        processWebOrMediaUrl(tab, element, tab.url);
      }
      lucide.createIcons();
    }

    /* WEBPAGE & MEDIA RENDERER WITH MULTI-PROXY PIPELINE TO PREVENT "REFUSED TO CONNECT" */
    function processWebOrMediaUrl(tab, element, url) {
      // YouTube Handler
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const videoId = extractYouTubeId(url);
        if (videoId) {
          const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
          element.innerHTML = `
            <div class="w-full h-full flex flex-col bg-black">
              <div class="bg-slate-900 border-b border-cyan-500/30 px-4 py-2 flex justify-between items-center text-xs">
                <span class="text-cyan-400 font-bold flex items-center"><i data-lucide="play-circle" class="w-4 h-4 mr-2"></i> YOUTUBE EMBEDDED PLAYER</span>
                <a href="${escapeHtml(url)}" target="_blank" class="text-cyan-500 hover:underline flex items-center space-x-1">
                  <span>Open Direct</span> <i data-lucide="external-link" class="w-3 h-3"></i>
                </a>
              </div>
              <div class="flex-1 w-full h-full">
                <iframe 
                  src="${embedUrl}" 
                  class="w-full h-full border-0" 
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                  referrerpolicy="strict-origin-when-cross-origin"
                  allowfullscreen
                ></iframe>
              </div>
            </div>
          `;
        } else {
          element.innerHTML = `
            <div class="w-full h-full flex flex-col items-center justify-center p-6 text-center">
              <div class="glass-panel p-8 rounded-xl max-w-xl border border-yellow-500/40 glow-cyan">
                <i data-lucide="alert-triangle" class="w-12 h-12 text-yellow-400 mx-auto mb-4"></i>
                <h2 class="text-lg font-bold text-yellow-300 mb-2">Direct Video URL Required</h2>
                <p class="text-xs text-slate-300 mb-6 leading-relaxed">
                  YouTube homepages or channel pages restrict framing. 
                  Please enter a specific video URL (e.g. <code class="text-cyan-300">https://www.youtube.com/watch?v=...</code>).
                </p>
                <div class="flex justify-center space-x-3">
                  <button onclick="goHome()" class="px-4 py-2 bg-slate-800 border border-cyan-500/40 text-cyan-300 rounded text-xs hover:bg-slate-700">Back to Launchpad</button>
                  <a href="${escapeHtml(url)}" target="_blank" class="px-4 py-2 bg-cyan-600 border border-cyan-400 text-slate-950 font-bold rounded text-xs hover:bg-cyan-500 flex items-center space-x-1">
                    <span>Open YouTube Direct</span> <i data-lucide="external-link" class="w-3 h-3"></i>
                  </a>
                </div>
              </div>
            </div>
          `;
        }
        lucide.createIcons();
        return;
      }

      // Proxy Reader Mode for All Other Websites (Bypasses Frame-Ancestors / Refused To Connect)
      renderReaderModePage(element, url);
    }

    function extractYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function fetchProxyData(targetUrl) {
      const proxyList = [PRIMARY_PROXY, ...FALLBACK_PROXIES];

      for (const proxy of proxyList) {
        try {
          const fetchUrl = `${proxy}${encodeURIComponent(targetUrl)}`;
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 8000);

          const res = await fetch(fetchUrl, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            const text = await res.text();
            if (text && text.length > 50) return text;
          }
        } catch (e) {
          console.warn("Proxy attempt failed:", proxy, e);
        }
      }
      throw new Error("All proxy nodes failed or target website blocked proxy request.");
    }

    /* INTERACTIVE READER ENGINE: REWRITES LINKS AND SIGN-UP FORMS */
    async function renderReaderModePage(element, url) {
      element.innerHTML = `
        <div class="w-full h-full flex flex-col items-center justify-center p-8">
          <div class="text-center space-y-3">
            <i data-lucide="loader" class="w-8 h-8 text-cyan-400 animate-spin mx-auto"></i>
            <p class="text-xs text-cyan-300 tracking-wider">CONNECTING THROUGH PROXY (small-hill-0227.searchhubio)...</p>
            <p class="text-[10px] text-slate-400 max-w-md truncate mx-auto">${escapeHtml(url)}</p>
          </div>
        </div>
      `;
      lucide.createIcons();

      try {
        const rawHtml = await fetchProxyData(url);
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHtml, 'text/html');

        const baseUrl = new URL(url);

        // Rewrite Image, Video, & Media URLs
        doc.querySelectorAll('img').forEach(img => {
          try {
            const src = img.getAttribute('src');
            if (src) img.src = new URL(src, baseUrl).href;
          } catch(e){}
        });
        doc.querySelectorAll('video, audio, source').forEach(media => {
          try {
            const src = media.getAttribute('src');
            if (src) media.src = new URL(src, baseUrl).href;
          } catch(e){}
        });

        // Intercept All Web Links so they open inside CYBER_SEARCH instead of getting blocked
        doc.querySelectorAll('a').forEach(a => {
          try {
            const href = a.getAttribute('href');
            if (href && !href.startsWith('javascript:') && !href.startsWith('#')) {
              const fullUrl = new URL(href, baseUrl).href;
              a.setAttribute('onclick', `event.preventDefault(); navigateCurrentTab('${fullUrl}');`);
            }
          } catch(e){}
        });

        const title = doc.querySelector('title')?.innerText || url;
        const mainContent = doc.body ? doc.body.innerHTML : rawHtml;

        element.innerHTML = `
          <div class="w-full h-full overflow-y-auto p-4 md:p-8 bg-slate-950">
            <div class="max-w-4xl mx-auto space-y-6">
              
              <div class="glass-panel p-4 rounded-xl border border-cyan-500/40 flex justify-between items-center">
                <div>
                  <span class="text-[10px] text-cyan-400 font-bold tracking-widest block mb-1">[INTERACTIVE WEB READER]</span>
                  <h1 class="text-base font-bold text-cyan-100 truncate max-w-xl">${escapeHtml(title)}</h1>
                </div>
                <a href="${escapeHtml(url)}" target="_blank" class="px-3 py-1.5 bg-cyan-600/30 border border-cyan-400 text-cyan-300 rounded text-xs hover:bg-cyan-500/40 flex items-center space-x-1 shrink-0">
                  <span>Open External</span>
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </a>
              </div>

              <div id="proxyBody_${activeTabId}" class="glass-panel p-6 md:p-10 rounded-xl border border-cyan-500/20 reader-mode text-slate-300 text-sm leading-relaxed space-y-4 select-text">
                ${mainContent}
              </div>

            </div>
          </div>
        `;

        // Intercept Sign-Up, Login & Dynamic Search Forms
        const proxyBody = document.getElementById(`proxyBody_${activeTabId}`);
        if (proxyBody) {
          proxyBody.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', (e) => {
              e.preventDefault();
              const action = form.getAttribute('action') || url;
              const targetUrl = new URL(action, baseUrl).href;
              alert(`[CYBER_SEARCH Form Action Submitted]\nForm routed through proxy: ${targetUrl}`);
              navigateCurrentTab(targetUrl);
            });
          });
        }

      } catch (err) {
        console.error("Reader Mode Error:", err);
        element.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center p-6 text-center">
            <div class="glass-panel p-8 rounded-xl max-w-lg border border-red-500/40">
              <i data-lucide="shield-alert" class="w-10 h-10 text-red-400 mx-auto mb-3"></i>
              <h2 class="text-sm font-bold text-red-300 mb-2">TARGET WEBSITE BLOCKED CONNECTION</h2>
              <p class="text-xs text-slate-400 mb-4">This website explicitly blocks cross-origin proxy requests. You can view it directly in a new tab.</p>
              <a href="${escapeHtml(url)}" target="_blank" class="px-4 py-2 bg-cyan-600 border border-cyan-400 text-slate-950 font-bold rounded text-xs hover:bg-cyan-500 inline-flex items-center space-x-1">
                <span>Open Direct in Browser</span> <i data-lucide="external-link" class="w-3 h-3"></i>
              </a>
            </div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    /* SEARCH ENGINE CATEGORY PIPELINES */
    async function searchDuckDuckGo(query) {
      const targetSearchUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
      const rawHtml = await fetchProxyData(targetSearchUrl);
      
      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHtml, 'text/html');
      const results = doc.querySelectorAll('.result');

      const parsed = [];
      results.forEach((res, i) => {
        if (i >= 10) return;
        const titleEl = res.querySelector('.result__title a');
        const snippetEl = res.querySelector('.result__snippet');

        if (titleEl) {
          let href = titleEl.getAttribute('href') || '';
          if (href.includes('uddg=')) {
            href = decodeURIComponent(href.split('uddg=')[1].split('&')[0]);
          }
          parsed.push({
            title: titleEl.textContent.trim(),
            url: href,
            snippet: snippetEl ? snippetEl.textContent.trim() : 'Click to open site inside CYBER_SEARCH.',
            source: 'WEB'
          });
        }
      });
      return parsed;
    }

    async function searchWikipedia(query, offset = 0) {
      const wikiUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=8&sroffset=${offset}&format=json&origin=*`;
      const res = await fetch(wikiUrl);
      const data = await res.json();
      if (!data.query || !data.query.search) return [];

      return data.query.search.map(item => ({
        title: item.title,
        url: `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title.replace(/ /g, '_'))}`,
        snippet: item.snippet.replace(/<\/?[^>]+(>|$)/g, "") + "...",
        source: 'WIKIPEDIA'
      }));
    }

    async function searchImagesWikimedia(query) {
      const imgUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=16&prop=pageimages|imageinfo&iiprop=url|extmetadata&pithumbsize=500&format=json&origin=*`;
      const res = await fetch(imgUrl);
      const data = await res.json();
      if (!data.query || !data.query.pages) return [];

      const images = [];
      Object.values(data.query.pages).forEach(page => {
        if (page.thumbnail || page.imageinfo) {
          const thumb = page.thumbnail?.source || page.imageinfo?.[0]?.url;
          const full = page.imageinfo?.[0]?.url || thumb;
          if (thumb) {
            images.push({
              title: page.title.replace('File:', ''),
              thumbUrl: thumb,
              fullUrl: full,
              source: 'IMAGE ENGINE'
            });
          }
        }
      });
      return images;
    }

    async function searchHackerNews(query) {
      const hnUrl = `https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(query)}&hitsPerPage=8`;
      const res = await fetch(hnUrl);
      const data = await res.json();
      if (!data.hits) return [];

      return data.hits.map(item => ({
        title: item.title || item.story_title || 'Web Discussion',
        url: item.url || `https://news.ycombinator.com/item?id=${item.objectID}`,
        snippet: `Points: ${item.points || 0} | Author: ${item.author} | Comments: ${item.num_comments || 0}`,
        source: 'NEWS & DISCUSSIONS'
      }));
    }

    function renderSearchResultsPage(tab, element, query) {
      const cat = activeCategory[tab.id] || 'ALL';

      element.innerHTML = `
        <div class="w-full h-full overflow-y-auto p-4 md:p-8">
          <div class="max-w-4xl mx-auto space-y-5">
            
            <div class="border-b border-cyan-500/20 pb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <p class="text-[10px] text-cyan-500/70 uppercase">CYBER_SEARCH AGGREGATOR</p>
                <h2 class="text-lg font-bold text-cyan-200">"${escapeHtml(query)}"</h2>
              </div>

              <!-- CATEGORY BUTTONS -->
              <div class="flex items-center space-x-1 bg-slate-900/90 p-1 rounded-lg border border-cyan-500/30">
                <button onclick="setCategory('${tab.id}', 'ALL', '${escapeHtml(query)}')" class="px-3 py-1 rounded text-xs font-semibold flex items-center space-x-1 transition ${cat === 'ALL' ? 'bg-cyan-500 text-slate-950' : 'text-cyan-400 hover:bg-cyan-950'}">
                  <i data-lucide="globe" class="w-3.5 h-3.5"></i>
                  <span>ALL</span>
                </button>
                <button onclick="setCategory('${tab.id}', 'IMAGES', '${escapeHtml(query)}')" class="px-3 py-1 rounded text-xs font-semibold flex items-center space-x-1 transition ${cat === 'IMAGES' ? 'bg-cyan-500 text-slate-950' : 'text-cyan-400 hover:bg-cyan-950'}">
                  <i data-lucide="image" class="w-3.5 h-3.5"></i>
                  <span>IMAGES</span>
                </button>
                <button onclick="setCategory('${tab.id}', 'VIDEOS', '${escapeHtml(query)}')" class="px-3 py-1 rounded text-xs font-semibold flex items-center space-x-1 transition ${cat === 'VIDEOS' ? 'bg-cyan-500 text-slate-950' : 'text-cyan-400 hover:bg-cyan-950'}">
                  <i data-lucide="video" class="w-3.5 h-3.5"></i>
                  <span>VIDEOS</span>
                </button>
                <button onclick="setCategory('${tab.id}', 'NEWS', '${escapeHtml(query)}')" class="px-3 py-1 rounded text-xs font-semibold flex items-center space-x-1 transition ${cat === 'NEWS' ? 'bg-cyan-500 text-slate-950' : 'text-cyan-400 hover:bg-cyan-950'}">
                  <i data-lucide="newspaper" class="w-3.5 h-3.5"></i>
                  <span>NEWS</span>
                </button>
              </div>
            </div>

            <div id="statusIndicator_${tab.id}" class="text-xs text-cyan-400 animate-pulse flex items-center space-x-1.5">
              <i data-lucide="loader" class="w-4 h-4 animate-spin"></i>
              <span>SCANNING FOR ${cat} RESULTS...</span>
            </div>

            <div id="resultsList_${tab.id}"></div>

            <div class="pt-4 flex justify-center">
              <button id="getResultsBtn_${tab.id}" onclick="getMoreResults('${tab.id}', '${escapeHtml(query)}')" class="px-6 py-2 bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 rounded-lg text-xs hover:bg-cyan-900/60 font-semibold transition flex items-center space-x-2 glow-cyan">
                <i data-lucide="arrow-down-circle" class="w-4 h-4"></i>
                <span>GET RESULTS</span>
              </button>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();

      fetchAndDisplayCategoryResults(tab.id, query, 0, false);
    }

    function setCategory(tabId, category, query) {
      activeCategory[tabId] = category;
      searchOffsets[tabId] = 0;
      const tab = tabs.find(t => t.id === tabId);
      const vp = document.getElementById('viewport_' + tabId);
      if (tab && vp) renderSearchResultsPage(tab, vp, query);
    }

    async function fetchAndDisplayCategoryResults(tabId, query, offset, append = false) {
      const cat = activeCategory[tabId] || 'ALL';
      const listContainer = document.getElementById(`resultsList_${tabId}`);
      const statusInd = document.getElementById(`statusIndicator_${tabId}`);

      let html = '';

      if (cat === 'ALL') {
        const results = await Promise.allSettled([searchDuckDuckGo(query), searchWikipedia(query, offset), searchHackerNews(query)]);
        let combined = [];
        results.forEach(r => { if(r.status === 'fulfilled' && Array.isArray(r.value)) combined = combined.concat(r.value); });
        
        html = `<div class="space-y-4">` + combined.map(res => `
          <div class="glass-panel p-4 rounded-xl border border-cyan-500/20 hover:border-cyan-400/50 transition flex justify-between items-start space-x-4">
            <div class="flex-1">
              <div class="flex items-center space-x-2 mb-1">
                <span class="text-[9px] px-1.5 py-0.5 rounded bg-cyan-950 border border-cyan-500/40 text-cyan-300 font-bold">${res.source}</span>
                <span class="text-[10px] text-cyan-400/80 truncate">${escapeHtml(res.url)}</span>
              </div>
              <a href="#" onclick="openResultUrl('${escapeHtml(res.url)}'); return false;" class="text-sm font-bold text-sky-300 hover:text-cyan-200 transition underline underline-offset-4 decoration-cyan-500/40">
                ${escapeHtml(res.title)}
              </a>
              <p class="text-xs text-slate-300 mt-2 leading-relaxed">${escapeHtml(res.snippet)}</p>
            </div>
          </div>
        `).join('') + `</div>`;

      } else if (cat === 'IMAGES') {
        const images = await searchImagesWikimedia(query);
        html = `
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            ${images.map(img => `
              <div onclick="openImageLightbox('${escapeHtml(img.fullUrl)}', '${escapeHtml(img.title)}')" class="glass-panel p-2 rounded-xl border border-cyan-500/20 hover:border-cyan-400 group cursor-pointer transition">
                <div class="aspect-square w-full overflow-hidden rounded-lg bg-black flex items-center justify-center">
                  <img src="${escapeHtml(img.thumbUrl)}" class="w-full h-full object-cover group-hover:scale-105 transition" loading="lazy">
                </div>
                <span class="text-[10px] text-cyan-300 block truncate mt-2 font-medium">${escapeHtml(img.title)}</span>
              </div>
            `).join('')}
          </div>
        `;

      } else if (cat === 'VIDEOS') {
        const ddgVideoQuery = `site:youtube.com watch ${query}`;
        const videos = await searchDuckDuckGo(ddgVideoQuery);

        html = `
          <div class="space-y-6">
            ${videos.map(vid => {
              const videoId = extractYouTubeId(vid.url);
              if (!videoId) return '';
              const embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0`;
              return `
                <div class="glass-panel p-4 rounded-xl border border-cyan-500/30 space-y-3">
                  <div class="flex justify-between items-center text-xs">
                    <span class="font-bold text-cyan-300 truncate">${escapeHtml(vid.title)}</span>
                    <button onclick="openResultUrl('${escapeHtml(vid.url)}')" class="px-2.5 py-1 bg-cyan-950 border border-cyan-500/40 text-cyan-300 rounded hover:bg-cyan-900 text-[10px] shrink-0">Full Tab</button>
                  </div>
                  <div class="w-full aspect-video rounded-lg overflow-hidden border border-cyan-500/20 bg-black">
                    <iframe 
                      src="${embedUrl}" 
                      class="w-full h-full border-0" 
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                      referrerpolicy="strict-origin-when-cross-origin"
                      allowfullscreen
                    ></iframe>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

      } else if (cat === 'NEWS') {
        const news = await searchHackerNews(query);
        html = `
          <div class="space-y-3">
            ${news.map(item => `
              <div class="glass-panel p-4 rounded-xl border border-cyan-500/20 hover:border-cyan-400 transition">
                <span class="text-[9px] px-1.5 py-0.5 rounded bg-cyan-950 border border-cyan-500/40 text-cyan-300 font-bold block w-max mb-1">NEWS</span>
                <a href="#" onclick="openResultUrl('${escapeHtml(item.url)}'); return false;" class="text-sm font-bold text-sky-300 hover:text-cyan-200 transition">
                  ${escapeHtml(item.title)}
                </a>
                <p class="text-xs text-slate-400 mt-1">${escapeHtml(item.snippet)}</p>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (statusInd) statusInd.style.display = 'none';

      if (append) {
        listContainer.innerHTML += html;
      } else {
        listContainer.innerHTML = html;
      }
      lucide.createIcons();
    }

    async function getMoreResults(tabId, query) {
      searchOffsets[tabId] = (searchOffsets[tabId] || 0) + 10;
      const btn = document.getElementById(`getResultsBtn_${tabId}`);
      if (btn) btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i><span>FETCHING...</span>`;
      lucide.createIcons();
      
      await fetchAndDisplayCategoryResults(tabId, query, searchOffsets[tabId], true);
      
      if (btn) btn.innerHTML = `<i data-lucide="arrow-down-circle" class="w-4 h-4"></i><span>GET RESULTS</span>`;
      lucide.createIcons();
    }

    function openImageLightbox(fullUrl, title) {
      const modal = document.getElementById('modalContainer');
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="flex flex-col items-center space-y-4">
          <img src="${escapeHtml(fullUrl)}" class="max-h-[70vh] w-auto rounded-lg border border-cyan-500/40 object-contain">
          <h3 class="text-sm font-bold text-cyan-200 text-center">${escapeHtml(title)}</h3>
          <a href="${escapeHtml(fullUrl)}" target="_blank" class="px-4 py-2 bg-cyan-500 text-slate-950 font-bold rounded text-xs hover:bg-cyan-400 flex items-center space-x-1">
            <span>Open High Resolution Image</span> <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          </a>
        </div>
      `;
      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modalContainer').classList.add('hidden');
    }

    function openResultUrl(url) {
      openNewTab(url);
    }

    function handleSearchSubmit() {
      const input = document.getElementById('omnibox').value.trim();
      if (!input) return;
      
      if (input.startsWith('http://') || input.startsWith('https://') || (input.includes('.') && !input.includes(' '))) {
        let target = input.startsWith('http') ? input : 'https://' + input;
        navigateCurrentTab(target);
      } else {
        navigateCurrentTab('search://' + encodeURIComponent(input));
      }
    }

    function navigateCurrentTab(url) {
      const tab = tabs.find(t => t.id === activeTabId);
      if (!tab) return;

      tab.url = url;
      if (url.startsWith('search://')) {
        const query = decodeURIComponent(url.replace('search://', ''));
        tab.title = `Search: ${query}`;
      } else {
        tab.title = getDomainName(url);
      }
      
      const vp = document.getElementById('viewport_' + tab.id);
      if (vp) loadTabContent(tab, vp);
      renderTabs();
    }

    function goHome() {
      navigateCurrentTab('nexus://newtab');
    }

    function getNewTabHTML(tabId) {
      return `
        <div class="w-full h-full overflow-y-auto p-6 md:p-12 flex flex-col items-center justify-between">
          <div class="w-full max-w-4xl flex flex-col items-center">
            
            <div class="text-center my-6">
              <div class="inline-flex items-center space-x-2 bg-cyan-950/60 border border-cyan-500/40 px-3 py-1 rounded-full text-xs text-cyan-400 mb-3 glow-cyan">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span>CYBER_SEARCH PROXY ENGINE</span>
              </div>
              <h1 class="text-3xl md:text-5xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-500">
                CYBER_SEARCH
              </h1>
              <p class="text-xs text-cyan-500/70 mt-2">Universal Search, Media Grid & Interactive Proxy Engine</p>
            </div>

            <!-- Central Search Bar -->
            <div class="w-full max-w-2xl relative my-4">
              <div class="relative flex items-center">
                <i data-lucide="search" class="w-5 h-5 absolute left-4 text-cyan-400"></i>
                <input 
                  id="tabSearchInput_${tabId}"
                  type="text" 
                  placeholder="Search any topic, images, videos or paste direct URL..." 
                  class="w-full bg-slate-900/90 border-2 border-cyan-500/50 rounded-xl px-12 py-3 text-sm text-cyan-100 placeholder-cyan-600 focus:outline-none focus:border-cyan-300 glow-cyan transition"
                >
                <button 
                  id="tabSearchBtn_${tabId}"
                  class="absolute right-3 px-4 py-1.5 bg-cyan-500 text-slate-950 font-bold text-xs rounded-lg hover:bg-cyan-400 transition"
                >
                  SEARCH
                </button>
              </div>
            </div>

            <!-- Speed Dial Shortcuts -->
            <div class="w-full max-w-3xl mt-8">
              <h3 class="text-xs font-semibold text-cyan-500 tracking-wider mb-4 text-left">FAST_QUERIES</h3>
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                ${SPEED_DIALS.map(dial => `
                  <button 
                    onclick="navigateCurrentTab('search://${encodeURIComponent(dial.query)}')"
                    class="glass-panel p-3 rounded-lg flex flex-col items-center hover:border-cyan-400 hover:bg-cyan-950/40 transition group"
                  >
                    <div class="p-2.5 rounded-full bg-slate-900/80 mb-2 border border-cyan-500/20 group-hover:scale-110 transition">
                      <i data-lucide="${dial.icon}" class="w-5 h-5 text-cyan-400"></i>
                    </div>
                    <span class="text-xs text-cyan-300 font-medium truncate w-full text-center">${dial.name}</span>
                  </button>
                `).join('')}
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function attachNewTabEvents(tabId) {
      const input = document.getElementById(`tabSearchInput_${tabId}`);
      const btn = document.getElementById(`tabSearchBtn_${tabId}`);

      if (input && btn) {
        const execute = () => {
          const val = input.value.trim();
          if (!val) return;
          if (val.startsWith('http://') || val.startsWith('https://') || (val.includes('.') && !val.includes(' '))) {
            let target = val.startsWith('http') ? val : 'https://' + val;
            navigateCurrentTab(target);
          } else {
            navigateCurrentTab('search://' + encodeURIComponent(val));
          }
        };

        btn.onclick = execute;
        input.onkeydown = (e) => { if (e.key === 'Enter') execute(); };
      }
    }

    function getDomainName(url) {
      try {
        return new URL(url).hostname.replace('www.', '');
      } catch(e) {
        return url.length > 15 ? url.substring(0, 15) + '...' : url;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
