}

}

  border:1px solid #dfe1e5;
  border-radius:26px;
  display:flex;
  align-items:center;
  padding:0 8px 0 18px;
  transition:.2s;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.search:focus-within{
  box-shadow:0 2px 9px rgba(0,0,0,.15);
}

.search input{
  flex:1;
  border:0;
  outline:0;

  min-width:0;
}

.search button{

  width:40px;

.search button:hover{

========================================================= */

.node{
  background:white;

}

.status{

}

.progress{
  height:3px;
  border-radius:5px;
  overflow:hidden;
  background:#e9eaed;
  margin-top:7px;
}

.progress-bar{
  width:25%;
  height:100%;
  background:#4285f4;

}

@keyframes progress{
  0%{
    transform:translateX(-150%);
  }
  100%{
    transform:translateX(500%);

}

   RESULTS
========================================================= */

.result{

========================================================= */

.reader{

<body>

<section class="system">

<main class="container">

      </p>

<script>

/* =========================================================
   NOVA SEARCH ENGINE
=========================================================

   IMPORTANT:

   Nova does NOT use Google.

   Discovery sources:

   • Mojeek
   • DuckDuckGo
   • Wikipedia

   Nova then performs its own:

   • indexing
   • deduplication
   • scoring
   • ranking
   • result presentation

========================================================= */


const STORAGE_KEY =
  "nova_search_index_v1";


let localIndex = {};

let currentResults = [];

let currentQuery = "";

let activeTab = "all";


/* =========================================================
   STORAGE
========================================================= */

try{

  localIndex =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "{}"
    );

}catch{

  localIndex = {};

}


function saveIndex(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        localIndex
      )
    );

  }catch{

    /*
      Keep newest 400 documents
      if storage is full.
    */

    const pages =
      Object.values(
        localIndex
      )
      .sort(
        (a,b)=>
          b.time-a.time
      )
      .slice(
        0,
        400
      );


    localIndex = {};

    pages.forEach(
      page =>
        localIndex[
          page.url
        ] = page
    );


    try{

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          localIndex
        )
      );

    }catch{}

  }

}


/* =========================================================
   UTILITIES
========================================================= */

function escapeHTML(
  value
){

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function tokenize(
  text
){

  return String(
    text || ""
  )
  .toLowerCase()
  .replace(
    /[^a-z0-9\s]/g,
    " "
  )
  .split(
    /\s+/
  )
  .filter(
    word =>
      word.length > 1
  );

}


function setStatus(
  message
){

  document
    .getElementById(
      "status"
    )
    .textContent =
      message;

}


/* =========================================================
   NETWORK
========================================================= */

async function request(
  url,
  timeout = 9000
){

  const controller =
    new AbortController();


  const timer =
    setTimeout(
      () =>
        controller.abort(),
      timeout
    );


  try{

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP "+
        response.status
      );

    }


    return response;

  }finally{

    clearTimeout(
      timer
    );

  }

}


/* =========================================================
   NOVA READER PROXY
========================================================= */

async function readThroughProxy(
  url
){

  try{

    const response =
      await request(
        "https://r.jina.ai/"+
        url,
        12000
      );


    return await response.text();

  }catch{

    return "";

  }

}


/* =========================================================
   JSON
========================================================= */

async function getJSON(
  url
){

  try{

    const response =
      await request(
        url,
        9000
      );


    return await response.json();

  }catch{

    return null;

  }

}


/* =========================================================
   CREATE DOCUMENT
========================================================= */

function makeDocument(
  url,
  title,
  text,
  source,
  type = "web"
){

  const allWords =
    tokenize(
      title+
      " "+
      text
    );


  const frequencies = {};


  for(
    const word
    of allWords
  ){

    frequencies[
      word
    ] =
      (
        frequencies[
          word
        ] || 0
      ) + 1;

  }


  return {

    url,

    title:
      title ||
      url,

    text:
      text ||
      "",

    source:
      source ||
      "Web",

    type,

    frequencies,

    time:
      Date.now()

  };

}


/* =========================================================
   INDEX DOCUMENT
========================================================= */

function indexDocument(
  document
){

  if(
    !document ||
    !document.url
  )
    return;


  localIndex[
    document.url
  ] =
    document;


  saveIndex();

}


/* =========================================================
   MOJEEK DISCOVERY
========================================================= */

async function searchMojeek(
  query
){

  /*
    Mojeek is an independent search engine.

    We use it ONLY as a discovery source.

    Nova does its own ranking afterwards.
  */

  const url =
    "https://www.mojeek.com/search?q="+
    encodeURIComponent(
      query
    );


  const markdown =
    await readThroughProxy(
      url
    );


  if(
    !markdown
  )
    return [];


  return parseSearchMarkdown(
    markdown,
    "Mojeek"
  );

}


/* =========================================================
   DUCKDUCKGO DISCOVERY
========================================================= */

async function searchDuckDuckGo(
  query
){

  const data =
    await getJSON(

      "https://api.duckduckgo.com/"+
      "?q="+
      encodeURIComponent(
        query
      )+
      "&format=json"+
      "&no_html=1"+
      "&skip_disambig=0"

    );


  if(!data)
    return [];


  const results = [];


  if(
    data.AbstractURL
  ){

    results.push({

      url:
        data.AbstractURL,

      title:
        data.Heading ||
        query,

      snippet:
        data.AbstractText ||
        "",

      source:
        "DuckDuckGo",

      type:
        "knowledge"

    });

  }


  function topics(
    list
  ){

    (
      list ||
      []
    ).forEach(
      item=>{

        if(
          item.FirstURL
        ){

          results.push({

            url:
              item.FirstURL,

            title:
              (
                item.Text ||
                "Result"
              )
              .split(
                " - "
              )[0],

            snippet:
              item.Text ||
              "",

            source:
              "DuckDuckGo",

            type:
              "web"

          });

        }


        if(
          item.Topics
        ){

          topics(
            item.Topics
          );

        }

      }
    );

  }


  topics(
    data.RelatedTopics
  );


  return results;

}


/* =========================================================
   WIKIPEDIA DISCOVERY
========================================================= */

async function searchWikipedia(
  query
){

  const data =
    await getJSON(

      "https://en.wikipedia.org/w/api.php"+
      "?action=query"+
      "&list=search"+
      "&srsearch="+
      encodeURIComponent(
        query
      )+
      "&srlimit=10"+
      "&format=json"+
      "&origin=*"

    );


  if(
    !data?.query?.search
  )
    return [];


  return data
    .query
    .search
    .map(
      item=>({

        url:
          "https://en.wikipedia.org/wiki/"+
          encodeURIComponent(
            item.title
              .replace(
                / /g,
                "_"
              )
          ),

        title:
          item.title,

        snippet:
          item.snippet
            .replace(
              /<[^>]+>/g,
              ""
            ),

        source:
          "Wikipedia",

        type:
          "knowledge"

      })
    );

}


/* =========================================================
   SEARCH MARKDOWN PARSER
========================================================= */

function parseSearchMarkdown(
  markdown,
  source
){

  const results = [];

  const seen =
    new Set();


  /*
    Markdown links.
  */

  const links =
    markdown.matchAll(
      /\[([^\]]{2,200})\]\((https?:\/\/[^)\s]+)\)/g
    );


  for(
    const match
    of links
  ){

    let url =
      match[2]
        .replace(
          /[.,;:]+$/,
          ""
        );


    try{

      const parsed =
        new URL(
          url
        );


      /*
        Never include the discovery
        search engine itself.
      */

      if(
        /mojeek\.com$/i.test(
          parsed.hostname
        )
      )
        continue;


      if(
        /duckduckgo\.com$/i.test(
          parsed.hostname
        )
      )
        continue;


      if(
        seen.has(
          url
        )
      )
        continue;


      seen.add(
        url
      );


      results.push({

        url,

        title:
          match[1],

        snippet:
          "Webpage discovered by "+
          source+".",

        source,

        type:
          "web"

      });


    }catch{}

  }


  return results.slice(
    0,
    20
  );

}


/* =========================================================
   CRAWL PAGE
========================================================= */

async function crawlPage(
  result
){

  if(
    localIndex[
      result.url
    ]
  ){

    return localIndex[
      result.url
    ];

  }


  const markdown =
    await readThroughProxy(
      result.url
    );


  if(
    !markdown
  )
    return null;


  let title =
    result.title;


  const titleMatch =
    markdown.match(
      /^#\s+(.+)$/m
    );


  if(
    titleMatch
  ){

    title =
      titleMatch[1];

  }


  /*
    Remove Markdown syntax
    for indexing.
  */

  const text =
    markdown

      .replace(
        /!\[[^\]]*\]\([^)]*\)/g,
        " "
      )

      .replace(
        /\[([^\]]+)\]\([^)]*\)/g,
        "$1"
      )

      .replace(
        /[#>*`]/g,
        " "
      )

      .replace(
        /\s+/g,
        " "
      )

      .trim();


  const document =
    makeDocument(
      result.url,
      title,
      text,
      result.source,
      result.type
    );


  indexDocument(
    document
  );


  return document;

}


/* =========================================================
   RANKING
========================================================= */

function rankResults(
  query,
  documents
){

  const queryWords =
    [
      ...new Set(
        tokenize(
          query
        )
      )
    ];


  return documents
    .map(
      document=>{

        const title =
          String(
            document.title
          )
          .toLowerCase();


        const body =
          String(
            document.text ||
            document.snippet ||
            ""
          )
          .toLowerCase();


        const url =
          String(
            document.url
          )
          .toLowerCase();


        let score = 0;

        let matched = 0;


        for(
          const word
          of queryWords
        ){

          const frequency =
            document
              .frequencies?.[
                word
              ] ||
              0;


          if(
            frequency
          )
            matched++;


          /*
            Term frequency
          */

          score +=
            Math.min(
              frequency,
              20
            ) * 2;


          /*
            Title match
          */

          if(
            title.includes(
              word
            )
          ){

            score +=
              35;

          }


          /*
            URL match
          */

          if(
            url.includes(
              word
            )
          ){

            score +=
              10;

          }


          /*
            Body match
          */

          if(
            body.includes(
              word
            )
          ){

            score +=
              5;

          }

        }


        /*
          Exact phrase
        */

        if(
          body.includes(
            query.toLowerCase()
          )
        ){

          score +=
            45;

        }


        /*
          Exact title
        */

        if(
          title ===
          query.toLowerCase()
        ){

          score +=
            80;

        }


        /*
          Coverage
        */

        const coverage =
          queryWords.length
            ? matched /
              queryWords.length
            : 0;


        score +=
          coverage * 35;


        /*
          Small freshness bonus.
        */

        const age =
          (
            Date.now() -
            document.time
          ) /
          86400000;


        score +=
          Math.max(
            0,
            10-age
          );


        return {

          ...document,

          score

        };

      }
    )
    .sort(
      (a,b)=>
        b.score -
        a.score
    );

}


/* =========================================================
   MAIN SEARCH
========================================================= */

async function novaSearch(
  query
){

  setStatus(
    "Discovering independent sources..."
  );


  /*
    Query several sources
    simultaneously.
  */

  const [
    mojeek,
    duckduckgo,
    wikipedia
  ] =
    await Promise.all([
      searchMojeek(
        query
      ),

      searchDuckDuckGo(
        query
      ),

      searchWikipedia(
        query
      )
    ]);


  const discovered =
    [
      ...mojeek,
      ...duckduckgo,
      ...wikipedia
    ];


  /*
    Deduplicate URLs.
  */

  const unique =
    [
      ...new Map(
        discovered.map(
          item=>[
            item.url,
            item
          ]
        )
      ).values()
    ];


  setStatus(
    "Crawling "+
    unique.length+
    " discovered pages..."
  );


  /*
    Crawl pages concurrently.
  */

  const crawled =
    await Promise.all(
      unique
        .slice(
          0,
          15
        )
        .map(
          item =>
            crawlPage(
              item
            )
        )
    );


  const documents =
    crawled
      .filter(Boolean);


  /*
    Include structured results even
    when crawling failed.
  */

  unique.forEach(
    result=>{

      if(
        !localIndex[
          result.url
        ]
      ){

        indexDocument({

          url:
            result.url,

          title:
            result.title,

          text:
            result.snippet,

          snippet:
            result.snippet,

          source:
            result.source,

          type:
            result.type,

          time:
            Date.now(),

          frequencies:
            Object.fromEntries(
              tokenize(
                result.title+
                " "+
                result.snippet
              ).map(
                word=>[
                  word,
                  1
                ]
              )
            )

        });

      }

    }
  );


  setStatus(
    "Nova is ranking results..."
  );


  /*
    Our ranking engine now takes over.
  */

  let results =
    rankResults(
      query,
      Object.values(
        localIndex
      )
    );


  /*
    If the local index somehow has
    nothing, use the structured results
    directly rather than failing.
  */

  if(
    !results.length
  ){

    results =
      rankResults(
        query,
        unique.map(
          result=>
            makeDocument(
              result.url,
              result.title,
              result.snippet,
              result.source,
              result.type
            )
        )
      );

  }


  /*
    Last-resort independent result.
    This is NOT Google.
  */

  if(
    !results.length
  ){

    results = [{

      url:
        "https://www.mojeek.com/search?q="+
        encodeURIComponent(
          query
        ),

      title:
        "Search Mojeek for "+
        query,

      text:
        "No indexed pages were returned. Continue the live search using Mojeek.",

      source:
        "Mojeek",

      type:
        "web",

      score:
        1

    }];

  }


  setStatus(
    "Search complete • "+
    results.length+
    " results ranked by Nova"
  );


  return results;

}


/* =========================================================
   OVERVIEW
========================================================= */

function buildOverview(
  query,
  results
){

  const sourceNames =
    [
      ...new Set(
        results
          .slice(
            0,
            10
          )
          .map(
            r =>
              r.source
          )
          .filter(Boolean)
      )
    ];


  /*
    Extract useful snippets from
    the highest-ranked results.
  */

  const snippets =
    results
      .slice(
        0,
        3
      )
      .map(
        r =>
          (
            r.text ||
            r.snippet ||
            ""
          )
          .replace(
            /\s+/g,
            " "
          )
          .slice(
            0,
            250
          )
      )
      .filter(Boolean);


  return `

    <section class="overview">

      <div class="overview-title">
        Overview
      </div>

      <p>
        Nova searched independent public
        sources, discovered webpages,
        built a local index and ranked
        the available information using
        its own relevance system.
      </p>

      ${
        snippets.length
        ?
        `<p>
          ${escapeHTML(
            snippets.join(
              " "
            )
          )}
        </p>`
        :
        ""
      }

      <div class="sources">

        ${sourceNames
          .map(
            source =>
              `<span class="source">
                ${escapeHTML(
                  source
                )}
              </span>`
          )
          .join("")
        }

      </div>

    </section>

  `;

}


/* =========================================================
   RESULT FILTERING
========================================================= */

function filteredResults(){

  if(
    activeTab ===
    "all"
  ){

    return currentResults;

  }


  if(
    activeTab ===
    "knowledge"
  ){

    return currentResults
      .filter(
        r =>
          r.type ===
          "knowledge"
      );

  }


  if(
    activeTab ===
    "technology"
  ){

    return currentResults
      .filter(
        r =>
          /github|developer|mozilla|npm|stackoverflow|w3schools/i
          .test(
            r.url
          )
      );

  }


  if(
    activeTab ===
    "videos"
  ){

    return currentResults
      .filter(
        r =>
          /youtube|youtu\.be|vimeo/i
          .test(
            r.url
          )
      );

  }


  return currentResults;

}


/* =========================================================
   RENDER
========================================================= */

function renderResults(){

  const root =
    document.getElementById(
      "results"
    );


  const results =
    filteredResults();


  document
    .getElementById(
      "tabs"
    )
    .style.display =
      currentResults.length
      ? "flex"
      : "none";


  if(
    !results.length
  ){

    root.innerHTML = `

      <div class="empty">

        <h2>
          No results in this category
        </h2>

        <p>
          Try the All tab.
        </p>

      </div>

    `;

    return;

  }


  let html =
    buildOverview(
      currentQuery,
      results
    );


  results
    .slice(
      0,
      30
    )
    .forEach(
      (result,index)=>{

        html += `

          <article class="result">

            <div class="score">

              ${Number(
                result.score ||
                0
              ).toFixed(1)}

            </div>

            <div class="result-source">

              ${escapeHTML(
                result.source ||
                "Web"
              )}

              ·

              ${escapeHTML(
                result.url
              )}

            </div>

            <div
              class="result-title"
              onclick="
                openResult(
                  ${currentResults.indexOf(
                    result
                  )}
                )
              "
            >

              ${escapeHTML(
                result.title
              )}

            </div>

            <div class="result-description">

              ${escapeHTML(
                result.text ||
                result.snippet ||
                "Open this result."
              ).slice(
                0,
                450
              )}

            </div>

            <div class="result-meta">

              Ranked by Nova

            </div>

          </article>

        `;

      }
    );


  root.innerHTML =
    html;

}


/* =========================================================
   OPEN / RECONSTRUCT PAGE
========================================================= */

async function openResult(
  index
){

  const result =
    currentResults[
      index
    ];


  if(
    !result
  )
    return;


  setStatus(
    "Reading and reconstructing webpage..."
  );


  const root =
    document.getElementById(
      "results"
    );


  const markdown =
    await readThroughProxy(
      result.url
    );


  if(
    markdown
  ){

    root.innerHTML = `

      <button
        class="back"
        onclick="
          renderResults()
        "
      >
        ← Back to results
      </button>

      <article class="reader">

        <div class="reader-toolbar">

          <a
            class="open"
            href="${escapeHTML(
              result.url
            )}"
            target="_blank"
            rel="noopener"
          >
            Open original website ↗
          </a>

        </div>

        <h1>
          ${escapeHTML(
            result.title
          )}
        </h1>

        ${convertMarkdown(
          markdown,
          result.url
        )}

      </article>

    `;


    setStatus(
      "Page reconstructed by Nova Reader"
    );


    return;

  }


  /*
    Reader failed.

    Automatically try the original
    page inside an iframe.
  */

  root.innerHTML = `

    <button
      class="back"
      onclick="
        renderResults()
      "
    >
      ← Back to results
    </button>

    <article class="reader">

      <div class="reader-toolbar">

        <a
          class="open"
          href="${escapeHTML(
            result.url
          )}"
          target="_blank"
          rel="noopener"
        >
          Open original ↗
        </a>

      </div>

      <h1>
        ${escapeHTML(
          result.title
        )}
      </h1>

      <iframe
        src="${escapeHTML(
          result.url
        )}"
        loading="lazy"
        referrerpolicy="no-referrer"
      ></iframe>

    </article>

  `;


  setStatus(
    "Reader unavailable • trying original page"
  );

}


/* =========================================================
   MARKDOWN → READER
========================================================= */

function convertMarkdown(
  markdown,
  baseURL
){

  let html =
    escapeHTML(
      markdown
    );


  /*
    Headings
  */

  html =
    html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );


  html =
    html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );


  html =
    html.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );


  /*
    Images
  */

  html =
    html.replace(
      /!\[([^\]]*)\]\(([^)]+)\)/g,
      (_,alt,url)=>{

        try{

          url =
            new URL(
              url,
              baseURL
            ).href;

        }catch{}


        return `

          <img
            src="${escapeHTML(
              url
            )}"
            alt="${escapeHTML(
              alt
            )}"
            loading="lazy"
          >

        `;

      }
    );


  /*
    Links
  */

  html =
    html.replace(
      /\[([^\]]+)\]\(([^)]+)\)/g,
      (_,text,url)=>{

        try{

          url =
            new URL(
              url,
              baseURL
            ).href;

        }catch{}


        /*
          YouTube links become
          playable embeds.
        */

        const youtube =
          url.match(
            /(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/
          );


        if(
          youtube
        ){

          return `

            <div class="video-grid">

              <div class="video">

                <iframe
                  src="https://www.youtube.com/embed/${youtube[1]}"
                  allowfullscreen
                  loading="lazy"
                ></iframe>

                <div class="video-title">
                  ${escapeHTML(
                    text
                  )}
                </div>

              </div>

            </div>

          `;

        }


        return `

          <a
            href="${escapeHTML(
              url
            )}"
            target="_blank"
            rel="noopener"
          >
            ${text}
          </a>

        `;

      }
    );


  /*
    Raw YouTube links.
  */

  html =
    html.replace(
      /https?:\/\/(?:www\.)?youtube\.com\/watch\?v=([A-Za-z0-9_-]{11})/g,
      (_,id)=>`

        <div class="video-grid">

          <div class="video">

            <iframe
              src="https://www.youtube.com/embed/${id}"
              allowfullscreen
              loading="lazy"
            ></iframe>

            <div class="video-title">
              YouTube video
            </div>

          </div>

        </div>

      `
    );


  /*
    Paragraphs
  */

  html =
    html.replace(
      /\n{2,}/g,
      "</p><p>"
    );


  return `
    <p>
      ${html}
    </p>
  `;

}


/* =========================================================
   FORM
========================================================= */

document
  .getElementById(
    "searchForm"
  )
  .addEventListener(
    "submit",
    async event=>{

      event.preventDefault();


      const query =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .trim();


      if(
        !query
      )
        return;


      currentQuery =
        query;


      activeTab =
        "all";


      document
        .getElementById(
          "results"
        )
        .innerHTML = `

          <div class="loading">

            Discovering the web...

          </div>

        `;


      try{

        currentResults =
          await novaSearch(
            query
          );


        renderResults();


      }catch(error){

        console.error(
          error
        );


        /*
          Independent fallback.

          IMPORTANT:
          This is Mojeek, NOT Google.
        */

        currentResults = [{

          url:
            "https://www.mojeek.com/search?q="+
            encodeURIComponent(
              query
            ),

          title:
            "Continue searching for "+
            query+

            " on Mojeek",

          text:
            "Nova's independent discovery providers did not return enough data. Continue the live search using Mojeek.",

          source:
            "Mojeek",

          type:
            "web",

          score:
            1

        }];


        renderResults();


        setStatus(
          "Independent fallback ready"
        );

      }

    }
  );


/* =========================================================
   CATEGORY TABS
========================================================= */

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    tab=>{

      tab.addEventListener(
        "click",
        ()=>{

          document
            .querySelectorAll(
              ".tab"
            )
            .forEach(
              x =>
                x.classList
                  .remove(
                    "active"
                  )
            );


          tab.classList
            .add(
              "active"
            );


          activeTab =
            tab.dataset.tab;


          renderResults();

        }
      );

    }
  );


/* =========================================================
   HOME
========================================================= */

function goHome(){

  document
    .getElementById(
      "searchInput"
    )
    .value="";


  currentResults=[];

  currentQuery="";


  document
    .getElementById(
      "tabs"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "results"
    )
    .innerHTML = `

      <div class="empty">

        <h2>
          Nova Search
        </h2>

        <p>
          Independent web search.
        </p>

        <p>
          Crawl → Index → Rank → Discover
        </p>

      </div>

    `;


  setStatus(
    "Nova Search ready"
  );

}
