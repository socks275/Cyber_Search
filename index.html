<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberRevision</title>

<style>
*{box-sizing:border-box}

:root{
    --bg:#020611;
    --panel:#07111f;
    --panel2:#0b1728;
    --border:#163653;
    --cyan:#00eaff;
    --purple:#8b5cf6;
    --green:#00ff9d;
    --red:#ff416c;
    --text:#eafaff;
    --muted:#7892a6;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 0%,#06304a 0,transparent 35%),
        radial-gradient(circle at 100% 100%,#241044 0,transparent 35%),
        #020611;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* AUTH */

#auth{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:460px;
    background:rgba(7,17,31,.96);
    border:1px solid var(--border);
    border-radius:20px;
    padding:35px;
    box-shadow:0 0 80px rgba(0,234,255,.08);
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:3px;
}

.logo span{
    color:var(--cyan);
    text-shadow:0 0 15px var(--cyan);
}

.auth-sub{
    color:var(--muted);
    margin:8px 0 30px;
}

label{
    display:block;
    color:#86a8ba;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
    margin:16px 0 7px;
    text-transform:uppercase;
}

input,textarea,select{
    width:100%;
    padding:12px;
    color:white;
    background:#020914;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
}

input:focus,textarea:focus,select:focus{
    border-color:var(--cyan);
    box-shadow:0 0 15px rgba(0,234,255,.12);
}

textarea{
    min-height:100px;
    resize:vertical;
}

.btn{
    border:1px solid var(--border);
    border-radius:8px;
    padding:11px 16px;
    color:white;
    background:#081827;
    font-weight:bold;
}

.btn:hover{
    border-color:var(--cyan);
}

.primary{
    background:#075d76;
    border-color:var(--cyan);
}

.green{
    background:#06271c;
    border-color:#00a86b;
    color:var(--green);
}

.red{
    background:#2a0b16;
    border-color:#7d1835;
    color:#ff7895;
}

.purple{
    background:#1a1031;
    border-color:#6945ae;
    color:#c7b4ff;
}

.actions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.error{
    min-height:20px;
    color:#ff6688;
    margin-top:15px;
}

/* APP */

#app{
    display:none;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:245px;
    background:rgba(2,8,17,.97);
    border-right:1px solid var(--border);
    padding:22px 13px;
    z-index:10;
}

.sidebar .logo{
    padding:5px 10px 30px;
}

.nav-title{
    color:#45657a;
    font-size:10px;
    font-weight:bold;
    letter-spacing:2px;
    padding:10px;
}

.nav button{
    width:100%;
    display:block;
    text-align:left;
    border:1px solid transparent;
    background:transparent;
    color:#708da0;
    padding:12px;
    margin:2px 0;
    border-radius:8px;
    font-weight:bold;
}

.nav button:hover,
.nav button.active{
    color:var(--cyan);
    background:#061a29;
    border-color:#123d56;
}

.main{
    margin-left:245px;
    width:calc(100% - 245px);
    min-height:100vh;
    padding:28px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.top h2{
    margin:6px 0 0;
}

.muted{
    color:var(--muted);
}

.profile{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--cyan);
    background:#061b2b;
    border:1px solid var(--cyan);
    font-weight:bold;
}

.grid{
    display:grid;
    gap:18px;
}

.g2{
    grid-template-columns:repeat(2,1fr);
}

.g3{
    grid-template-columns:repeat(3,1fr);
}

.g4{
    grid-template-columns:repeat(4,1fr);
}

.panel{
    background:rgba(7,17,31,.94);
    border:1px solid var(--border);
    border-radius:15px;
    padding:20px;
}

.hero{
    background:
        linear-gradient(135deg,rgba(0,234,255,.07),rgba(139,92,246,.08)),
        rgba(7,17,31,.96);
    border:1px solid #18536a;
    border-radius:17px;
    padding:28px;
}

.hero h1{
    font-size:31px;
}

.badge{
    display:inline-block;
    border:1px solid #15516a;
    background:#06202e;
    color:var(--cyan);
    border-radius:50px;
    padding:5px 9px;
    font-size:10px;
    font-weight:bold;
}

.stat{
    color:var(--cyan);
    font-size:30px;
    font-weight:900;
}

.statlabel{
    color:var(--muted);
    font-size:10px;
    letter-spacing:1px;
}

.progress{
    width:100%;
    height:8px;
    overflow:hidden;
    background:#020914;
    border-radius:20px;
}

.progress i{
    display:block;
    height:100%;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
}

.set{
    position:relative;
    overflow:hidden;
}

.set:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    right:0;
    height:2px;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
}

.meta{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.card-row{
    padding:15px;
    background:#030c16;
    border:1px solid var(--border);
    border-radius:10px;
    margin:12px 0;
}

.row-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

/* FLASHCARD */

.flashcard{
    min-height:350px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:35px;
    border:1px solid #19536c;
    border-radius:18px;
    background:
        radial-gradient(circle,rgba(0,234,255,.07),transparent 55%),
        #050f1b;
    cursor:pointer;
    user-select:none;
}

.flashcard:hover{
    border-color:var(--cyan);
}

.flash-label{
    color:var(--cyan);
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:15px;
}

.flash-text{
    font-size:30px;
    font-weight:900;
    line-height:1.4;
}

/* QUIZ */

.question{
    font-size:27px;
    font-weight:900;
    line-height:1.35;
    margin:25px 0;
}

.answers{
    display:grid;
    gap:10px;
}

.answer{
    width:100%;
    padding:16px;
    text-align:left;
    border:1px solid var(--border);
    border-radius:9px;
    background:#071522;
    color:white;
    font-weight:bold;
}

.answer:hover{
    border-color:var(--cyan);
}

.answer.correct{
    background:#06271b;
    border-color:var(--green);
}

.answer.wrong{
    background:#2b0b16;
    border-color:var(--red);
}

@media(max-width:850px){

    .sidebar{
        width:65px;
    }

    .sidebar .logo{
        font-size:0;
        text-align:center;
    }

    .sidebar .logo:after{
        content:"C";
        font-size:25px;
        color:var(--cyan);
    }

    .nav-title{
        display:none;
    }

    .nav button{
        font-size:0;
        text-align:center;
    }

    .nav button:after{
        content:"◆";
        font-size:11px;
    }

    .main{
        margin-left:65px;
        width:calc(100% - 65px);
        padding:17px;
    }

    .g2,.g3,.g4{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->

<div id="auth">
    <div class="auth-box">

        <div class="logo">
            CYBER<span>REVISION</span>
        </div>

        <div class="auth-sub">
            // GAMIFIED REVISION NETWORK
        </div>

        <div id="authContent"></div>

    </div>
</div>


<!-- MAIN APPLICATION -->

<div id="app">

    <aside class="sidebar">

        <div class="logo">
            CYBER<span>REVISION</span>
        </div>

        <div class="nav-title">
            REVISION SYSTEM
        </div>

        <div class="nav">

            <button id="nav-dashboard" onclick="showPage('dashboard')">
                Dashboard
            </button>

            <button id="nav-sets" onclick="showPage('sets')">
                Public Sets
            </button>

            <button id="nav-create" onclick="showPage('create')">
                Create Flashcards
            </button>

            <button id="nav-flashcards" onclick="showPage('flashcards')">
                Flashcards
            </button>

            <button id="nav-quiz" onclick="showPage('quiz')">
                Question Battle
            </button>

            <button id="nav-tests" onclick="showPage('tests')">
                Tests
            </button>

            <button id="nav-games" onclick="showPage('games')">
                Games
            </button>

            <button id="nav-pvp" onclick="showPage('pvp')">
                Player vs Player
            </button>

            <button id="nav-progress" onclick="showPage('progress')">
                Progress
            </button>

            <button id="nav-settings" onclick="showPage('settings')">
                Settings
            </button>

            <button id="nav-admin" class="hidden" onclick="showPage('admin')">
                Admin Panel
            </button>

        </div>

    </aside>


    <main class="main">

        <div class="top">

            <div>
                <div id="dateText" class="muted"></div>

                <h2 id="pageTitle">
                    Dashboard
                </h2>
            </div>

            <div class="profile">

                <span id="usernameDisplay"></span>

                <div id="avatar" class="avatar">
                </div>

            </div>

        </div>

        <div id="content"></div>

    </main>

</div>


<script>
"use strict";

/* =========================================================
   DATABASE & CONSTANTS
========================================================= */

const ADMIN_CODE = "CR-7X4Q-N9VM-2K8P-R6ZT-H3WF-91KD-V8QP";

const USERS_KEY = "CYBER_REVISION_USERS";
const PUBLIC_SETS_KEY = "CYBER_REVISION_PUBLIC_SETS";
const CURRENT_USER_KEY = "CYBER_REVISION_CURRENT_USER";

let currentUser = null;
let accountData = null;

let activeSet = null;
let activeCard = 0;
let cardFlipped = false;

let quizQuestions = [];
let quizPosition = 0;
let quizScore = 0;

/* Helper to escape strings safely for HTML rendering */
function escapeHTML(str) {
    if (!str) return "";
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* Sample Starter Sets */
const SAMPLE_SETS = [
    {
        id: "SET_SAMPLE_1",
        name: "Computer Science Basics",
        subject: "Other",
        author: "System",
        cards: [
            { front: "What does CPU stand for?", back: "Central Processing Unit" },
            { front: "What is the binary representation of 5?", back: "101" },
            { front: "What is RAM?", back: "Random Access Memory - volatile memory used for active programs." }
        ],
        created: Date.now()
    }
];

/* =========================================================
   SAFE STORAGE
========================================================= */

function readJSON(key, fallback){
    try{
        const value = localStorage.getItem(key);
        if(!value) return fallback;
        const parsed = JSON.parse(value);
        return parsed ?? fallback;
    }catch(error){
        console.warn("Storage error:", error);
        return fallback;
    }
}

function writeJSON(key, value){
    try{
        localStorage.setItem(key, JSON.stringify(value));
        return true;
    }catch(error){
        console.error("Could not save:", error);
        return false;
    }
}

/* =========================================================
   AUTH SCREENS
========================================================= */

function renderLogin(){
    document.getElementById("authContent").innerHTML = `
        <h1>ACCESS SYSTEM</h1>
        <p class="muted">// ENTER YOUR USERNAME</p>

        <label>Username</label>
        <input id="loginUsername" autocomplete="username" placeholder="Username">

        <label>Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password">

        <br><br>

        <div class="actions">
            <button class="btn primary" onclick="loginUser()">CONNECT</button>
            <button class="btn" onclick="renderSignup()">CREATE ACCOUNT</button>
        </div>

        <div id="authError" class="error"></div>
        <br>
        <button class="btn purple" onclick="renderAdminLogin()">ADMIN ACCESS</button>
    `;
}

function renderSignup(){
    document.getElementById("authContent").innerHTML = `
        <h1>CREATE ACCOUNT</h1>
        <p class="muted">// CREATE YOUR REVISION PROFILE</p>

        <label>Username</label>
        <input id="signupUsername" autocomplete="username" placeholder="3-20 characters">

        <label>Password</label>
        <input id="signupPassword" type="password" autocomplete="new-password" placeholder="Password">

        <label>Confirm Password</label>
        <input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Repeat password">

        <br><br>

        <div class="actions">
            <button class="btn primary" onclick="createAccount()">CREATE</button>
            <button class="btn" onclick="renderLogin()">BACK</button>
        </div>

        <div id="authError" class="error"></div>
    `;
}

function renderAdminLogin(){
    document.getElementById("authContent").innerHTML = `
        <h1>ADMIN ACCESS</h1>
        <p class="muted">// AUTHORIZED PERSONNEL ONLY</p>

        <label>Admin Code</label>
        <input id="adminCodeInput" type="password" placeholder="Admin code">

        <br><br>

        <div class="actions">
            <button class="btn purple" onclick="adminLogin()">AUTHORIZE</button>
            <button class="btn" onclick="renderLogin()">BACK</button>
        </div>

        <div id="authError" class="error"></div>
    `;
}

/* =========================================================
   USERS & ACCOUNTS
========================================================= */

function getUsers(){
    return readJSON(USERS_KEY, []);
}

function saveUsers(users){
    return writeJSON(USERS_KEY, users);
}

function createAccount(){
    const username = document.getElementById("signupUsername").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirm = document.getElementById("signupConfirm").value;
    const error = document.getElementById("authError");

    if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){
        error.textContent = "Username must be 3-20 letters, numbers or underscores.";
        return;
    }

    if(password.length < 4){
        error.textContent = "Password must contain at least 4 characters.";
        return;
    }

    if(password !== confirm){
        error.textContent = "Passwords do not match.";
        return;
    }

    const users = getUsers();
    const exists = users.some(user => user.username.toLowerCase() === username.toLowerCase());

    if(exists){
        error.textContent = "That username already exists.";
        return;
    }

    users.push({ username, password, admin: false });
    saveUsers(users);

    currentUser = { username, admin: false };
    accountData = createBlankData();
    saveAccount();
    launchApp();
}

function loginUser(){
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;
    const error = document.getElementById("authError");

    const users = getUsers();
    const found = users.find(user => user.username.toLowerCase() === username.toLowerCase());

    if(!found || found.password !== password){
        error.textContent = "Invalid username or password.";
        return;
    }

    currentUser = { username: found.username, admin: !!found.admin };
    loadAccount();
    launchApp();
}

function adminLogin(){
    const entered = document.getElementById("adminCodeInput").value.trim();
    const error = document.getElementById("authError");

    if(entered !== ADMIN_CODE){
        error.textContent = "ACCESS DENIED.";
        return;
    }

    const username = prompt("Enter the existing username to grant admin access:");
    if(!username) return;

    const users = getUsers();
    const found = users.find(user => user.username.toLowerCase() === username.trim().toLowerCase());

    if(!found){
        error.textContent = "That username does not exist.";
        return;
    }

    found.admin = true;
    saveUsers(users);

    currentUser = { username: found.username, admin: true };
    loadAccount();
    launchApp();
}

function createBlankData(){
    return {
        xp: 0,
        streak: 1,
        cardsStudied: 0,
        questionsAnswered: 0,
        correctAnswers: 0,
        memory: {},
        ownSets: [],
        daily: {
            date: new Date().toDateString(),
            cards: 0,
            questions: 0
        }
    };
}

function accountKey(){
    return "CYBER_REVISION_ACCOUNT_" + currentUser.username.toLowerCase();
}

function loadAccount(){
    accountData = readJSON(accountKey(), createBlankData());

    if(!accountData.memory) accountData.memory = {};
    if(!accountData.ownSets) accountData.ownSets = [];
    if(!accountData.daily) accountData.daily = { date: new Date().toDateString(), cards: 0, questions: 0 };

    if(accountData.daily.date !== new Date().toDateString()){
        accountData.daily = {
            date: new Date().toDateString(),
            cards: 0,
            questions: 0
        };
    }
    saveAccount();
}

function saveAccount(){
    writeJSON(accountKey(), accountData);
    writeJSON(CURRENT_USER_KEY, currentUser);
}

/* =========================================================
   LAUNCH & INITIALIZATION
========================================================= */

function launchApp(){
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("usernameDisplay").textContent = currentUser.username;
    document.getElementById("avatar").textContent = currentUser.username.charAt(0).toUpperCase();

    document.getElementById("dateText").textContent = new Date().toLocaleDateString(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    document.getElementById("nav-admin").classList.toggle("hidden", !currentUser.admin);
    showPage("dashboard");
}

/* Check auto login */
window.addEventListener("DOMContentLoaded", () => {
    const savedUser = readJSON(CURRENT_USER_KEY, null);
    if (savedUser && savedUser.username) {
        currentUser = savedUser;
        loadAccount();
        launchApp();
    } else {
        renderLogin();
    }
});

/* =========================================================
   PAGE ROUTER
========================================================= */

function showPage(name){
    const titles = {
        dashboard: "Dashboard",
        sets: "Public Study Sets",
        create: "Create Flashcards",
        flashcards: "Flashcards",
        quiz: "Question Battle",
        tests: "Revision Tests",
        games: "Games",
        pvp: "Player vs Player",
        progress: "Progress",
        settings: "Settings",
        admin: "Admin Panel"
    };

    document.getElementById("pageTitle").textContent = titles[name] || "CyberRevision";

    document.querySelectorAll(".nav button").forEach(button => {
        button.classList.remove("active");
    });

    const nav = document.getElementById("nav-" + name);
    if(nav) nav.classList.add("active");

    const pages = {
        dashboard: renderDashboard,
        sets: renderSets,
        create: renderCreate,
        flashcards: renderFlashcards,
        quiz: renderQuizHome,
        tests: renderTests,
        games: renderGames,
        pvp: renderPVP,
        progress: renderProgress,
        settings: renderSettings,
        admin: renderAdmin
    };

    if(pages[name]) pages[name]();
}

/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){
    const level = Math.floor(accountData.xp / 100) + 1;
    const accuracy = accountData.questionsAnswered
        ? Math.round(accountData.correctAnswers / accountData.questionsAnswered * 100)
        : 0;

    const cardProgress = Math.min(accountData.daily.cards * 10, 100);
    const questionProgress = Math.min(accountData.daily.questions * 10, 100);

    document.getElementById("content").innerHTML = `
        <div class="hero">
            <span class="badge">LEVEL ${level}</span>
            <h1>Welcome back, ${escapeHTML(currentUser.username)}.</h1>
            <p class="muted">// REVISION NETWORK ONLINE</p>

            <div class="stat">${accountData.xp} XP</div>
            <div class="progress"><i style="width:${accountData.xp % 100}%"></i></div>

            <br>
            <div class="actions">
                <button class="btn primary" onclick="showPage('create')">+ CREATE FLASHCARDS</button>
                <button class="btn purple" onclick="showPage('games')">PLAY GAMES</button>
            </div>
        </div>

        <br>
        <div class="grid g4">
            <div class="panel">
                <div class="statlabel">XP</div>
                <div class="stat">${accountData.xp}</div>
            </div>
            <div class="panel">
                <div class="statlabel">STREAK</div>
                <div class="stat">${accountData.streak} Days</div>
            </div>
            <div class="panel">
                <div class="statlabel">CARDS STUDIED</div>
                <div class="stat">${accountData.cardsStudied}</div>
            </div>
            <div class="panel">
                <div class="statlabel">ACCURACY</div>
                <div class="stat">${accuracy}%</div>
            </div>
        </div>

        <br>
        <div class="grid g2">
            <div class="panel">
                <h3>DAILY QUEST</h3>
                <p>Flashcards: <b>${Math.min(accountData.daily.cards,10)}/10</b></p>
                <div class="progress"><i style="width:${cardProgress}%"></i></div>
                <br>
                <p>Questions: <b>${Math.min(accountData.daily.questions,10)}/10</b></p>
                <div class="progress"><i style="width:${questionProgress}%"></i></div>
            </div>

            <div class="panel">
                <h3>MEMORY CORE</h3>
                <p class="muted">Your personal flashcard memory status.</p>
                <div class="stat">${Object.keys(accountData.memory).length}</div>
                <div class="statlabel">TRACKED CARDS</div>
            </div>
        </div>
    `;
}

/* =========================================================
   PUBLIC SETS
========================================================= */

function getPublicSets(){
    return readJSON(PUBLIC_SETS_KEY, SAMPLE_SETS);
}

function savePublicSets(sets){
    writeJSON(PUBLIC_SETS_KEY, sets);
}

function getAllSets(){
    const map = new Map();
    getPublicSets().forEach(set => map.set(set.id, set));
    accountData.ownSets.forEach(set => map.set(set.id, set));
    return [...map.values()];
}

function renderSets(){
    const sets = getAllSets();

    document.getElementById("content").innerHTML = `
        <div class="hero">
            <h2>PUBLIC STUDY NETWORK</h2>
            <p class="muted">Everyone can access published flashcard sets.</p>
            <button class="btn primary" onclick="showPage('create')">+ CREATE SET</button>
        </div>

        <br>
        <div class="grid g3">
            ${sets.length ? sets.map(set => `
                <div class="panel set">
                    <span class="badge">${escapeHTML(set.subject)}</span>
                    <h3>${escapeHTML(set.name)}</h3>
                    <div class="meta">${set.cards.length} cards</div>
                    <div class="meta">Created by ${escapeHTML(set.author)}</div>
                    <br>
                    <div class="actions">
                        <button class="btn primary" onclick="startFlashcards('${set.id}')">STUDY</button>
                        <button class="btn purple" onclick="startQuiz('${set.id}')">QUIZ</button>

}

/* =========================================================
   CREATE FLASHCARDS
========================================================= */

let cardNumber = 0;

function renderCreate(){
    cardNumber = 0;
    document.getElementById("content").innerHTML = `
        <div class="panel">
            <h2>CREATE PUBLIC STUDY SET</h2>
            <p class="muted">Create flashcards manually. Published sets are visible in the library.</p>

            <div class="grid g2">
                <div>
                    <label>Set Name</label>
                    <input id="newSetName" placeholder="e.g. Physics Forces">
                </div>
                <div>
                    <label>Subject</label>
                    <select id="newSetSubject">
                        <option>Maths</option>
                        <option>English</option>
                        <option>Biology</option>
                        <option>Chemistry</option>
                        <option>Physics</option>
                        <option>History</option>
                        <option>Geography</option>
                        <option>French</option>
                        <option>Latin</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>

            <br>
            <div id="cardEditor"></div>

            <div class="actions">
                <button class="btn" onclick="addFlashcardInput()">+ ADD FLASHCARD</button>
                <button class="btn primary" onclick="publishSet()">PUBLISH SET</button>
            </div>
        </div>
    `;

    addFlashcardInput();
    addFlashcardInput();
}

function addFlashcardInput(){
    cardNumber++;
    const wrapper = document.createElement("div");
    wrapper.className = "card-row";
    wrapper.innerHTML = `
        <div class="row-head">
            <span class="badge">CARD ${cardNumber}</span>
            <button class="btn red" onclick="this.parentElement.parentElement.remove()">DELETE</button>
        </div>
        <label>QUESTION / FRONT</label>
        <input class="flash-front" placeholder="What is...">
        <label>ANSWER / BACK</label>
        <textarea class="flash-back" placeholder="The answer is..."></textarea>
    `;
    document.getElementById("cardEditor").appendChild(wrapper);
}

function publishSet(){
    const name = document.getElementById("newSetName").value.trim();
    const subject = document.getElementById("newSetSubject").value;
    const fronts = document.querySelectorAll(".flash-front");
    const backs = document.querySelectorAll(".flash-back");

    const cards = [];
    for(let i = 0; i < fronts.length; i++){
        const front = fronts[i].value.trim();
        const back = backs[i].value.trim();
        if(front && back){
            cards.push({ front, back });
        }
    }

    if(!name){ alert("Enter a set name."); return; }
    if(cards.length === 0){ alert("Create at least one complete flashcard."); return; }

    const set = {
        id: "SET_" + Date.now() + "_" + Math.random().toString(36).slice(2),
        name: name,
        subject: subject,
        author: currentUser.username,
        authorKey: currentUser.username.toLowerCase(),
        cards: cards,
        created: Date.now()
    };

    accountData.ownSets.unshift(set);
    accountData.xp += cards.length * 5;

    const publicSets = getPublicSets();
    publicSets.unshift(set);

    savePublicSets(publicSets);
    saveAccount();

    alert("Study set published successfully.");
    showPage("sets");
}

/* =========================================================
   FLASHCARD PLAYER
========================================================= */

function renderFlashcards(){
    const sets = getAllSets();
    if(!activeSet && sets.length > 0) activeSet = sets[0];

    if(!activeSet){
        document.getElementById("content").innerHTML = `
            <div class="panel">
                <h3>No Flashcards Available</h3>
                <p class="muted">Create or select a study set to start studying.</p>
                <button class="btn primary" onclick="showPage('create')">+ CREATE SET</button>
            </div>
        `;
        return;
    }

    const card = activeSet.cards[activeCard] || { front: "End of Set", back: "End of Set" };

    document.getElementById("content").innerHTML = `
        <div class="panel">
            <div class="row-head">
                <div>
                    <h2>${escapeHTML(activeSet.name)}</h2>
                    <span class="badge">${escapeHTML(activeSet.subject)}</span>
                </div>
                <div>
                    <select onchange="changeActiveSet(this.value)">
                        ${sets.map(s => `<option value="${s.id}" ${s.id===activeSet.id?'selected':''}>${escapeHTML(s.name)}</option>`).join('')}
                    </select>
                </div>
            </div>

            <br>
            <div class="flashcard" onclick="flipCard()">
                <div class="flash-label">${cardFlipped ? "ANSWER / BACK" : "QUESTION / FRONT (CLICK TO FLIP)"}</div>
                <div class="flash-text">${escapeHTML(cardFlipped ? card.back : card.front)}</div>
            </div>

            <br>
            <div class="row-head">
                <button class="btn" onclick="prevCard()">PREVIOUS</button>
                <span class="muted">Card ${activeCard + 1} of ${activeSet.cards.length}</span>
                <button class="btn primary" onclick="nextCard()">NEXT</button>
            </div>
        </div>
    `;
}

function changeActiveSet(setId){
    const sets = getAllSets();
    activeSet = sets.find(s => s.id === setId);
    activeCard = 0;
    cardFlipped = false;
    renderFlashcards();
}

function flipCard(){
    cardFlipped = !cardFlipped;
    renderFlashcards();
}

function prevCard(){
    if(activeCard > 0) activeCard--;
    cardFlipped = false;
    renderFlashcards();
}

function nextCard(){
    if(activeCard < activeSet.cards.length - 1){
        activeCard++;
    } else {
        activeCard = 0;
    }
    cardFlipped = false;
    
    // Rewards
    accountData.cardsStudied++;
    accountData.daily.cards++;
    accountData.xp += 2;
    saveAccount();

    renderFlashcards();
}

/* =========================================================
   QUIZ / BATTLE
========================================================= */

function renderQuizHome(){
    const sets = getAllSets();
    document.getElementById("content").innerHTML = `
        <div class="panel">
            <h2>QUESTION BATTLE</h2>
            <p class="muted">Select a set to test your knowledge.</p>

            <div class="grid g3">
                ${sets.map(set => `
                    <div class="panel set">
                        <h3>${escapeHTML(set.name)}</h3>
                        <p class="muted">${set.cards.length} Questions</p>
                        <button class="btn purple" onclick="startQuiz('${set.id}')">START BATTLE</button>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

function startQuiz(setId){
    const sets = getAllSets();
    const set = sets.find(s => s.id === setId);
    if(!set || set.cards.length === 0){
        alert("Set has no questions!");
        return;
    }

    quizQuestions = set.cards.map(c => {
        // Generate dummy answers from other cards
        const otherBacks = set.cards.filter(x => x.back !== c.back).map(x => x.back);
        const distractors = otherBacks.sort(() => 0.5 - Math.random()).slice(0, 3);
        const choices = [...distractors, c.back].sort(() => 0.5 - Math.random());
        return {
            question: c.front,
            correct: c.back,
            choices: choices
        };
    });

    quizPosition = 0;
    quizScore = 0;
    renderQuizQuestion();
}

function renderQuizQuestion(){
    if(quizPosition >= quizQuestions.length){
        renderQuizResults();
        return;
    }

    const q = quizQuestions[quizPosition];

    document.getElementById("content").innerHTML = `
        <div class="panel">
            <div class="row-head">
                <span class="badge">QUESTION ${quizPosition + 1}/${quizQuestions.length}</span>
                <span class="statlabel">SCORE: ${quizScore}</span>
            </div>

            <div class="question">${escapeHTML(q.question)}</div>

            <div class="answers">
                ${q.choices.map(choice => `
                    <button class="answer" onclick="submitAnswer(this, '${escapeHTML(choice)}')">
                        ${escapeHTML(choice)}
                    </button>
                `).join('')}
            </div>
        </div>
    `;
}

function submitAnswer(btn, choice){
    const q = quizQuestions[quizPosition];
    const correct = choice === q.correct;

    accountData.questionsAnswered++;
    accountData.daily.questions++;

    if(correct){
        btn.classList.add("correct");
        quizScore += 10;
        accountData.correctAnswers++;
        accountData.xp += 10;
    } else {
        btn.classList.add("wrong");
    }

    saveAccount();

    setTimeout(() => {
        quizPosition++;
        renderQuizQuestion();
    }, 1000);
}

function renderQuizResults(){
    document.getElementById("content").innerHTML = `
        <div class="panel text-center">
            <h2>BATTLE COMPLETE!</h2>
            <div class="stat">${quizScore} POINTS</div>
            <p class="muted">XP Earned: ${quizScore}</p>
            <br>
            <button class="btn primary" onclick="showPage('quiz')">PLAY AGAIN</button>
        </div>
    `;
}
