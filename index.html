<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Search — Web Search Engine</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#202124
}
header{
  height:70px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  gap:22px;
  padding:0 28px;
}
.logo{
  font-size:25px;
  font-weight:700;
  letter-spacing:-1px;
}
.logo span:nth-child(1){color:#4285f4}
.logo span:nth-child(2){color:#ea4335}
.logo span:nth-child(3){color:#fbbc05}
.logo span:nth-child(4){color:#4285f4}
.logo span:nth-child(5){color:#34a853}
.searchbox{
  width:min(760px,75vw);
  height:46px;
  border:1px solid #dfe1e5;
  border-radius:25px;
  display:flex;
  align-items:center;
  padding:0 16px;
  box-shadow:0 1px 5px #0001;
}
.searchbox input{
  border:0;
  outline:0;
  flex:1;
  font-size:16px;
}
.searchbox button{
  border:0;
  background:none;
  font-size:21px;
  cursor:pointer;
}

  width:min(1050px,94%);
  margin:18px auto;
  padding:14px;
  border:1px solid #e5e7eb;
  border-radius:14px;
  background:#fafafa;
}

  display:grid;
  grid-template-columns:1fr 35px 1fr 35px 1fr;
  gap:8px;
  align-items:center;
}
.stage{
  padding:12px;
  border:1px solid #e5e7eb;
  border-radius:10px;
  background:white;
}
.stage strong{
  display:block;
  font-size:12px;
}
.stage small{
  display:block;
  color:#777;
  margin-top:4px;
}
.arrow{
  text-align:center;
  color:#4285f4;
  font-size:22px;
}
.status{
  margin-top:10px;
  color:#777;
  font-size:12px;
}
.progress{
  margin-top:8px;
  height:3px;
  background:#e5e7eb;
  overflow:hidden;
  border-radius:10px;
}
.progress i{
  display:block;
  width:30%;
  height:100%;
  background:#4285f4;
  animation:move 1s linear infinite;
}
@keyframes move{
  from{transform:translateX(-150%)}
  to{transform:translateX(450%)}
}
main{
  width:min(1050px,94%);
  margin:auto;
}
.overview{
  border:1px solid #d9e5ff;
  background:#f8faff;
  border-radius:14px;
  padding:18px;
  margin-bottom:20px;
}
.overview h2{
  margin:0 0 10px;
  font-size:20px;
}
.overview p{
  line-height:1.6;
}
.result{
  padding:17px 0;
  border-bottom:1px solid #eee;
}
.url{
  color:#188038;
  font-size:13px;
  margin-bottom:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.title{
  color:#1a0dab;
  font-size:20px;
  cursor:pointer;
}
.title:hover{text-decoration:underline}
.snippet{
  margin-top:6px;
  color:#4d5156;
  line-height:1.55;
}
.score{
  float:right;
  color:#888;
  font:10px monospace;
}
.reader{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:30px;
  margin-top:20px;
}
.reader h1{
  font-size:34px;
}
.reader p{
  font-size:17px;
  line-height:1.8;
}
.reader img{
  max-width:100%;
  border-radius:10px;
}
.reader a{
  color:#1a73e8;
}
.back{
  border:0;
  background:none;
  color:#1a73e8;
  cursor:pointer;
  font-size:14px;
}
.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}
.video{
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
}
.video iframe{
  width:100%;
  aspect-ratio:16/9;
  border:0;
}
.video-title{
  padding:10px;
  font-weight:bold;
}

  padding:50px 0;
  color:#777;
}

  text-align:center;
  padding:60px;
  color:#777;
}

  header{padding:0 12px}
  .logo{display:none}
  .searchbox{width:100%}
  .flow{grid-template-columns:1fr}
  .arrow{display:none}
}
</style>
</head>

<body>

<header>

  <div class="logo">
    <span>C</span><span>y</span><span>b</span><span>e</span><span>r</span>
  </div>

  <form class="searchbox" id="searchForm">

    <input
      id="query"
      placeholder="Search the web..."
      autocomplete="off"
    >

    <button type="submit">⌕</button>

  </form>

</header>


<section class="engine">

  <div class="flow">

    <div class="stage">
      <strong>CRAWL</strong>
      <small>Discover public webpages</small>
    </div>

    <div class="arrow">→</div>

    <div class="stage">
      <strong>INDEX</strong>
      <small>Analyze and store information</small>
    </div>

    <div class="arrow">→</div>

    <div class="stage">
      <strong>RANK</strong>
      <small>Find the most relevant pages</small>
    </div>

  </div>

  <div class="status" id="status">
    Ready
  </div>

  <div class="progress">
    <i></i>
  </div>

</section>


<main id="results">

  <div class="empty">
    Search for anything.
  </div>

</main>


<script>
/* =========================================================
   CYBER SEARCH ENGINE
   ========================================================= */

const STORAGE_KEY="cyber_search_engine_index";

let index={};

try{
  index=JSON.parse(
    localStorage.getItem(STORAGE_KEY)||"{}"
  );
}catch{
  index={};
}

let currentResults=[];
let currentQuery="";


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function tokenize(value){

  return String(value||"")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g," ")
    .split(/\s+/)
    .filter(Boolean);
}


function status(text){

  document.getElementById(
    "status"
  ).textContent=text;
}


function saveIndex(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(index)
    );

  }catch{

    /*
      If the browser storage is full,
      retain only the newest pages.
    */

    const pages=
      Object.values(index)
      .sort(
        (a,b)=>
          b.time-a.time
      )
      .slice(0,250);

    index={};

    pages.forEach(
      page=>
        index[page.url]=page
    );

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(index)
    );
  }
}


/* =========================================================
   FETCH SYSTEM
   ========================================================= */

/*
  We deliberately use several routes.

  Route 1:
  Direct request.

  Route 2:
  Jina reader.

  Route 3:
  Google discovery.

  Route 4:
  Wikipedia API.

  If one service fails, search continues.
*/

async function fetchWithTimeout(
  url,
  timeout=9000
){

  const controller=
    new AbortController();

  const timer=
    setTimeout(
      ()=>controller.abort(),
      timeout
    );

  try{

    const response=
      await fetch(
        url,
        {
          signal:
            controller.signal
        }
      );

    if(!response.ok)
      throw new Error(
        "HTTP "+response.status
      );

    return response;

  }finally{

    clearTimeout(timer);

  }
}


async function readerFetch(url){

  try{

    const response=
      await fetchWithTimeout(
        "https://r.jina.ai/"+url,
        10000
      );

    return await response.text();

  }catch{

    return "";
  }
}


async function jsonFetch(url){

  try{

    const response=
      await fetchWithTimeout(
        url,
        8000
      );

    return await response.json();

  }catch{

    return null;
  }
}


/* =========================================================
   INDEXING
   ========================================================= */

function createDocument(
  url,
  title,
  text,
  source
){

  const words=
    tokenize(
      title+" "+text
    );

  const frequencies={};

  words.forEach(
    word=>{
      frequencies[word]=
        (frequencies[word]||0)+1;
    }
  );

  return {

    url,
    title:
      title||url,

    text:
      text||"",

    frequencies,

    source:
      source||"Web",

    time:
      Date.now()

  };
}


function addDocument(document){

  if(!document?.url)
    return;

  index[
    document.url
  ]=document;

  saveIndex();
}


/* =========================================================
   CRAWLING
   ========================================================= */

async function crawl(url){

  const text=
    await readerFetch(url);

  if(!text)
    return null;


  let title="";

  const titleMatch=
    text.match(
      /^#\s+(.+)$/m
    );

  if(titleMatch)
    title=titleMatch[1];


  if(!title){

    try{

      title=
        new URL(url)
        .hostname;

    }catch{

      title=url;

    }
  }


  /*
    Strip Markdown formatting
    while keeping useful text.
  */

  const clean=
    text

      .replace(
        /!\[[^\]]*\]\([^)]*\)/g,
        " "
      )

      .replace(
        /\[([^\]]+)\]\([^)]*\)/g,
        "$1"
      )

      .replace(
        /[#>*`]/g,
        " "
      )

      .replace(
        /\s+/g,
        " "
      )

      .trim();


  const document=
    createDocument(
      url,
      title,
      clean,
      "Crawler"
    );


  addDocument(
    document
  );


  return document;
}


/* =========================================================
   DISCOVERY
   ========================================================= */

async function discover(query){

  const found=[];


  /*
    Google discovery.
  */

  const google=
    await readerFetch(
      "https://www.google.com/search?q="+
      encodeURIComponent(query)
    );


  /*
    Extract Markdown links.
  */

  const markdownLinks=
    google.matchAll(
      /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g
    );


  for(
    const match of markdownLinks
  ){

    const url=
      match[2]
        .replace(
          /[.,;:]+$/,
          ""
        );


    try{

      const host=
        new URL(url)
        .hostname;


      if(
        /google\./i.test(host)
      )
        continue;


      found.push({
        title:match[1],
        url
      });


    }catch{}

  }


  /*
    Raw URL fallback.
  */

  if(!found.length){

    const urls=
      google.match(
        /https?:\/\/[^\s<>"')]+/g
      )||[];


    urls.forEach(
      url=>{

        try{

          const host=
            new URL(url)
            .hostname;


          if(
            /google\./i.test(host)
          )
            return;


          found.push({
            title:
              host,
            url
          });

        }catch{}

      }
    );

  }


  return [
    ...new Map(
      found.map(
        x=>[
          x.url,
          x
        ]
      )
    ).values()
  ].slice(0,12);
}


/* =========================================================
   WIKIPEDIA
   ========================================================= */

async function wikipedia(
  query
){

  const data=
    await jsonFetch(

      "https://en.wikipedia.org/w/api.php"+
      "?action=query"+
      "&list=search"+
      "&srsearch="+
      encodeURIComponent(query)+
      "&srlimit=8"+
      "&format=json"+
      "&origin=*"

    );


  if(
    !data?.query?.search
  )
    return [];


  return data.query.search.map(
    item=>({

      title:item.title,

      url:
        "https://en.wikipedia.org/wiki/"+
        encodeURIComponent(
          item.title
            .replace(/ /g,"_")
        ),

      snippet:
        item.snippet
          .replace(
            /<[^>]+>/g,
            ""
          ),

      source:
        "Wikipedia",

      type:
        "knowledge"

    })
  );
}


/* =========================================================
   RANKING
   ========================================================= */

function rank(
  query,
  documents
){

  const terms=
    [
      ...new Set(
        tokenize(query)
      )
    ];


  return documents
    .map(
      document=>{

        const title=
          String(
            document.title
          ).toLowerCase();


        const body=
          String(
            document.text||
            document.snippet||
            ""
          ).toLowerCase();


        const url=
          String(
            document.url
          ).toLowerCase();


        let score=0;

        let matches=0;


        terms.forEach(
          term=>{

            const frequency=
              document
                .frequencies?.[term]||0;


            if(
              frequency>0
            )
              matches++;


            /*
              Term frequency
            */

            score+=
              Math.min(
                frequency,
                15
              )*2;


            /*
              Title
            */

            if(
              title.includes(term)
            )
              score+=30;


            /*
              URL
            */

            if(
              url.includes(term)
            )
              score+=8;


            /*
              Text
            */

            if(
              body.includes(term)
            )
              score+=5;

          }
        );


        /*
          Exact phrase
        */

        if(
          body.includes(
            query.toLowerCase()
          )
        )
          score+=40;


        /*
          Exact title
        */

        if(
          title===
          query.toLowerCase()
        )
          score+=70;


        /*
          Query coverage
        */

        const coverage=
          terms.length
            ? matches/terms.length
            : 0;


        score+=
          coverage*30;


        return {
          ...document,
          score
        };

      }
    )
    .sort(
      (a,b)=>
        b.score-a.score
    );
}


/* =========================================================
   SEARCH
   ========================================================= */

async function search(
  query
){

  /*
    STEP 1
    Search existing index.
  */

  status(
    "Searching index..."
  );


  let results=
    rank(
      query,
      Object.values(index)
    );


  /*
    STEP 2
    Crawl when index doesn't have
    enough relevant pages.
  */

  if(
    results.length<5 ||
    !results[0] ||
    results[0].score<15
  ){

    status(
      "Crawling the web..."
    );


    const discovered=
      await discover(
        query
      );


    /*
      Crawl in parallel.
    */

    await Promise.all(
      discovered
        .slice(0,8)
        .map(
          page=>
            crawl(
              page.url
            )
        )
    );


    /*
      Rank again.
    */

    status(
      "Ranking pages..."
    );


    results=
      rank(
        query,
        Object.values(index)
      );

  }


  /*
    STEP 3
    Always add Wikipedia results
    as a structured knowledge source.
  */

  const wiki=
    await wikipedia(
      query
    );


  wiki.forEach(
    item=>{

      const existing=
        index[item.url];


      if(!existing){

        addDocument({

          url:item.url,

          title:item.title,

          text:item.snippet,

          snippet:item.snippet,

          source:"Wikipedia",

          time:Date.now(),

          frequencies:
            Object.fromEntries(
              tokenize(
                item.title+
                " "+
                item.snippet
              ).map(
                word=>[
                  word,
                  1
                ]
              )
            )

        });

      }

    }
  );


  /*
    Re-rank everything.
  */

  results=
    rank(
      query,
      Object.values(index)
    );


  /*
    If absolutely everything failed,
    provide a direct live-search result
    instead of showing "No results".
  */

  if(!results.length){

    results=[{

      url:
        "https://www.google.com/search?q="+
        encodeURIComponent(query),

      title:
        "Search Google for "+query,

      text:
        "Open the live Google search results.",

      source:
        "Google",

      score:1

    }];

  }


  status(
    "Results ready • "+
    results.length+
    " results"
  );


  return results;
}


/* =========================================================
   OVERVIEW
   ========================================================= */

function overview(
  query,
  results
){

  const top=
    results
      .slice(0,3);


  let text=
    "The search engine crawled public "+
    "sources, indexed the information it "+
    "could retrieve, and ranked the "+
    "matching pages for this query.";


  if(top.length){

    text+=
      " The highest-ranked sources were "+
      top
        .map(
          r=>r.source||"Web"
        )
        .join(", ")+
      ".";
  }


  return `

    <section class="overview">

      <h2>
        Overview
      </h2>

      <p>
        ${escapeHTML(text)}
      </p>

      <p>
        <b>Search pipeline:</b>
        Crawl → Index → Rank → Serve
      </p>

    </section>

  `;
}


/* =========================================================
   RESULTS
   ========================================================= */

function renderResults(
  query,
  results
){

  const root=
    document.getElementById(
      "results"
    );


  currentResults=
    results;

  currentQuery=
    query;


  let html=
    overview(
      query,
      results
    );


  results
    .slice(0,20)
    .forEach(
      (result,index)=>{

        html+=`

          <article
            class="result"
          >

            <div class="score">

              ${Number(
                result.score||0
              ).toFixed(1)}

            </div>


            <div class="url">

              ${escapeHTML(
                result.url
              )}

            </div>


            <div
              class="title"
              onclick="
                openResult(
                  ${index}
                )
              "
            >

              ${escapeHTML(
                result.title
              )}

            </div>


            <div class="snippet">

              ${escapeHTML(
                result.text||
                result.snippet||
                "Open this result to read the page."
              ).slice(
                0,
                400
              )}

            </div>

          </article>

        `;

      }
    );


  root.innerHTML=
    html;
}


/* =========================================================
   READER
   ========================================================= */

async function openResult(
  index
){

  const result=
    currentResults[index];


  if(!result)
    return;


  status(
    "Reading webpage..."
  );


  const root=
    document.getElementById(
      "results"
    );


  const markdown=
    await readerFetch(
      result.url
    );


  if(!markdown){

    /*
      Automatic iframe fallback.
      No manual mode switch.
    */

    root.innerHTML=`

      <button
        class="back"
        onclick="
          renderResults(
            currentQuery,
            currentResults
          )
        "
      >
        ← Back
      </button>

      <section class="reader">

        <h1>
          ${escapeHTML(
            result.title
          )}
        </h1>

        <iframe
          src="${escapeHTML(
            result.url
          )}"
          style="
            width:100%;
            height:75vh;
            border:1px solid #ddd;
            border-radius:10px;
          "
        ></iframe>

      </section>

    `;


    status(
      "Opened webpage"
    );


    return;
  }


  root.innerHTML=`

    <button
      class="back"
      onclick="
        renderResults(
          currentQuery,
          currentResults
        )
      "
    >
      ← Back to results
    </button>

    <article class="reader">

      <h1>
        ${escapeHTML(
          result.title
        )}
      </h1>

      ${markdownToHTML(
        markdown,
        result.url
      )}

    </article>

  `;


  status(
    "Page reconstructed"
  );
}


/* =========================================================
   READER CONVERSION
   ========================================================= */

function markdownToHTML(
  markdown,
  base
){

  let html=
    escapeHTML(
      markdown
    );


  /*
    Headings
  */

  html=
    html.replace(
      /^### (.*)$/gm,
      "<h3>$1</h3>"
    );


  html=
    html.replace(
      /^## (.*)$/gm,
      "<h2>$1</h2>"
    );


  html=
    html.replace(
      /^# (.*)$/gm,
      "<h1>$1</h1>"
    );


  /*
    Images
  */

  html=
    html.replace(
      /!\[([^\]]*)\]\(([^)]+)\)/g,
      (_,alt,url)=>{

        try{

          url=
            new URL(
              url,
              base
            ).href;

        }catch{}

        return `

          <img
            src="${escapeHTML(url)}"
            alt="${escapeHTML(alt)}"
            loading="lazy"
          >

        `;

      }
    );


  /*
    Links
  */

  html=
    html.replace(
      /\[([^\]]+)\]\(([^)]+)\)/g,
      (_,text,url)=>{

        try{

          url=
            new URL(
              url,
              base
            ).href;

        }catch{}

        return `

          <a
            href="${escapeHTML(url)}"
            target="_blank"
            rel="noopener"
          >
            ${text}
          </a>

        `;

      }
    );


  /*
    YouTube links
    automatically become playable videos.
  */

  html=
    html.replace(
      /https?:\/\/(?:www\.)?youtube\.com\/watch\?v=([A-Za-z0-9_-]{11})/g,
      (_,id)=>`

        <div class="video-grid">

          <div class="video">

            <iframe
              src="https://www.youtube.com/embed/${id}"
              allowfullscreen
              loading="lazy"
            ></iframe>

            <div>
              YouTube video
            </div>

          </div>

        </div>

      `
    );


  html=
    html.replace(
      /\n{2,}/g,
      "</p><p>"
    );


  return `
    <p>${html}</p>
  `;
}


/* =========================================================
   SEARCH FORM
   ========================================================= */

document
  .getElementById(
    "searchForm"
  )
  .addEventListener(
    "submit",
    async event=>{

      event.preventDefault();


      const input=
        document.getElementById(
          "query"
        );


      const query=
        input.value.trim();


      if(!query)
        return;


      document
        .getElementById(
          "results"
        )
        .innerHTML=`

          <div class="loading">

            Crawling → Indexing → Ranking...

          </div>

        `;


      try{

        const results=
          await search(
            query
          );


        renderResults(
          query,
          results
        );

      }catch(error){

        console.error(error);


        /*
          Never show a blank/no-results
          page because one provider failed.
        */

        const fallback=[{

          title:
            "Search Google for "+query,

          url:
            "https://www.google.com/search?q="+
            encodeURIComponent(query),

          text:
            "The external search services did not respond. Click this result to continue with a live Google search.",

          source:"Google",

          score:1

        }];


        renderResults(
          query,
          fallback
        );


        status(
          "Fallback search ready"
        );

      }

    }
  );


/* =========================================================
   STARTUP
   ========================================================= */

status(
  "Ready • "+
  Object.keys(index).length+
  " indexed pages"
);

</script>

</body>
</html>
