<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberRevision | Study Hub</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --heading: #ffffff;
            --primary: #238636;
            --purple: #8957e5;
            --red: #da3633;
            --muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        h1 { color: var(--heading); font-size: 1.5rem; letter-spacing: 1px; }
        nav button { margin-left: 5px; }

        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 15px; }
        .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .grid { display: grid; gap: 15px; }
        .g2 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .g3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

        input, select, textarea { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; margin-bottom: 10px; }
        input:focus, select:focus, textarea:focus { outline: 1px solid var(--purple); }

        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; background: var(--border); transition: 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn.primary { background: var(--primary); }
        .btn.purple { background: var(--purple); }
        .btn.red { background: var(--red); }

        .badge { display: inline-block; padding: 2px 8px; font-size: 11px; font-weight: bold; border-radius: 12px; background: var(--border); color: var(--text); margin-bottom: 8px; }
        .badge.admin { background: var(--red); }
        .badge.op { background: var(--purple); }
        .muted { color: var(--muted); font-size: 0.85rem; }

        /* Chat UI */
        .chat-box { height: 350px; overflow-y: auto; border: 1px solid var(--border); background: var(--bg); padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .chat-msg { background: var(--panel); padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border); }
        .chat-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; }

        /* Flashcard Component */
        .card-viewer { height: 200px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 1.2rem; cursor: pointer; user-select: none; border: 2px dashed var(--purple); }
    </style>
</head>
<body>

    <header>
        <h1>CYBER // REVISION</h1>
        <nav id="navBar"></nav>
    </header>

    <main id="content"></main>

    <script>
        // 1. LIVE CLOUDFLARE WORKER BACKEND URL
        const API_URL = "https://revision.reviseio.workers.dev";

        // 2. USER AUTHENTICATION STATE
        const USER_KEY = "CYBER_USER";
        let currentUser = JSON.parse(localStorage.getItem(USER_KEY)) || { username: "Guest_" + Math.floor(Math.random()*1000), admin: false, op: false, muted: false };

        function saveUser(user) {
            currentUser = user;
            localStorage.setItem(USER_KEY, JSON.stringify(user));
            updateNav();
        }

        function updateNav() {
            document.getElementById("navBar").innerHTML = `
                <span class="muted">Operative: <b>${escapeHTML(currentUser.username)}</b></span>
                <button class="btn" onclick="showPage('sets')">Sets</button>
                <button class="btn" onclick="showPage('create')">Create Set</button>
                <button class="btn" onclick="showPage('chat')">Global Chat</button>
                <button class="btn red" onclick="logout()">Reset User</button>
            `;
        }

        function logout() {
            localStorage.removeItem(USER_KEY);
            currentUser = { username: "Guest_" + Math.floor(Math.random()*1000), admin: false, op: false, muted: false };
            saveUser(currentUser);
            showPage('sets');
        }

        // 3. CLOUDFLARE D1 API - STUDY SETS
        async function getPublicSets() {
            try {
                const response = await fetch(`${API_URL}/api/sets`);
                if (!response.ok) throw new Error("Server error");
                return await response.json();
            } catch (err) {
                console.error("API Error:", err);
                return [];
            }
        }

        async function publishSet() {
            const name = document.getElementById("newSetName").value.trim();
            const subject = document.getElementById("newSetSubject").value;
            const fronts = document.querySelectorAll(".flash-front");
            const backs = document.querySelectorAll(".flash-back");

            const cards = [];
            for (let i = 0; i < fronts.length; i++) {
                const front = fronts[i].value.trim();
                const back = backs[i].value.trim();
                if (front && back) cards.push({ front, back });
            }

            if (!name) { alert("Enter a set name."); return; }
            if (cards.length === 0) { alert("Create at least one valid flashcard."); return; }

            const set = {
                id: "SET_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
                name: name,
                subject: subject,
                author: currentUser.username,
                authorKey: currentUser.username.toLowerCase(),
                cards: cards,
                created: Date.now()
            };

            try {
                await fetch(`${API_URL}/api/sets`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(set)
                });
                alert("Set published successfully to Cloudflare D1!");
                showPage("sets");
            } catch (err) {
                alert("Failed to reach server.");
            }
        }

        async function deleteSet(setId) {
            if (!confirm("Are you sure you want to delete this study set?")) return;
            try {
                await fetch(`${API_URL}/api/sets/${setId}`, { method: "DELETE" });
                renderSets();
            } catch (err) {
                alert("Delete failed.");
            }
        }

        // 4. CLOUDFLARE D1 API - GLOBAL CHAT
        let chatInterval = null;

        async function getChatMessages() {
            try {
                const response = await fetch(`${API_URL}/api/chat`);
                if (!response.ok) throw new Error();
                return await response.json();
            } catch (err) {
                return [];
            }
        }

        async function sendChatMessage() {
            if (currentUser.muted) { alert("You are muted."); return; }
            const input = document.getElementById("chatInput");
            const text = input.value.trim();
            if (!text) return;

            const msg = {
                author: currentUser.username,
                text: text,
                admin: currentUser.admin,
                op: currentUser.op,
                time: Date.now()
            };

            try {
                await fetch(`${API_URL}/api/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(msg)
                });
                input.value = "";
                renderChat();
            } catch (err) {
                alert("Failed to send message.");
            }
        }

        async function clearChat() {
            if (!confirm("Clear all messages?")) return;
            await fetch(`${API_URL}/api/chat`, { method: "DELETE" });
            renderChat();
        }

        // 5. VIEW RENDERERS
        async function renderSets() {
            clearInterval(chatInterval);
            document.getElementById("content").innerHTML = `<p class="muted">Loading study sets from Cloudflare D1...</p>`;
            
            const allSets = await getPublicSets();
            const searchVal = (document.getElementById("setSearchInput")?.value || "").toLowerCase();
            const filterSubject = document.getElementById("setSubjectFilter")?.value || "ALL";

            const filtered = allSets.filter(s => {
                const matchesSearch = s.name.toLowerCase().includes(searchVal) || s.subject.toLowerCase().includes(searchVal);
                const matchesSubject = filterSubject === "ALL" || s.subject === filterSubject;
                return matchesSearch && matchesSubject;
            });

            document.getElementById("content").innerHTML = `
                <div class="panel">
                    <h2>PUBLIC STUDY NETWORK</h2>
                    <p class="muted">Search and browse sets saved live in the cloud.</p>
                    <br>
                    <div class="grid g2">
                        <input id="setSearchInput" placeholder="Search by name..." value="${escapeHTML(searchVal)}" oninput="renderSets()">
                        <select id="setSubjectFilter" onchange="renderSets()">
                            <option value="ALL">All Subjects</option>
                            <option value="Maths" ${filterSubject==='Maths'?'selected':''}>Maths</option>
                            <option value="Science" ${filterSubject==='Science'?'selected':''}>Science</option>
                            <option value="Computer Science" ${filterSubject==='Computer Science'?'selected':''}>Computer Science</option>
                            <option value="Other" ${filterSubject==='Other'?'selected':''}>Other</option>
                        </select>
                    </div>
                </div>
                <div class="grid g3">
                    ${filtered.length ? filtered.map(set => `
                        <div class="panel">
                            <span class="badge">${escapeHTML(set.subject)}</span>
                            <h3>${escapeHTML(set.name)}</h3>
                            <div class="muted" style="margin: 5px 0 15px 0;">Cards: ${set.cards.length} \vert{} Author:${escapeHTML(set.author)}</div>
                            <div class="actions">
                                <button class="btn primary" onclick="startStudy('${set.id}')">STUDY</button>
                                ${currentUser.username.toLowerCase() === set.authorKey || currentUser.admin ? `<button class="btn red" onclick="deleteSet('${set.id}')">DELETE</button>` : ''}
                            </div>
                        </div>
                    `).join('') : '<p class="muted">No study sets found.</p>'}
                </div>
            `;
        }

        function renderCreateSet() {
            clearInterval(chatInterval);
            document.getElementById("content").innerHTML = `
                <div class="panel">
                    <h2>CREATE STUDY SET</h2>
                    <br>
                    <input id="newSetName" placeholder="Set Title (e.g., GCSE Physics Units)">
                    <select id="newSetSubject">
                        <option value="Maths">Maths</option>
                        <option value="Science">Science</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Other">Other</option>
                    </select>
                    <br><br>
                    <h3>CARDS</h3>
                    <div id="cardInputs">
                        <div class="grid g2" style="margin-bottom:10px;">
                            <input class="flash-front" placeholder="Front (Question)">
                            <input class="flash-back" placeholder="Back (Answer)">
                        </div>
                    </div>
                    <button class="btn" onclick="addCardInput()">+ Add Card</button>
                    <button class="btn primary" onclick="publishSet()">Publish to D1</button>
                </div>
            `;
        }

        function addCardInput() {
            const div = document.createElement("div");
            div.className = "grid g2";
            div.style.marginBottom = "10px";
            div.innerHTML = `<input class="flash-front" placeholder="Front (Question)"><input class="flash-back" placeholder="Back (Answer)">`;
            document.getElementById("cardInputs").appendChild(div);
        }

        async function renderChat() {
            const msgs = await getChatMessages();
            document.getElementById("content").innerHTML = `
                <div class="panel">
                    <div class="row-head">
                        <h2>GLOBAL CHAT</h2>
                        ${currentUser.admin ? `<button class="btn red" onclick="clearChat()">CLEAR</button>` : ''}
                    </div>
                    <div class="chat-box" id="chatBox">
                        ${msgs.map(m => `
                            <div class="chat-msg">
                                <div class="chat-header">
                                    <b>${escapeHTML(m.author)}</b>
                                    <span class="muted">${new Date(m.time).toLocaleTimeString()}</span>
                                </div>
                                <div>${escapeHTML(m.text)}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="grid g2">
                        <input id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                        <button class="btn primary" onclick="sendChatMessage()">SEND</button>
                    </div>
                </div>
            `;
            const box = document.getElementById("chatBox");
            if (box) box.scrollTop = box.scrollHeight;
        }

        // 6. FLASHCARD STUDY MODE
        async function startStudy(setId) {
            clearInterval(chatInterval);
            const sets = await getPublicSets();
            const set = sets.find(s => s.id === setId);
            if (!set || !set.cards.length) return alert("Set not found or empty.");

            let currentIndex = 0;
            let showingFront = true;

            function renderCard() {
                const card = set.cards[currentIndex];
                document.getElementById("content").innerHTML = `
                    <div class="panel" style="max-width: 600px; margin: 0 auto; text-align: center;">
                        <h2>${escapeHTML(set.name)}</h2>
                        <div class="muted">Card ${currentIndex + 1} of ${set.cards.length}</div>
                        <br>
                        <div class="panel card-viewer" onclick="flip()">${showingFront ? escapeHTML(card.front) : escapeHTML(card.back)}</div>
                        <p class="muted">Click card to flip</p>
                        <br>
                        <button class="btn" onclick="prev()">Previous</button>
                        <button class="btn primary" onclick="next()">Next</button>
                        <button class="btn red" onclick="showPage('sets')">Exit</button>
                    </div>
                `;
            }

            window.flip = () => { showingFront = !showingFront; renderCard(); };
            window.next = () => { if(currentIndex < set.cards.length - 1) { currentIndex++; showingFront = true; renderCard(); } };
            window.prev = () => { if(currentIndex > 0) { currentIndex--; showingFront = true; renderCard(); } };

            renderCard();
        }

        // HELPER UTILS
        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
        }

        function showPage(page) {
            if (page === 'sets') renderSets();
            if (page === 'create') renderCreateSet();
            if (page === 'chat') {
                renderChat();
                clearInterval(chatInterval);
                chatInterval = setInterval(renderChat, 3000); // Polling every 3 seconds
            }
        }

        // INIT
        updateNav();
        showPage('sets');
    </script>
</body>
</html>
