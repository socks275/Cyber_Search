<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebBook OS - Virtual macOS Desktop</title>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        macGray: {
                            100: '#F5F5F7',
                            200: '#E5E5EA',
                            700: '#2C2C2E',
                            800: '#1C1C1E',
                            900: '#000000',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Custom Glassmorphism & UI Styles -->
    <style>
        * {
            user-select: none;
            -webkit-user-drag: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Glassmorphism backgrounds */
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass-panel {
            background: rgba(30, 30, 30, 0.65);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-dock {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass-dock {
            background: rgba(20, 20, 20, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Wallpapers */
        .wp-aurora {
            background: linear-gradient(135deg, #051937 0%, #004d7a 30%, #008793 70%, #00bf72 100%);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
        }

        .wp-sunset {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .wp-midnight {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
        }

        .wp-space {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* macOS Dock Hover Effects */
        .dock-item {
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .dock-item:hover {
            transform: scale(1.3) translateY(-12px);
        }
        .dock-item:hover + .dock-item,
        .dock-item:has(+ .dock-item:hover) {
            transform: scale(1.15) translateY(-6px);
        }

        /* Window Resizing Cursor Handles */
        .win-resize-handle {
            position: absolute;
            z-index: 10;
        }
        .res-e { right: 0; top: 0; bottom: 0; width: 6px; cursor: e-resize; }
        .res-s { bottom: 0; left: 0; right: 0; height: 6px; cursor: s-resize; }
        .res-se { right: 0; bottom: 0; width: 10px; height: 10px; cursor: se-resize; }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(150, 150, 150, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 100, 100, 0.6);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden wp-aurora select-none text-gray-800 dark:text-gray-100">

    <!-- TOP MENU BAR -->
    <header class="fixed top-0 left-0 right-0 h-7 glass-panel z-50 flex items-center justify-between px-3 text-xs font-medium text-white shadow-sm">
        <!-- Left Menu -->
        <div class="flex items-center space-x-3">
            <div id="apple-menu-btn" class="cursor-pointer hover:opacity-80 px-1 py-0.5 rounded transition">
                <i class="fa-brands fa-apple text-base"></i>
            </div>
            <span class="font-bold cursor-pointer" id="active-app-name">Finder</span>
            <div class="hidden md:flex items-center space-x-3 text-gray-200">
                <span class="cursor-pointer hover:text-white transition">File</span>
                <span class="cursor-pointer hover:text-white transition">Edit</span>
                <span class="cursor-pointer hover:text-white transition">View</span>
                <span class="cursor-pointer hover:text-white transition">Go</span>
                <span class="cursor-pointer hover:text-white transition">Window</span>
                <span class="cursor-pointer hover:text-white transition">Help</span>
            </div>
        </div>

        <!-- Right Menu Indicator Status -->
        <div class="flex items-center space-x-3 text-gray-100">
            <span class="hover:bg-white/10 px-1.5 py-0.5 rounded cursor-pointer"><i class="fa-solid fa-wifi"></i></span>
            <span class="hover:bg-white/10 px-1.5 py-0.5 rounded cursor-pointer"><i class="fa-solid fa-battery-three-quarters text-sm"></i></span>
            <span id="spotlight-btn" class="hover:bg-white/10 px-1.5 py-0.5 rounded cursor-pointer"><i class="fa-solid fa-magnifying-glass"></i></span>
            <span id="menu-time" class="font-semibold cursor-pointer px-1.5 py-0.5 hover:bg-white/10 rounded">Mon 10:00 AM</span>
        </div>

        <!-- Apple Dropdown Menu -->
        <div id="apple-menu-dropdown" class="hidden absolute top-7 left-2 w-52 glass-panel rounded-lg shadow-2xl py-1 text-xs z-50 text-gray-800 dark:text-gray-100">
            <div onclick="openApp('settings')" class="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer flex items-center justify-between">
                <span>About This WebBook</span><i class="fa-solid fa-circle-info"></i>
            </div>
            <div onclick="openApp('settings')" class="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer flex items-center justify-between">
                <span>System Settings...</span><i class="fa-solid fa-gear"></i>
            </div>
            <div onclick="openApp('appstore')" class="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer flex items-center justify-between">
                <span>App Store...</span><i class="fa-solid fa-bag-shopping"></i>
            </div>
            <hr class="my-1 border-gray-300 dark:border-gray-600 opacity-40">
            <div onclick="location.reload()" class="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer flex items-center justify-between">
                <span>Restart...</span><i class="fa-solid fa-rotate-right"></i>
            </div>
            <div onclick="showToast('Lock Screen Enabled');" class="px-3 py-1.5 hover:bg-blue-600 hover:text-white cursor-pointer flex items-center justify-between">
                <span>Lock Screen</span><i class="fa-solid fa-lock"></i>
            </div>
        </div>
    </header>

    <!-- DESKTOP CONTAINER -->
    <main id="desktop" class="relative w-full h-full pt-7 pb-20 overflow-hidden">
        <!-- Desktop Shortcuts -->
        <div id="desktop-icons" class="p-4 grid grid-cols-1 gap-6 w-28 text-center text-white text-xs drop-shadow-md">
            <!-- Programmatically initialized or static shortcuts -->
            <div onclick="openApp('files')" class="flex flex-col items-center group cursor-pointer p-1 rounded hover:bg-white/10 transition">
                <i class="fa-solid fa-folder text-yellow-400 text-4xl group-hover:scale-105 transition transform"></i>
                <span class="mt-1 font-medium leading-tight">My Files</span>
            </div>
            <div onclick="openApp('notes')" class="flex flex-col items-center group cursor-pointer p-1 rounded hover:bg-white/10 transition">
                <i class="fa-solid fa-note-sticky text-yellow-300 text-4xl group-hover:scale-105 transition transform"></i>
                <span class="mt-1 font-medium leading-tight">Quick Notes</span>
            </div>
            <div onclick="openApp('snake')" class="flex flex-col items-center group cursor-pointer p-1 rounded hover:bg-white/10 transition">
                <i class="fa-solid fa-gamepad text-green-400 text-4xl group-hover:scale-105 transition transform"></i>
                <span class="mt-1 font-medium leading-tight">Snake Game</span>
            </div>
        </div>

        <!-- WINDOWS HOST CONTAINER -->
        <div id="windows-container" class="absolute inset-0 pt-7 pb-20 pointer-events-none">
            <!-- Dynamic Applications Windows inserted here -->
        </div>
    </main>

    <!-- SPOTLIGHT SEARCH POPUP -->
    <div id="spotlight-modal" class="hidden fixed top-1/4 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-xl glass-panel rounded-xl shadow-2xl p-3 z-50">
        <div class="flex items-center space-x-3 px-2 border-b border-gray-300 dark:border-gray-700 pb-2">
            <i class="fa-solid fa-magnifying-glass text-gray-400 text-lg"></i>
            <input type="text" id="spotlight-input" placeholder="Spotlight Search or Web Query..." class="w-full bg-transparent border-none outline-none text-lg text-gray-800 dark:text-gray-100 placeholder-gray-400">
        </div>
        <div id="spotlight-results" class="mt-2 max-h-60 overflow-y-auto space-y-1 text-sm">
            <!-- Results populated via JS -->
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed top-10 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- MACOS DOCK -->
    <div class="fixed bottom-2 left-1/2 transform -translate-x-1/2 z-40">
        <div id="dock-bar" class="glass-dock px-3 py-2 rounded-2xl flex items-end space-x-2 shadow-2xl transition-all">
            <!-- Dock items loaded dynamically -->
        </div>
    </div>

    <script>
        /* APP DEFINITIONS DATABASE */
        const ALL_APPS = {
            browser: { id: 'browser', name: 'Browser', icon: 'fa-compass', color: 'bg-blue-500', category: 'Productivity' },
            appstore: { id: 'appstore', name: 'App Store', icon: 'fa-bag-shopping', color: 'bg-blue-600', category: 'System' },
            files: { id: 'files', name: 'Files', icon: 'fa-folder', color: 'bg-yellow-500', category: 'Utilities' },
            notes: { id: 'notes', name: 'Notes', icon: 'fa-note-sticky', color: 'bg-amber-400', category: 'Productivity' },
            texteditor: { id: 'texteditor', name: 'Text Editor', icon: 'fa-file-lines', color: 'bg-gray-600', category: 'Productivity' },
            calculator: { id: 'calculator', name: 'Calculator', icon: 'fa-calculator', color: 'bg-orange-500', category: 'Utilities' },
            terminal: { id: 'terminal', name: 'Terminal', icon: 'fa-terminal', color: 'bg-black', category: 'Utilities' },
            calendar: { id: 'calendar', name: 'Calendar', icon: 'fa-calendar-days', color: 'bg-red-500', category: 'Productivity' },
            worldclock: { id: 'worldclock', name: 'World Clock', icon: 'fa-globe', color: 'bg-indigo-600', category: 'Utilities' },
            timer: { id: 'timer', name: 'Timer & Stop Watch', icon: 'fa-stopwatch', color: 'bg-orange-600', category: 'Utilities' },
            translator: { id: 'translator', name: 'Translator', icon: 'fa-language', color: 'bg-teal-500', category: 'Utilities' },
            maps: { id: 'maps', name: 'Maps', icon: 'fa-map-location-dot', color: 'bg-emerald-500', category: 'Utilities' },
            weather: { id: 'weather', name: 'Weather', icon: 'fa-cloud-sun', color: 'bg-sky-400', category: 'Utilities' },
            paint: { id: 'paint', name: 'Paint', icon: 'fa-palette', color: 'bg-pink-500', category: 'Media' },
            music: { id: 'music', name: 'Music Player', icon: 'fa-music', color: 'bg-rose-500', category: 'Media' },
            photos: { id: 'photos', name: 'Photos', icon: 'fa-images', color: 'bg-purple-500', category: 'Media' },
            snake: { id: 'snake', name: 'Snake Game', icon: 'fa-gamepad', color: 'bg-green-600', category: 'Games' },
            game2048: { id: 'game2048', name: '2048', icon: 'fa-cubes', color: 'bg-amber-600', category: 'Games' },
            tictactoe: { id: 'tictactoe', name: 'Tic Tac Toe', icon: 'fa-xmark', color: 'bg-violet-600', category: 'Games' },
            memory: { id: 'memory', name: 'Memory Match', icon: 'fa-brain', color: 'bg-pink-600', category: 'Games' },
            settings: { id: 'settings', name: 'Settings', icon: 'fa-gear', color: 'bg-gray-500', category: 'System' }
        };

        // State Management
        let installedApps = JSON.parse(localStorage.getItem('wb_installed_apps')) || Object.keys(ALL_APPS);
        let openWindows = {}; // track open window states
        let highestZIndex = 100;
        let activeAppId = 'Finder';

        window.addEventListener('DOMContentLoaded', () => {
            initClock();
            renderDock();
            setupEventListeners();
            initSpotlight();
        });

        // Dynamic Top Bar Time
        function initClock() {
            const timeEl = document.getElementById('menu-time');
            const update = () => {
                const now = new Date();
                timeEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
            };
            update();
            setInterval(update, 1000);
        }

        // Render Dock Icons
        function renderDock() {
            const dock = document.getElementById('dock-bar');
            dock.innerHTML = '';

            installedApps.forEach(appId => {
                const app = ALL_APPS[appId];
                if (!app) return;

                const isOpen = !!openWindows[appId];
                const item = document.createElement('div');
                item.className = 'dock-item relative group cursor-pointer flex flex-col items-center';
                item.onclick = () => toggleAppWindow(appId);

                item.innerHTML = `
                    <div class="w-12 h-12 ${app.color} rounded-xl shadow-lg flex items-center justify-center text-white text-xl transition-all duration-150 group-active:scale-95">
                        <i class="fa-solid ${app.icon}"></i>
                    </div>
                    <!-- Tooltip -->
                    <span class="absolute -top-10 scale-0 group-hover:scale-100 transition-all bg-gray-900/90 text-white text-xs px-2 py-1 rounded shadow-md pointer-events-none whitespace-nowrap">
                        ${app.name}
                    </span>
                    <!-- Active Dot -->
                    <div class="w-1.5 h-1.5 rounded-full bg-white mt-1 opacity-${isOpen ? '100' : '0'}"></div>
                `;
                dock.appendChild(item);
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'pointer-events-auto glass-panel border border-white/20 px-4 py-2.5 rounded-xl shadow-xl flex items-center space-x-3 text-sm text-white transform translate-x-full transition-all duration-300';
            toast.innerHTML = `
                <i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation text-red-400' : 'fa-bell text-blue-400'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-x-full'), 10);
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setupEventListeners() {
            // Apple Menu Toggle
            document.getElementById('apple-menu-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('apple-menu-dropdown').classList.toggle('hidden');
            });

            document.addEventListener('click', () => {
                document.getElementById('apple-menu-dropdown').classList.add('hidden');
            });

            // Spotlight Hotkey
            document.addEventListener('keydown', (e) => {
                if ((e.metaKey || e.ctrlKey) && e.code === 'Space') {
                    e.preventDefault();
                    toggleSpotlight();
                }
            });

            document.getElementById('spotlight-btn').addEventListener('click', toggleSpotlight);
        }

        function toggleSpotlight() {
            const modal = document.getElementById('spotlight-modal');
            const input = document.getElementById('spotlight-input');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                input.value = '';
                input.focus();
                renderSpotlightResults('');
            } else {
                modal.classList.add('hidden');
            }
        }

        function initSpotlight() {
            const input = document.getElementById('spotlight-input');
            input.addEventListener('input', (e) => renderSpotlightResults(e.target.value));
        }

        function renderSpotlightResults(query) {
            const container = document.getElementById('spotlight-results');
            container.innerHTML = '';
            const q = query.toLowerCase().trim();

            const filtered = Object.values(ALL_APPS).filter(app => app.name.toLowerCase().includes(q));

            filtered.forEach(app => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between p-2 hover:bg-blue-600 hover:text-white rounded-lg cursor-pointer transition';
                row.onclick = () => {
                    openApp(app.id);
                    toggleSpotlight();
                };
                row.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-7 h-7 ${app.color} rounded flex items-center justify-center text-white text-xs">
                            <i class="fa-solid ${app.icon}"></i>
                        </div>
                        <span class="font-medium">${app.name}</span>
                    </div>
                    <span class="text-xs opacity-60">Application</span>
                `;
                container.appendChild(row);
            });

            if (q.length > 0) {
                const webRow = document.createElement('div');
                webRow.className = 'flex items-center justify-between p-2 hover:bg-blue-600 hover:text-white rounded-lg cursor-pointer transition border-t border-gray-500/20 mt-1';
                webRow.onclick = () => {
                    openApp('browser');
                    setTimeout(() => {
                        const iframe = document.getElementById('browser-iframe');
                        if (iframe) iframe.src = `https://duckduckgo.com/?q=${encodeURIComponent(q)}`;
                    }, 300);
                    toggleSpotlight();
                };
                webRow.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-globe text-blue-400"></i>
                        <span>Search Web for "${q}"</span>
                    </div>
                    <i class="fa-solid fa-arrow-right text-xs opacity-60"></i>
                `;
                container.appendChild(webRow);
            }
        }

        function toggleAppWindow(appId) {
            if (openWindows[appId]) {
                const win = document.getElementById(`win-${appId}`);
                if (win.classList.contains('hidden')) {
                    win.classList.remove('hidden');
                    bringToFront(appId);
                } else if (parseInt(win.style.zIndex) === highestZIndex) {
                    win.classList.add('hidden'); // Minimize toggle
                } else {
                    bringToFront(appId);
                }
            } else {
                openApp(appId);
            }
        }

        function bringToFront(appId) {
            highestZIndex++;
            const win = document.getElementById(`win-${appId}`);
            if (win) {
                win.style.zIndex = highestZIndex;
                document.getElementById('active-app-name').textContent = ALL_APPS[appId]?.name || 'Finder';
            }
        }

        function openApp(appId) {
            if (openWindows[appId]) {
                const win = document.getElementById(`win-${appId}`);
                win.classList.remove('hidden');
                bringToFront(appId);
                return;
            }

            const app = ALL_APPS[appId];
            if (!app) return;

            const win = document.createElement('div');
            win.id = `win-${appId}`;
            win.className = 'pointer-events-auto absolute glass-panel rounded-xl shadow-2xl flex flex-col overflow-hidden transition-shadow duration-200 border border-white/20';
            
            // Initial positioning
            const offset = (Object.keys(openWindows).length % 6) * 30;
            win.style.width = '700px';
            win.style.height = '480px';
            win.style.top = `${60 + offset}px`;
            win.style.left = `${100 + offset}px`;
            win.style.zIndex = ++highestZIndex;

            win.innerHTML = `
                <!-- Window Header -->
                <div class="win-header h-9 bg-gray-200/50 dark:bg-gray-800/50 backdrop-blur-md flex items-center justify-between px-3 cursor-move border-b border-gray-300/30 dark:border-gray-700/30">
                    <div class="flex items-center space-x-2">
                        <button onclick="closeApp('${appId}')" class="w-3 h-3 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center text-[8px] text-red-900 group">
                            <i class="fa-solid fa-xmark opacity-0 group-hover:opacity-100"></i>
                        </button>
                        <button onclick="minimizeApp('${appId}')" class="w-3 h-3 rounded-full bg-yellow-500 hover:bg-yellow-600 flex items-center justify-center text-[8px] text-yellow-900 group">
                            <i class="fa-solid fa-minus opacity-0 group-hover:opacity-100"></i>
                        </button>
                        <button onclick="maximizeApp('${appId}')" class="w-3 h-3 rounded-full bg-green-500 hover:bg-green-600 flex items-center justify-center text-[8px] text-green-900 group">
                            <i class="fa-solid fa-expand opacity-0 group-hover:opacity-100"></i>
                        </button>
                    </div>
                    <div class="text-xs font-semibold opacity-80 flex items-center space-x-2">
                        <i class="fa-solid ${app.icon}"></i>
                        <span>${app.name}</span>
                    </div>
                    <div class="w-12"></div>
                </div>

                <!-- Window Content Body -->
                <div id="content-${appId}" class="flex-1 overflow-auto bg-white/50 dark:bg-gray-900/50 backdrop-blur-md relative">
                    <!-- Dynamic App HTML -->
                </div>

                <!-- Resize Handles -->
                <div class="win-resize-handle res-e"></div>
                <div class="win-resize-handle res-s"></div>
                <div class="win-resize-handle res-se"></div>
            `;

            win.onmousedown = () => bringToFront(appId);
            document.getElementById('windows-container').appendChild(win);

            openWindows[appId] = true;
            renderDock();
            bringToFront(appId);

            // Attach Window Draggable & Resizable Handlers
            makeDraggable(win);
            makeResizable(win);

            // Mount Specific App Code
            mountAppContent(appId);
        }

        function closeApp(appId) {
            const win = document.getElementById(`win-${appId}`);
            if (win) win.remove();
            delete openWindows[appId];
            renderDock();
        }

        function minimizeApp(appId) {
            const win = document.getElementById(`win-${appId}`);
            if (win) win.classList.add('hidden');
        }

        function maximizeApp(appId) {
            const win = document.getElementById(`win-${appId}`);
            if (win.style.width === '100%') {
                win.style.width = win.dataset.prevWidth || '700px';
                win.style.height = win.dataset.prevHeight || '480px';
                win.style.top = win.dataset.prevTop || '60px';
                win.style.left = win.dataset.prevLeft || '100px';
            } else {
                win.dataset.prevWidth = win.style.width;
                win.dataset.prevHeight = win.style.height;
                win.dataset.prevTop = win.style.top;
                win.dataset.prevLeft = win.style.left;

                win.style.width = '100%';
                win.style.height = 'calc(100% - 28px)';
                win.style.top = '28px';
                win.style.left = '0px';
            }
        }

        function makeDraggable(win) {
            const header = win.querySelector('.win-header');
            let isDragging = false, startX, startY, initialLeft, initialTop;

            header.onmousedown = (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = win.offsetLeft;
                initialTop = win.offsetTop;

                document.onmousemove = (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    win.style.left = `${initialLeft + dx}px`;
                    win.style.top = `${initialTop + dy}px`;
                };

                document.onmouseup = () => { isDragging = false; };
            };
        }

        function makeResizable(win) {
            const handles = win.querySelectorAll('.win-resize-handle');
            handles.forEach(handle => {
                handle.onmousedown = (e) => {
                    e.stopPropagation();
                    let startX = e.clientX, startY = e.clientY;
                    let startW = win.offsetWidth, startH = win.offsetHeight;

                    document.onmousemove = (e) => {
                        if (handle.classList.contains('res-e') || handle.classList.contains('res-se')) {
                            win.style.width = `${Math.max(320, startW + (e.clientX - startX))}px`;
                        }
                        if (handle.classList.contains('res-s') || handle.classList.contains('res-se')) {
                            win.style.height = `${Math.max(200, startH + (e.clientY - startY))}px`;
                        }
                    };

                    document.onmouseup = () => { document.onmousemove = null; };
                };
            });
        }

            const canvas = c.querySelector('#paint-canvas');

            // Resize canvas dynamically
            setTimeout(() => {
                canvas.width = canvas.parentElement.clientWidth;

            canvas.onmousedown = () => drawing = true;
            canvas.onmouseup = () => { drawing = false; ctx.beginPath(); };

                const rect = canvas.getBoundingClientRect();
                ctx.lineWidth = c.querySelector('#paint-size').value;
                ctx.lineCap = 'round';
                ctx.strokeStyle = c.querySelector('#paint-color').value;

                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);

            c.querySelector('#paint-clear').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

                <div class="p-6 text-center h-full flex flex-col items-center justify-center">
                    <div class="w-32 h-32 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-2xl shadow-xl flex items-center justify-center text-white text-4xl mb-4">
                        <i class="fa-solid fa-music"></i>
                    </div>
                    <h3 class="font-bold text-base">Chill Synthwave Beats</h3>
                    <p class="text-xs text-gray-400 mb-4">WebBook Audio Player</p>
                    <div class="flex items-center space-x-4">
                        <button class="text-lg hover:scale-110 transition"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="w-10 h-10 bg-blue-600 rounded-full text-white flex items-center justify-center shadow hover:scale-105 transition"><i class="fa-solid fa-play"></i></button>
                        <button class="text-lg hover:scale-110 transition"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                </div>
            `;
        }

        function renderPhotos(c) {
            c.innerHTML = `
                <div class="p-4 grid grid-cols-2 md:grid-cols-3 gap-3">
                    <img src="https://picsum.photos/300/200?random=1" class="rounded-lg shadow hover:opacity-90 transition cursor-pointer">
                    <img src="https://picsum.photos/300/200?random=2" class="rounded-lg shadow hover:opacity-90 transition cursor-pointer">
                    <img src="https://picsum.photos/300/200?random=3" class="rounded-lg shadow hover:opacity-90 transition cursor-pointer">
                    <img src="https://picsum.photos/300/200?random=4" class="rounded-lg shadow hover:opacity-90 transition cursor-pointer">
                </div>
            `;
        }

        function renderSnake(c) {
            c.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full p-2">
                    <div class="text-xs font-semibold mb-1">Score: <span id="snake-score">0</span></div>
                    <canvas id="snake-canvas" width="300" height="300" class="bg-black rounded-lg border border-gray-700"></canvas>
                </div>
            `;

            const canvas = c.querySelector('#snake-canvas');
            const ctx = canvas.getContext('2d');
            let score = 0, snake = [{x: 10, y: 10}], food = {x: 15, y: 15}, dx = 1, dy = 0;

            const gameLoop = setInterval(() => {
                const head = {x: snake[0].x + dx, y: snake[0].y + dy};
                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    c.querySelector('#snake-score').textContent = score;
                    food = {Math.floor(Math.random()*20), Math.floor(Math.random()*20)};
                } else {
                    snake.pop();
                }

                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, 300, 300);

                ctx.fillStyle = 'red';
                ctx.fillRect(food.x * 15, food.y * 15, 14, 14);

                ctx.fillStyle = 'green';
                snake.forEach(s => ctx.fillRect(s.x * 15, s.y * 15, 14, 14));
            }, 150);

            const handleKey = (e) => {
                if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
                if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
                if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
                if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
            };
            document.addEventListener('keydown', handleKey);
        }

        function render2048(c) {
            c.innerHTML = `
                <div class="p-6 text-center h-full flex flex-col items-center justify-center">
                    <h2 class="text-2xl font-bold mb-2">2048 Game</h2>
                    <div class="grid grid-cols-4 gap-2 bg-amber-800 p-2 rounded-xl w-64 h-64">
                        <div class="bg-amber-100 rounded flex items-center justify-center text-xl font-bold">2</div>
                        <div class="bg-amber-200 rounded flex items-center justify-center text-xl font-bold">4</div>
                        <div class="bg-amber-100 rounded flex items-center justify-center text-xl font-bold">2</div>
                        <div class="bg-amber-300 rounded flex items-center justify-center text-xl font-bold">8</div>
                    </div>
                </div>
            `;
        }

        function renderTicTacToe(c) {
            c.innerHTML = `
                <div class="p-6 text-center h-full flex flex-col items-center justify-center">
                    <div class="grid grid-cols-3 gap-2 w-48 h-48 mb-4">
                        <button class="ttt-b bg-gray-200 dark:bg-gray-800 text-xl font-bold rounded"></button>
                        <button class="ttt-b bg-gray-200 dark:bg-gray-800 text-xl font-bold rounded"></button>
                        <button class="ttt-b bg-gray-200 dark:bg-gray-800 text-xl font-bold rounded"></button>
                        <button class="ttt-b bg-gray-200 dark:bg-gray-800 text-xl font-bold rounded"></button>
                        <button class="ttt-b bg-gray-200 dark:bg-gray-800 text-xl font-bold rounded"></button>
                        <button class="ttt-b bg-gray-200 dark:bg-gray-800 text-xl font-bold rounded"></button>
                        <button class="ttt-b bg-gray-200 dark:bg-gray-800 text-xl font-bold rounded"></button>
                        <button class="ttt-b bg-gray-200 dark:bg-gray-800 text-xl font-bold rounded"></button>
                        <button class="ttt-b bg-gray-200 dark:bg-gray-800 text-xl font-bold rounded"></button>
                    </div>
                    <button id="ttt-reset" class="bg-blue-600 text-white text-xs px-3 py-1 rounded">Reset Game</button>
                </div>
            `;

            let turn = 'X';
            const btns = c.querySelectorAll('.ttt-b');
            btns.forEach(b => {
                b.onclick = () => {
                    if (!b.textContent) {
                        b.textContent = turn;
                        turn = turn === 'X' ? 'O' : 'X';
                    }
                };
            });
            c.querySelector('#ttt-reset').onclick = () => btns.forEach(b => b.textContent = '');
        }

        function renderMemory(c) {
            c.innerHTML = `
                <div class="p-6 text-center h-full flex flex-col items-center justify-center">
                    <h3 class="font-bold mb-3">Memory Match</h3>
                    <div class="grid grid-cols-4 gap-2 w-64">
                        <div class="h-12 bg-blue-600 rounded flex items-center justify-center text-white cursor-pointer">?</div>
                        <div class="h-12 bg-blue-600 rounded flex items-center justify-center text-white cursor-pointer">?</div>
                        <div class="h-12 bg-blue-600 rounded flex items-center justify-center text-white cursor-pointer">?</div>
                        <div class="h-12 bg-blue-600 rounded flex items-center justify-center text-white cursor-pointer">?</div>
                    </div>
                </div>
            `;
        }

        function renderSettings(c) {
            c.innerHTML = `
                <div class="p-6 space-y-6">
                    <div>
                        <h3 class="font-bold text-sm mb-2">Wallpaper Preset</h3>
                        <div class="flex space-x-2">
                            <button onclick="setWallpaper('aurora')" class="w-12 h-12 rounded-lg wp-aurora shadow-md"></button>
                            <button onclick="setWallpaper('sunset')" class="w-12 h-12 rounded-lg wp-sunset shadow-md"></button>
                            <button onclick="setWallpaper('midnight')" class="w-12 h-12 rounded-lg wp-midnight shadow-md"></button>
                            <button onclick="setWallpaper('space')" class="w-12 h-12 rounded-lg wp-space shadow-md"></button>
                        </div>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm mb-2">Appearance</h3>
                        <button id="toggle-dark" class="bg-gray-700 text-white text-xs px-4 py-2 rounded-lg">Toggle Dark/Light Mode</button>
                    </div>
                    <div class="border-t border-gray-300 dark:border-gray-700 pt-4">
                        <button onclick="localStorage.clear(); location.reload();" class="bg-red-600 text-white text-xs px-4 py-2 rounded-lg">Factory Reset System</button>
                    </div>
                </div>
            `;

            c.querySelector('#toggle-dark').onclick = () => {
                document.documentElement.classList.toggle('dark');
            };

            window.setWallpaper = (wp) => {
                document.body.className = `h-screen w-screen overflow-hidden select-none text-gray-800 dark:text-gray-100 wp-${wp}`;
                showToast(`Wallpaper changed to ${wp}`);
            };
        }
    </script>
</body>
</html>
